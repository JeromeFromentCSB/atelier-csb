/* ---------- Catalogue fournisseurs panel (search-only — never renders the full list) ---------- */
let catalogueQuery = { reference:"", type:"", modele:"", couleur:"", taille:"", fournisseur:"" };
let catalogueSort = { col: "reference", dir: 1 };
const CATALOGUE_RESULT_CAP = 300;
let catalogueActiveSupplier = 'toptex';

const CATALOGUE_TABS = [
  { id:'toptex', label:'TopTex', fournisseur:'TopTex', mode:'live' },
  { id:'valento', label:'Valento', fournisseur:'Valento', mode:'file', accept:'.json', fileHint:"Fichier JSON téléchargé via le script fourni (valento_catalogue.json). Un ou plusieurs fichiers.", parseFiles: parseValentoFile },
  { id:'falkross', label:'Falk & Ross', fournisseur:'Falk & Ross', mode:'file', accept:'.xlsx', fileHint:"Fichier Excel ArticleMasterData (.xlsx) fourni par Falk & Ross. Un ou plusieurs fichiers.", parseFiles: parseFalkRossFile },
  { id:'imbretex', label:'Imbretex', fournisseur:'Imbretex', mode:'file', accept:'.xlsx', fileHint:"Fichier Excel de tarifs (.xlsx) fourni par Imbretex. Un ou plusieurs fichiers.", parseFiles: parseImbretexFile },
  { id:'safetyjogger', label:'Safety Jogger', fournisseur:'Safety Jogger', mode:'file', accept:'.xlsx', fileHint:"Export Excel de tarifs (.xlsx) fourni par Safety Jogger. Un ou plusieurs fichiers.", parseFiles: parseSafetyJoggerFile },
];

function renderCataloguePanel(){
  const panel = document.getElementById('panel-catalogue');
  if(!panel) return; // l'utilisateur a changé d'onglet pendant une opération en fond
  const activeTab = CATALOGUE_TABS.find(t=>t.id===catalogueActiveSupplier) || CATALOGUE_TABS[0];
  const countForTab = t => state.catalogueItems.filter(it=>it.fournisseur===t.fournisseur).length;
  const typeOptions = [...new Set(state.catalogueItems.filter(it=>it.fournisseur===activeTab.fournisseur).map(it=>it.type).filter(Boolean))].sort();

  panel.innerHTML = `
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
      ${CATALOGUE_TABS.map(t=>`
        <button class="${t.id===activeTab.id?'':'ghost'} small" data-cat-tab="${t.id}">${escapeHtml(t.label)} <span style="opacity:0.65;">(${fmtNum(countForTab(t))})</span></button>
      `).join('')}
    </div>

    <div class="form-card">
      <h3 style="margin-top:0;">${escapeHtml(activeTab.label)}</h3>
      <div id="cat-import-zone"></div>
    </div>

    <div class="form-card">
      <div class="hint" style="margin-top:0;">
        ${fmtNum(countForTab(activeTab))} ligne(s) ${escapeHtml(activeTab.label)} en base. Tape au moins un critère pour voir les résultats (pas de liste complète affichée d'un coup, pour que la page reste rapide).
      </div>
      <div class="toolbar">
        <input type="text" class="search-box" id="cat-reference" placeholder="Référence…" value="${escapeHtml(catalogueQuery.reference)}">
        <select id="cat-type">
          <option value="">Tous types (t-shirt, casquette…)</option>
          ${typeOptions.map(t=>`<option value="${escapeHtml(t)}" ${catalogueQuery.type===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
        </select>
        <select id="cat-modele">
          <option value="">${catalogueQuery.type ? 'Tous modèles' : "Choisis un type d'abord"}</option>
        </select>
        <input type="text" class="search-box" id="cat-couleur" placeholder="Couleur…" value="${escapeHtml(catalogueQuery.couleur)}">
        <input type="text" class="search-box" id="cat-taille" placeholder="Taille…" value="${escapeHtml(catalogueQuery.taille)}">
      </div>
    </div>
    <div id="catalogue-results"></div>
  `;

  renderImportZone(activeTab);

  panel.querySelectorAll('[data-cat-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      catalogueActiveSupplier = btn.dataset.catTab;
      catalogueQuery = { reference:"", type:"", modele:"", couleur:"", taille:"" };
      renderCataloguePanel();
    });
  });

  function populateModeleOptions(){
    const sel = document.getElementById('cat-modele');
    const type = catalogueQuery.type;
    const pool = state.catalogueItems.filter(it=>it.fournisseur===activeTab.fournisseur && (!type || it.type===type));
    const modeles = [...new Set(pool.map(it=>it.modele).filter(Boolean))].sort();
    sel.innerHTML = `<option value="">Tous modèles</option>` + modeles.map(m=>`<option value="${escapeHtml(m)}" ${catalogueQuery.modele===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
  }
  populateModeleOptions();

  function deriveProductDisplay(products){
    return products.map(p=>{
      const variants = (Array.isArray(p.variants) ? p.variants : []).map((v,i)=>({ ...v, id: `${p.id}__${i}` }));
      const withImg = variants.find(v=>v.imageUrl);
      const imageUrl = p.imageUrl || (withImg ? withImg.imageUrl : null);
      const prices = variants.map(v=>v.prix).filter(v=>v!=null).map(Number);
      const stockVals = variants.map(v=>v.stock).filter(v=>v!=null);
      const stockTotal = stockVals.length ? stockVals.reduce((s,v)=>s+(Number(v)||0),0) : null;
      const colors = [...new Set(variants.map(v=>v.couleur).filter(Boolean))];
      const sizes = [...new Set(variants.map(v=>v.taille).filter(Boolean))];
      return {
        key: p.id, fournisseur: p.fournisseur, reference: p.reference,
        designation: p.designation, categorie: p.categorie, imageUrl,
        composition: p.composition, grammage: p.grammage, entretien: p.entretien,
        priceMin: prices.length ? Math.min(...prices) : null,
        priceMax: prices.length ? Math.max(...prices) : null,
        stockTotal, colors, sizes, variants,
      };
    });
  }

  function refresh(){
    const r = catalogueQuery.reference.trim().toLowerCase();
    const c = catalogueQuery.couleur.trim().toLowerCase();
    const t = catalogueQuery.taille.trim().toLowerCase();
    const ty = catalogueQuery.type;
    const mo = catalogueQuery.modele;
    const anyFilter = r || c || t || ty || mo;
    const container = document.getElementById('catalogue-results');
    if(!anyFilter){
      container.innerHTML = `<div class="empty">Indique au moins un critère de recherche ci-dessus.</div>`;
      return;
    }
    let rows = state.catalogueItems.filter(p=>p.fournisseur===activeTab.fournisseur);
    if(r) rows = rows.filter(p=>String(p.reference||'').toLowerCase().includes(r));
    if(ty) rows = rows.filter(p=>p.type===ty);
    if(mo) rows = rows.filter(p=>p.modele===mo);
    if(c) rows = rows.filter(p=>(p.variants||[]).some(v=>String(v.couleur||'').toLowerCase().includes(c)));
    if(t) rows = rows.filter(p=>(p.variants||[]).some(v=>String(v.taille||'').toLowerCase().includes(t)));

    const products = deriveProductDisplay(rows);
    const total = products.length;
    const sorted = [...products].sort((a,b)=>{
      const col = catalogueSort.col;
      let av, bv;
      if(col === 'prix'){ av = a.priceMin ?? 0; bv = b.priceMin ?? 0; }
      else if(col === 'stock'){ av = a.stockTotal ?? 0; bv = b.stockTotal ?? 0; }
      else { av = String(a[col]||'').toLowerCase(); bv = String(b[col]||'').toLowerCase(); }
      if(av<bv) return -1*catalogueSort.dir; if(av>bv) return 1*catalogueSort.dir; return 0;
    });
    const capped = sorted.slice(0, CATALOGUE_RESULT_CAP);
    const rowsHtml = capped.map(p=>{
      const priceLabel = p.priceMin==null ? '—' : (p.priceMin===p.priceMax ? fmtPrix(p.priceMin) : `${fmtPrix(p.priceMin)} – ${fmtPrix(p.priceMax)}`);
      const maxSwatches = 8;
      const colorSwatches = p.colors.slice(0, maxSwatches).map(c=>
        `<span class="swatch" title="${escapeHtml(c)}" style="background:${colorFor(c)}; display:inline-block; width:15px; height:15px; border-radius:50%; border:1px solid var(--line); margin:1px;"></span>`
      ).join('');
      const colorExtra = p.colors.length > maxSwatches ? `<span class="hint" style="margin-left:2px;">+${p.colors.length-maxSwatches}</span>` : '';
      const sizesLabel = p.sizes.length ? p.sizes.join(', ') : '—';
      return `
      <tr data-product-row="${escapeHtml(p.key)}">
        <td>${p.imageUrl ? `<img src="${escapeHtml(imgSrc(p.imageUrl))}" loading="lazy" style="width:44px; height:44px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:var(--paper-dim); cursor:zoom-in;" data-zoom-img="${escapeHtml(imgSrc(p.imageUrl))}">` : `<span class="hint" style="display:inline-block; width:44px; height:44px; border:1px dashed var(--line); border-radius:6px; text-align:center; line-height:44px; font-size:9px;">Pas d'image</span>`}</td>
        <td>${escapeHtml(p.reference)}</td>
        <td>${escapeHtml(p.designation||'—')}</td>
        <td>${escapeHtml(p.categorie||'—')}</td>
        <td style="max-width:180px;">${colorSwatches}${colorExtra}</td>
        <td style="max-width:220px; white-space:normal;">${escapeHtml(sizesLabel)}</td>
        <td class="num">${priceLabel}</td>
        <td class="num">${p.stockTotal==null ? '—' : fmtNum(p.stockTotal)}</td>
        <td><button class="ghost small" data-toggle-product="${escapeHtml(p.key)}">Détails</button></td>
      </tr>
      <tr class="tt-detail-row" data-product-detail="${escapeHtml(p.key)}" style="display:none;">
        <td colspan="9"></td>
      </tr>
    `;
    }).join('');
    container.innerHTML = total === 0 ? `<div class="empty">Aucun résultat.</div>` : `
      <div class="hint" style="margin-bottom:10px;">${fmtNum(total)} produit(s) (${fmtNum(rows.length)} ligne(s) couleur/taille)${total>CATALOGUE_RESULT_CAP ? ` — affichage des ${CATALOGUE_RESULT_CAP} premiers, affine ta recherche pour voir le reste` : ''}</div>
      <table>
        <thead><tr>
          <th></th>
          <th data-sort="reference">Référence</th>
          <th data-sort="designation">Désignation</th>
          <th data-sort="categorie">Catégorie</th>
          <th>Couleurs</th>
          <th>Tailles</th>
          <th class="num" data-sort="prix">Prix</th>
          <th class="num" data-sort="stock">Stock total</th>
          <th></th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
    container.querySelectorAll('thead th[data-sort]').forEach(th=>{
      th.addEventListener('click', ()=>{
        const col = th.dataset.sort;
        if(catalogueSort.col === col) catalogueSort.dir *= -1; else { catalogueSort.col = col; catalogueSort.dir = 1; }
        refresh();
      });
    });
    container.querySelectorAll('[data-toggle-product]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.toggleProduct;
        const detailRow = container.querySelector(`tr.tt-detail-row[data-product-detail="${CSS.escape(key)}"]`);
        if(!detailRow) return;
        const isOpen = detailRow.style.display !== 'none';
        if(isOpen){ detailRow.style.display = 'none'; return; }
        detailRow.style.display = 'table-row';
        const product = products.find(p=>p.key===key);
        renderProductDetail(product, detailRow.querySelector('td'));
      });
    });
  }

  function renderProductDetail(product, td){
    const images = [...new Set(product.variants.map(v=>v.imageUrl).filter(Boolean))];

    function groupByPrice(rows){
      const groups = {};
      rows.forEach(r=>{
        if(r.prix == null) return;
        const key = Number(r.prix).toFixed(2);
        if(!groups[key]) groups[key] = { price: Number(r.prix), sizes: [] };
        if(r.taille && !groups[key].sizes.includes(r.taille)) groups[key].sizes.push(r.taille);
      });
      return Object.values(groups).sort((a,b)=>a.price-b.price);
    }
    const priceGroups = groupByPrice(product.variants);
    const priceHtml = priceGroups.length ? `
      <div class="tt-kv">
        ${priceGroups.map(g=>`<div>${escapeHtml(g.sizes.join(', ')||'—')}</div><div>${fmtPrix(g.price)}</div>`).join('')}
      </div>
    ` : `<div class="hint">Aucun prix trouvé.</div>`;

    const hasStockInfo = product.variants.some(v=>v.stock != null);
    const unavailable = product.variants.filter(v => v.stock != null && (Number(v.stock)||0) <= 0);
    const stockHtml = !hasStockInfo ? `<div class="hint">Stock non communiqué pour ce fournisseur.</div>` : (
      unavailable.length === 0
        ? `<div class="hint" style="color:var(--vert);">Tout est disponible.</div>`
        : `<div class="hint" style="color:var(--rouge); margin-bottom:6px;">Non disponible :</div><div class="tt-kv">${unavailable.slice(0,20).map(v=>`<div>${escapeHtml(v.taille||'—')}</div><div>${escapeHtml(v.couleur||'')}</div>`).join('')}</div>`
    );

    td.innerHTML = `
      <div style="display:flex; gap:20px; flex-wrap:wrap; padding:12px 4px;">
        ${images.length ? `<div class="tt-images" style="margin:0;">${images.slice(0,4).map(u=>`<img src="${escapeHtml(imgSrc(u))}" loading="lazy" style="width:80px; height:80px; cursor:zoom-in;" data-zoom-img="${escapeHtml(imgSrc(u))}">`).join('')}</div>` : `<div class="hint" style="width:80px;">Pas d'image pour ce produit — tu peux en ajouter une manuellement via « Ajouter à mon inventaire » puis « Modifier ».</div>`}
        <div style="flex:1; min-width:200px;">
          <div style="font-family:Georgia,serif; font-size:14px; margin-bottom:6px;">${escapeHtml(product.designation || product.reference)}</div>
          <div class="tt-kv">
            ${product.composition ? `<div>Composition</div><div>${escapeHtml(product.composition)}</div>` : ''}
            ${product.grammage ? `<div>Grammage</div><div>${escapeHtml(product.grammage)}</div>` : ''}
            ${product.entretien ? `<div>Entretien</div><div>${escapeHtml(product.entretien)}</div>` : ''}
            ${!product.composition && !product.grammage && !product.entretien ? `<div class="hint" style="grid-column:1/-1;">Pas d'info composition/grammage/entretien pour ce produit.</div>` : ''}
          </div>
        </div>
        <div style="flex:1; min-width:200px;">
          <div class="hint" style="margin:0 0 6px;">Prix par taille</div>
          ${priceHtml}
        </div>
        <div style="flex:1; min-width:200px;">
          <div class="hint" style="margin:0 0 6px;">Disponibilité</div>
          ${stockHtml}
        </div>
      </div>
      <details class="tt-raw">
        <summary>Choisir une couleur/taille précise à ajouter à mon inventaire</summary>
        <table style="box-shadow:none; margin-top:10px;">
          <thead><tr><th>Couleur</th><th>Taille</th><th class="num">Prix</th><th class="num">Stock</th><th></th></tr></thead>
          <tbody>
            ${[...product.variants].sort((a,b)=>{
              const ca=normText(a.couleur), cb=normText(b.couleur);
              if(ca!==cb) return ca<cb?-1:1;
              return normText(a.taille) < normText(b.taille) ? -1 : 1;
            }).map(v=>`
              <tr>
                <td><span class="cell-flex"><span class="swatch" style="background:${colorFor(v.couleur)}"></span>${escapeHtml(v.couleur||'—')}</span></td>
                <td>${escapeHtml(v.taille||'—')}</td>
                <td class="num">${fmtPrix(v.prix)}</td>
                <td class="num">${v.stock==null?'—':fmtNum(v.stock)}</td>
                <td><button class="ghost small" data-add-to-inventaire="${escapeHtml(v.id)}">Ajouter</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </details>
    `;
    td.querySelectorAll('[data-add-to-inventaire]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const v = product.variants.find(v=>v.id===btn.dataset.addToInventaire);
        if(!v) return;
        const enrich = {
          fournisseur: product.fournisseur,
          categorie: product.categorie, designation: product.designation,
          composition: product.composition, grammage: product.grammage, entretien: product.entretien,
          prix: v.prix, note: v.note,
          imageUrl: v.imageUrl || product.imageUrl || null,
        };
        // Si une ligne existe déjà pour cette référence/couleur/taille, on la complète
        // plutôt que d'en créer une deuxième (évite les doublons).
        const existing = state.items.find(it =>
          normText(it.reference) === normText(product.reference) &&
          normText(it.taille||'') === normText(v.taille||'') &&
          normText(it.couleur||'') === normText(v.couleur||'')
        );
        try{
          if(existing){
            const updates = {};
            Object.entries(enrich).forEach(([k,val])=>{ if(val != null && !existing[k]) updates[k] = val; });
            if(Object.keys(updates).length) await itemsCol.doc(existing.id).update(updates);
            toast(Object.keys(updates).length ? "Fiche existante complétée (pas de doublon créé)." : "Cette référence est déjà dans ton inventaire.");
          } else {
            await itemsCol.add({
              reference: product.reference, taille: v.taille, couleur: v.couleur,
              ...enrich, qte: 1, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            toast("Article ajouté à ton inventaire (quantité 1, à ajuster si besoin).");
          }
        }catch(err){
          toast("Erreur : "+err.message);
        }
      });
    });
  }

  document.getElementById('cat-reference').addEventListener('input', e=>{ catalogueQuery.reference=e.target.value; refresh(); });
  document.getElementById('cat-type').addEventListener('change', e=>{
    catalogueQuery.type=e.target.value; catalogueQuery.modele=''; populateModeleOptions(); refresh();
  });
  document.getElementById('cat-modele').addEventListener('change', e=>{ catalogueQuery.modele=e.target.value; refresh(); });
  document.getElementById('cat-couleur').addEventListener('input', e=>{ catalogueQuery.couleur=e.target.value; refresh(); });
  document.getElementById('cat-taille').addEventListener('input', e=>{ catalogueQuery.taille=e.target.value; refresh(); });
  refresh();
}

async function importValentoCatalogue(){
  const creds = getValentoCreds();
  const resultsEl = document.getElementById('vl-catalogue-import-results');
  const btn = document.getElementById('vl-import-catalogue');
  if(!creds){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">Aucun accès Valento configuré sur cet ordinateur (renseigne les identifiants ci-dessus).</div>`;
    return;
  }
  btn.disabled = true;
  resultsEl.innerHTML = `<div class="hint">Téléchargement du catalogue Valento…</div>`;
  let catalog;
  try{
    catalog = await valentoFetchFullCatalog((loaded, total)=>{
      resultsEl.innerHTML = `<div class="hint">Téléchargement du catalogue Valento… ${loaded}${total?' / '+total:''}</div>`;
    });
  }catch(err){
    btn.disabled = false;
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">${escapeHtml(err.message)}${/failed to fetch/i.test(err.message)?' — il est possible que Valento bloque les appels directs depuis un navigateur. Dis-le-moi si ce message apparaît.':''}</div>`;
    return;
  }

  // Build the flat list of catalogue items (one per color x size variant).
  const items = [];
  catalog.forEach(product=>{
    const variants = Array.isArray(product.variants) ? product.variants : [];
    variants.forEach(v=>{
      items.push({
        reference: product.article_ref,
        taille: v.size || null,
        couleur: v.color || null,
        categorie: (product.category_path && product.category_path[product.category_path.length-1]) || null,
        fournisseur: 'Valento',
        qte: 0,
        prix: v.net_price != null ? Number(v.net_price) : null,
        note: `cref ${v.cref}`,
      });
    });
  });

  resultsEl.innerHTML = `<div class="hint">Suppression de l'ancien catalogue Valento (s'il existe)…</div>`;
  try{
    const oldSnap = await catalogueItemsCol.where('fournisseur', '==', 'Valento').get();
    for(const chunk of chunkArray(oldSnap.docs, 400)){
      const batch = db.batch();
      chunk.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
  }catch(err){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">Erreur lors du nettoyage : ${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    return;
  }

  let done = 0;
  for(const chunk of chunkArray(items, 400)){
    const batch = db.batch();
    chunk.forEach(it => {
      const ref = catalogueItemsCol.doc();
      batch.set(ref, { ...it, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    done += chunk.length;
    resultsEl.innerHTML = `<div class="hint">Import en cours… ${fmtNum(done)} / ${fmtNum(items.length)}</div>`;
  }

  state.catalogueImports = { ...(state.catalogueImports||{}), valento: true };
  saveSettings();
  btn.disabled = false;
  resultsEl.innerHTML = `<div class="hint" style="color:var(--vert);">${fmtNum(items.length)} référence(s) Valento (${fmtNum(catalog.length)} produits) importées dans le Catalogue fournisseurs.</div>`;
  toast("Catalogue Valento importé.");
}

async function checkAllValentoReferences(){
  const resultsEl = document.getElementById('vl-check-results');
  const btn = document.getElementById('vl-check-all');
  const creds = getValentoCreds();
  if(!creds){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">Aucun accès Valento configuré sur cet ordinateur (renseigne les identifiants ci-dessus).</div>`;
    return;
  }
  const refCounts = {};
  state.items.forEach(it=>{
    const ref = String(it.reference||'').trim();
    if(!ref) return;
    refCounts[ref] = (refCounts[ref]||0) + 1;
  });
  const uniqueRefs = Object.keys(refCounts);
  if(uniqueRefs.length === 0){
    resultsEl.innerHTML = `<div class="hint">Aucune référence à vérifier.</div>`;
    return;
  }

  btn.disabled = true;
  resultsEl.innerHTML = `<div class="hint">Chargement du catalogue Valento (via le relais)…</div>`;
  let catalog;
  try{
    catalog = await valentoFetchFullCatalog((loaded, total)=>{
      resultsEl.innerHTML = `<div class="hint">Chargement du catalogue Valento… ${loaded}${total?' / '+total:''}</div>`;
    });
  }catch(err){
    btn.disabled = false;
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">${escapeHtml(err.message)}</div>`;
    return;
  }

  const catalogByRef = {};
  catalog.forEach(p => {
    catalogByRef[normText(p.article_ref)] = p;
    const nameKey = normText(p.name);
    if(nameKey && !catalogByRef[nameKey]) catalogByRef[nameKey] = p;
  });

  const notFound = [];
  const itemsToUpdate = [];
  let priceUpdatedCount = 0, imageUpdatedCount = 0;
  let recognizedCount = 0;

  uniqueRefs.forEach(ref=>{
    const product = catalogByRef[normText(ref)];
    if(!product) { notFound.push(ref); return; }
    recognizedCount++;
  });

  state.items.forEach(it=>{
    const ref = String(it.reference||'').trim();
    if(!ref) return;
    const product = catalogByRef[normText(ref)];
    if(!product) return;
    const variants = Array.isArray(product.variants) ? product.variants : [];
    const matched = variants.filter(v => matchesVariant(v, it));
    const best = matched[0] || variants[0] || null;
    const image = (best && best.image) || collectImageUrls(product.images, [], 0)[0] || null;
    const updates = {};
    if(it.fournisseur !== 'Valento') updates.fournisseur = 'Valento';
    if(best && best.net_price != null && Number(it.prix) !== Number(best.net_price)){ updates.prix = Number(best.net_price); priceUpdatedCount++; }
    if(image && it.imageUrl !== image){ updates.imageUrl = image; imageUpdatedCount++; }
    if(Object.keys(updates).length) itemsToUpdate.push({ id: it.id, updates });
  });

  if(itemsToUpdate.length){
    if(!state.fournisseurs.includes('Valento')){
      state.fournisseurs.push('Valento');
      saveSettings();
    }
    resultsEl.innerHTML = `<div class="hint">Mise à jour de ${itemsToUpdate.length} fiche(s) article reconnue(s)…</div>`;
    for(const chunk of chunkArray(itemsToUpdate, 400)){
      const batch = db.batch();
      chunk.forEach(({id, updates}) => batch.update(itemsCol.doc(id), updates));
      await batch.commit();
    }
  }

  btn.disabled = false;
  if(notFound.length === 0){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--vert);">Toutes les ${uniqueRefs.length} références sont reconnues par Valento — prix mis à jour sur ${priceUpdatedCount} ligne(s), image ajoutée sur ${imageUpdatedCount} ligne(s).</div>`;
    return;
  }
  resultsEl.innerHTML = `
    ${itemsToUpdate.length ? `<div class="hint" style="color:var(--vert); margin-bottom:8px;">Fournisseur indiqué, prix mis à jour sur ${priceUpdatedCount} ligne(s) et image ajoutée sur ${imageUpdatedCount} ligne(s) (${recognizedCount} référence(s) reconnue(s) sur ${uniqueRefs.length}).</div>` : ''}
    <div class="hint" style="color:var(--rouge); margin-bottom:6px;">${notFound.length} référence(s) non reconnue(s) par Valento (sur ${uniqueRefs.length}) :</div>
    <div class="tt-kv">
      ${notFound.map(ref=>`<div>${escapeHtml(ref)}</div><div>${refCounts[ref]} ligne(s) concernée(s)</div>`).join('')}
    </div>
  `;
}

// Regroupe des lignes couleur/taille à plat en un document par produit (une seule écriture
// Firestore pour toutes les couleurs/tailles d'une même référence, au lieu d'une par ligne).
function groupItemsByProduct(items){
  const groups = {};
  const order = [];
  items.forEach(it=>{
    const key = String(it.reference||'');
    if(!groups[key]){
      groups[key] = {
        reference: it.reference, fournisseur: it.fournisseur,
        type: null, modele: null, categorie: null, designation: null,
        composition: null, grammage: null, entretien: null,
        imageUrl: null, variants: [],
      };
      order.push(key);
    }
    const g = groups[key];
    ['type','modele','categorie','designation','composition','grammage','entretien','imageUrl'].forEach(f=>{
      if(!g[f] && it[f]) g[f] = it[f];
    });
    g.variants.push({ taille: it.taille||null, couleur: it.couleur||null, prix: it.prix??null, stock: it.stock??null, note: it.note||null, imageUrl: it.imageUrl||null });
  });
  return order.map(k=>groups[k]);
}

async function importTopTexCatalogue(){
  const key = 'toptex';
  if(catalogueImportProgress[key] && catalogueImportProgress[key].busy){
    toast("Un import est déjà en cours, attends qu'il se termine.");
    return;
  }
  const creds = getToptexCreds();
  if(!creds){
    setCatalogueImportProgress(key, { busy:false, isError:true, message:"Aucun accès TopTex configuré sur cet ordinateur (renseigne les identifiants dans Paramètres → Accès TopTex)." });
    return;
  }
  setCatalogueImportProgress(key, { busy:true, isError:false, message:"Téléchargement du catalogue TopTex…", done:0, total:0 });
  // Des pages plus petites réduisent le risque de timeout côté TopTex (leur backend semble
  // mettre plus de temps à répondre quand modified_since remonte loin dans l'historique).
  const pageSize = 50;
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  let page = 1;
  const items = [];
  try{
    while(true){
      setCatalogueImportProgress(key, { message: `Téléchargement du catalogue TopTex… page ${page} (${fmtNum(items.length)} lignes cumulées)` });
      // modified_since est requis pour récupérer tout le catalogue : sans lui, TopTex ne renvoie
      // qu'un petit sous-ensemble (produits récemment modifiés), pas l'historique complet — c'est
      // ce qui donnait un import "réussi" mais avec seulement ~200 lignes au lieu de plusieurs
      // milliers, et donc des références bien réelles (ex. WK303) absentes du résultat.
      let res = null;
      let attempt = 0;
      const maxAttempts = 4;
      while (attempt < maxAttempts) {
        attempt++;
        res = await toptexGet('/v3/products/all', { usage_right: 'b2b_uniquement', display_prices: '1', page_number: page, page_size: pageSize, modified_since: '2000-01-01' });
        // 504/502/503 : erreurs passagères côté serveur TopTex (souvent un simple timeout) —
        // on retente après une petite pause au lieu d'abandonner tout l'import en cours.
        if (res.ok || ![502, 503, 504].includes(res.status) || attempt >= maxAttempts) break;
        setCatalogueImportProgress(key, { message: `Page ${page} : réponse lente côté TopTex (HTTP ${res.status}), nouvelle tentative ${attempt}/${maxAttempts - 1}…` });
        await sleep(1500 * attempt);
      }
      if(!res.ok){
        setCatalogueImportProgress(key, { busy:false, isError:true, message: `Erreur HTTP ${res.status} à la page ${page} (après ${attempt} tentative(s)). ${(res.raw||'').slice(0,200)}` });
        return;
      }
      const rows = extractRows(res.data);
      rows.forEach(product=>{
        const catalogRef = product.catalogReference || product.catalog_reference || product.reference || null;
        const brand = findFieldValue(product, /^brand$/i) || product.brand || null;
        const designation = findFieldValue(product, /^designation$/i) || null;
        const composition = findFieldValue(product, /composition|material|matiere/i);
        const grammage = findFieldValue(product, /grammage|weight|poids|gsm/i);
        // subfamily/family sont souvent des objets imbriqués/multilingues côté TopTex (comme
        // designation/composition/grammage) : un accès direct product.family renvoyait donc
        // presque toujours vide, d'où le sélecteur "Type" resté sans aucune option après import.
        const familyLabel = findFieldValue(product, /^subfamily$/i) || findFieldValue(product, /^family$/i);
        const images = collectImageUrls(product.images || product, [], 0);
        const skus = Array.isArray(product.skus) ? product.skus : (Array.isArray(product.variants) ? product.variants : (Array.isArray(product) ? product : [product]));
        (skus.length ? skus : [product]).forEach(sku=>{
          const price = findFieldValue(sku, /^price$|publicPrice/i);
          items.push({
            reference: catalogRef || sku.catalogReference || sku.sku || null,
            type: familyLabel || null,
            modele: designation,
            taille: sku.size || sku.sizeCode || null,
            couleur: sku.color || sku.colorCode || null,
            categorie: familyLabel || null,
            fournisseur: 'TopTex',
            qte: 0,
            prix: price != null ? Number(price) : null,
            note: sku.sku ? `sku ${sku.sku}` : null,
            imageUrl: images[0] || null,
            stock: null,
            designation: [brand, designation].filter(Boolean).join(' '),
            composition: composition || null,
            grammage: grammage || null,
            entretien: null,
          });
        });
      });
      if(rows.length < pageSize) break;
      page++;
      if(page > 500) break; // safety cap
    }
  }catch(err){
    setCatalogueImportProgress(key, { busy:false, isError:true, message: err.message });
    return;
  }

  detachCatalogueListener();
  try{
    // Supprime l'ancien catalogue TopTex avant de réimporter.
    const snap = await catalogueItemsCol.where('fournisseur', '==', 'TopTex').get();
    let deleted = 0;
    for(const chunk of chunkArray(snap.docs, 400)){
      const batch = db.batch();
      chunk.forEach(d => batch.delete(d.ref));
      await batch.commit();
      deleted += chunk.length;
      setCatalogueImportProgress(key, { message: `Suppression des anciennes données… ${fmtNum(deleted)} / ${fmtNum(snap.docs.length)}` });
    }
    let done = 0;
    const products = groupItemsByProduct(items);
    setCatalogueImportProgress(key, { message: `Import en cours… 0 / ${fmtNum(products.length)} produit(s) (${fmtNum(items.length)} lignes)`, done:0, total: products.length });
    for(const chunk of chunkArray(products, 400)){
      const batch = db.batch();
      chunk.forEach(p => batch.set(catalogueItemsCol.doc(), { ...p, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      await batch.commit();
      done += chunk.length;
      setCatalogueImportProgress(key, { message: `Import en cours… ${fmtNum(done)} / ${fmtNum(products.length)} produit(s)`, done, total: products.length });
    }
  } finally {
    attachCatalogueListener();
  }
  state.catalogueImports = { ...(state.catalogueImports||{}), toptex: true };
  saveSettings();
  setCatalogueImportProgress(key, { busy:false, isError:false, message: `Import terminé : ${fmtNum(items.length)} référence(s) TopTex (toutes tailles/couleurs) importées avec succès.`, done: 1, total: 1 });
  toast(`Catalogue TopTex importé (${fmtNum(items.length)} lignes).`);
}

async function importCatalogueFromFiles(tab, fileList){
  const key = tab.id;
  if(catalogueImportProgress[key] && catalogueImportProgress[key].busy){
    toast("Un import est déjà en cours, attends qu'il se termine.");
    return;
  }
  if(!fileList || fileList.length === 0){
    setCatalogueImportProgress(key, { busy:false, isError:true, message:"Choisis d'abord un fichier." });
    return;
  }
  setCatalogueImportProgress(key, { busy:true, isError:false, message:`Suppression des anciennes données ${tab.label}…`, done:0, total:0 });
  detachCatalogueListener();
  try{
    try{
      const snap = await catalogueItemsCol.where('fournisseur', '==', tab.fournisseur).get();
      let deleted = 0;
      for(const chunk of chunkArray(snap.docs, 400)){
        const batch = db.batch();
        chunk.forEach(d => batch.delete(d.ref));
        await batch.commit();
        deleted += chunk.length;
        setCatalogueImportProgress(key, { message: `Suppression des anciennes données… ${fmtNum(deleted)} / ${fmtNum(snap.docs.length)}` });
      }
    }catch(err){
      setCatalogueImportProgress(key, { busy:false, isError:true, message: `Échec de la suppression des anciennes données : ${err.message}` });
      return;
    }

    let items;
    try{
      setCatalogueImportProgress(key, { message: `Lecture du fichier…` });
      items = await tab.parseFiles(Array.from(fileList), (p)=> setCatalogueImportProgress(key, { message: p.message }));
    }catch(err){
      setCatalogueImportProgress(key, { busy:false, isError:true, message: `Erreur de lecture du fichier : ${err.message}` });
      return;
    }
    if(!items || items.length === 0){
      setCatalogueImportProgress(key, { busy:false, isError:true, message: `Aucune ligne trouvée dans le fichier — vérifie que c'est le bon fichier pour ${tab.label}.` });
      return;
    }

    let done = 0, failed = 0;
    const products = groupItemsByProduct(items);
    setCatalogueImportProgress(key, { message: `Import en cours… 0 / ${fmtNum(products.length)} produit(s) (${fmtNum(items.length)} lignes)`, done:0, total: products.length });
    try{
      for(const chunk of chunkArray(products, 400)){
        const batch = db.batch();
        chunk.forEach(p => batch.set(catalogueItemsCol.doc(), { ...p, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
        const res = await batch.commit();
        done += chunk.length;
        failed += (res && res.failed) || 0;
        setCatalogueImportProgress(key, { message: `Import en cours… ${fmtNum(done)} / ${fmtNum(products.length)} produit(s)`, done, total: products.length });
      }
    }catch(err){
      setCatalogueImportProgress(key, { busy:false, isError:true, message: `Erreur pendant l'import (${fmtNum(done)} / ${fmtNum(products.length)} produit(s) déjà écrits) : ${err.message}` });
      return;
    }

    state.catalogueImports = { ...(state.catalogueImports||{}), [key]: true };
    saveSettings();
    const succeeded = products.length - failed;
    setCatalogueImportProgress(key, {
      busy:false, isError: failed>0,
      message: failed > 0
        ? `Import terminé avec ${fmtNum(failed)} échec(s) : ${fmtNum(succeeded)} / ${fmtNum(products.length)} référence(s) ${tab.label} importées. Regarde la Console (F12) pour le détail des échecs.`
        : `Import terminé : ${fmtNum(products.length)} référence(s) ${tab.label} (${fmtNum(items.length)} lignes couleur/taille) importées avec succès.`,
      done: 1, total: 1,
    });
    toast(failed > 0 ? `Catalogue ${tab.label} importé avec ${fmtNum(failed)} échec(s).` : `Catalogue ${tab.label} importé (${fmtNum(items.length)} lignes).`);
  } finally {
    attachCatalogueListener();
  }
}

async function findMissingPrices(){
  const resultsEl = document.getElementById('missing-prices-results');
  const btn = document.getElementById('find-missing-prices');
  if(state.catalogueItems.length === 0){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">Aucun catalogue fournisseur importé pour l'instant (Valento, Falk & Ross…).</div>`;
    return;
  }
  const missing = state.items.filter(it => it.prix == null || it.prix === '' || Number(it.prix) === 0);
  if(missing.length === 0){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--vert);">Tous les articles de ton inventaire ont déjà un prix.</div>`;
    return;
  }
  btn.disabled = true;
  const flat = flattenCatalogueItems();
  resultsEl.innerHTML = `<div class="hint">Recherche en cours parmi ${fmtNum(flat.length)} ligne(s) de catalogue…</div>`;

  const byRef = {};
  flat.forEach(ci=>{
    const key = normText(ci.reference);
    if(!byRef[key]) byRef[key] = [];
    byRef[key].push(ci);
  });

  const stillMissing = [];
  const itemsToUpdate = [];
  let foundCount = 0;

  missing.forEach(it=>{
    const ref = String(it.reference||'').trim();
    if(!ref){ stillMissing.push(it); return; }
    const candidates = byRef[normText(ref)];
    if(!candidates){ stillMissing.push(it); return; }
    const matched = candidates.filter(ci => matchesCatalogueItem(ci, it));
    const priced = (matched.length ? matched : candidates).filter(ci=>ci.prix != null);
    if(priced.length === 0){ stillMissing.push(it); return; }
    const best = priced.reduce((a,b)=> (Number(b.prix) < Number(a.prix) ? b : a));
    foundCount++;
    const updates = { prix: Number(best.prix) };
    if(!it.fournisseur) updates.fournisseur = best.fournisseur;
    if(!it.imageUrl && best.imageUrl) updates.imageUrl = best.imageUrl;
    itemsToUpdate.push({ id: it.id, updates, fournisseur: best.fournisseur });
  });

  if(itemsToUpdate.length){
    for(const chunk of chunkArray(itemsToUpdate, 400)){
      const batch = db.batch();
      chunk.forEach(({id, updates}) => batch.update(itemsCol.doc(id), updates));
      await batch.commit();
    }
    const newFournisseurs = [...new Set(itemsToUpdate.map(u=>u.fournisseur).filter(Boolean))];
    let changed = false;
    newFournisseurs.forEach(f=>{ if(!state.fournisseurs.includes(f)){ state.fournisseurs.push(f); changed = true; } });
    if(changed) saveSettings();
  }

  btn.disabled = false;
  resultsEl.innerHTML = `
    <div class="hint" style="color:var(--vert); margin-bottom:6px;">${fmtNum(foundCount)} prix trouvé(s) et appliqué(s) sur ${fmtNum(missing.length)} article(s) sans prix.</div>
    ${stillMissing.length ? `
      <div class="hint" style="color:var(--rouge); margin-bottom:6px;">${fmtNum(stillMissing.length)} article(s) toujours sans prix (introuvables dans les catalogues importés) :</div>
      <div class="tt-kv">${stillMissing.slice(0,30).map(it=>`<div>${escapeHtml(it.reference)}</div><div>${escapeHtml([it.taille,it.couleur].filter(Boolean).join(' · ')||'—')}</div>`).join('')}</div>
      ${stillMissing.length>30 ? `<div class="hint" style="margin-top:6px;">… et ${fmtNum(stillMissing.length-30)} autre(s).</div>` : ''}
    ` : ''}
  `;
  toast(`${foundCount} prix trouvé(s).`);
}

// Certaines lignes de l'inventaire ont un nom complet dans le champ Référence
// (ex. "Bonnet B445", "Regatta Pro TRA712") plutôt que le code fournisseur pur (B445, TRA712).
// On repère le dernier "mot" qui ressemble à un code produit (lettres + chiffres).
function extractCandidateRef(text){
  if(!text) return null;
  const tokens = String(text).trim().split(/\s+/);
  for(let i = tokens.length-1; i >= 0; i--){
    const t = tokens[i].replace(/[^\w-]/g, '');
    if(/^[A-Za-z]{1,5}-?\d{2,6}[A-Za-z]{0,2}$/.test(t) && normText(t) !== normText(text)) return t;
  }
  return null;
}

  const resultsEl = document.getElementById('name-ref-check-results');

async function checkAllToptexReferences(){
  const creds = getToptexCreds();
  const resultsEl = document.getElementById('tt-check-results');
  const btn = document.getElementById('tt-check-all');
  if(!creds){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--rouge);">Aucun accès TopTex configuré sur cet ordinateur (renseigne les identifiants ci-dessus).</div>`;
    return;
  }
  const refCounts = {};
  state.items.forEach(it=>{
    const ref = String(it.reference||'').trim();
    if(!ref) return;
    refCounts[ref] = (refCounts[ref]||0) + 1;
  });
  const uniqueRefs = Object.keys(refCounts).sort();
  if(uniqueRefs.length === 0){
    resultsEl.innerHTML = `<div class="hint">Aucune référence à vérifier.</div>`;
    return;
  }

  btn.disabled = true;
  const notFound = [];
  const foundRefs = [];
  const errored = [];
  const priceRowsByRef = {};
  const catalogRowsByRef = {};
  let done = 0;
  resultsEl.innerHTML = `<div class="hint">Vérification en cours… 0 / ${uniqueRefs.length}</div>`;

  const concurrency = 4;
  let cursor = 0;
  async function worker(){
    while(cursor < uniqueRefs.length){
      const ref = uniqueRefs[cursor++];
      try{
        const [priceRes, catalogRes] = await Promise.all([
          toptexGet('/v3/products/price', { catalog_reference: ref }),
          toptexGet('/v3/products', { catalog_reference: ref, usage_right: 'b2b_uniquement' }),
        ]);
        if(priceRes.ok){
          const rows = extractRows(priceRes.data);
          if(rows.length === 0) notFound.push(ref); else { foundRefs.push(ref); priceRowsByRef[ref] = rows; }
        } else {
          errored.push({ ref, status: priceRes.status });
        }
        if(catalogRes.ok){
          catalogRowsByRef[ref] = extractRows(catalogRes.data);
        }
      }catch(err){
        errored.push({ ref, status: 'réseau' });
      }
      done++;
      resultsEl.innerHTML = `<div class="hint">Vérification en cours… ${done} / ${uniqueRefs.length}</div>`;
    }
  }
  await Promise.all(Array.from({length: concurrency}, worker));

  // For every item whose reference TopTex recognizes: mark Fournisseur = TopTex, update its price, and find a matching image.
  function priceForItem(rows, item){
    const matched = rows.filter(r => matchesVariant(r, item));
    const candidates = matched.length ? matched : rows;
    const best = candidates[0];
    if(!best) return null;
    const up = Array.isArray(best.prices) ? (best.prices.find(p=>String(p.quantity)==='1') || best.prices[0]) : null;
    return up ? Number(up.price) : null;
  }
  function imageForItem(rows, item){
    if(!rows || !rows.length) return null;
    const matched = rows.filter(r => normText(r.color).includes(normText(item.couleur)) || normText(item.couleur).includes(normText(r.color)));
    // Prefer an image from the color-matched variant; fall back to any variant for this reference.
    const img = (matched.length && collectImageUrls(matched, [], 0)[0]) || collectImageUrls(rows, [], 0)[0];
    return img || null;
  }

  const foundRefSet = new Set(foundRefs);
  const recognizedItems = state.items.filter(it => foundRefSet.has(String(it.reference||'').trim()));
  const itemsToUpdate = [];
  let priceUpdatedCount = 0;
  let imageUpdatedCount = 0;
  recognizedItems.forEach(it=>{
    const ref = String(it.reference||'').trim();
    const price = priceForItem(priceRowsByRef[ref] || [], it);
    const image = imageForItem(catalogRowsByRef[ref] || [], it);
    const updates = {};
    if(it.fournisseur !== 'TopTex') updates.fournisseur = 'TopTex';
    if(price !== null && !isNaN(price) && Number(it.prix) !== price){ updates.prix = price; priceUpdatedCount++; }
    if(image && it.imageUrl !== image){ updates.imageUrl = image; imageUpdatedCount++; }
    if(Object.keys(updates).length) itemsToUpdate.push({ id: it.id, updates });
  });

  if(itemsToUpdate.length){
    if(!state.fournisseurs.includes('TopTex')){
      state.fournisseurs.push('TopTex');
      saveSettings();
    }
    resultsEl.innerHTML = `<div class="hint">Mise à jour de ${itemsToUpdate.length} fiche(s) article reconnue(s)…</div>`;
    for(const chunk of chunkArray(itemsToUpdate, 400)){
      const batch = db.batch();
      chunk.forEach(({id, updates}) => batch.update(itemsCol.doc(id), updates));
      await batch.commit();
    }
  }

  btn.disabled = false;
  if(notFound.length === 0 && errored.length === 0){
    resultsEl.innerHTML = `<div class="hint" style="color:var(--vert);">Toutes les ${uniqueRefs.length} références sont reconnues par TopTex — prix mis à jour sur ${priceUpdatedCount} ligne(s), image ajoutée sur ${imageUpdatedCount} ligne(s).</div>`;
    return;
  }
  resultsEl.innerHTML = `
    ${itemsToUpdate.length ? `<div class="hint" style="color:var(--vert); margin-bottom:8px;">Fournisseur indiqué, prix mis à jour sur ${priceUpdatedCount} ligne(s) et image ajoutée sur ${imageUpdatedCount} ligne(s) (sur ${recognizedItems.length} ligne(s) reconnue(s)).</div>` : ''}
    ${notFound.length ? `

function renderImportProgressHtml(key){
  const p = catalogueImportProgress[key];
  if(!p) return '';
  const color = p.isError ? 'var(--rouge)' : (p.busy ? 'var(--ink)' : 'var(--vert)');
  const showBar = p.busy && p.total > 0;
  const pct = showBar ? Math.min(100, Math.round((p.done / p.total) * 100)) : 0;
  return `
    <div style="margin-top:10px;">
      ${!p.busy ? `<div style="font-size:18px; line-height:1;">${p.isError ? '⚠️' : '✅'}</div>` : ''}
      <div class="hint" style="color:${color}; margin-top:${!p.busy?'4px':'0'}; font-weight:${!p.busy?'600':'normal'};">${escapeHtml(p.message||'')}</div>
      ${showBar ? `
        <div style="background:var(--paper-dim); border-radius:6px; height:10px; margin-top:8px; overflow:hidden;">
          <div style="background:var(--ink); height:100%; width:${pct}%; transition:width 0.2s;"></div>
        </div>
        <div class="hint" style="margin-top:4px;">${pct}%</div>
      ` : ''}
    </div>
  `;
}

/* ---------- Backup / restore ---------- */
function exportBackup(){
  const data = { items: state.items.map(({id, ...rest})=>rest), categories: state.categories, users: state.users, usersEnabled: state.usersEnabled };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `inventaire-csb-sauvegarde-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Sauvegarde exportée.");
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.items || !Array.isArray(data.items)) throw new Error("format invalide");
      if(!confirm("Importer ce fichier va remplacer tout l'inventaire actuel pour TOUS LES POSTES connectés. Continuer ?")) return;
      toast("Import en cours…");
      (async ()=>{
        const snap = await itemsCol.get();
        for(const arr of chunkArray(snap.docs, 400)){
          const batch = db.batch();
          arr.forEach(d=>batch.delete(d.ref));
          await batch.commit();
        }
        for(const arr of chunkArray(data.items, 400)){
          const batch = db.batch();
          arr.forEach(it=>{
            const { id, ...rest } = it;
            batch.set(itemsCol.doc(), { ...rest, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          });
          await batch.commit();
        }
        await settingsRef.set({
          categories: data.categories || [],
          users: data.users || [],
          usersEnabled: typeof data.usersEnabled === 'boolean' ? data.usersEnabled : false
        });
        clearSession();
        toast("Sauvegarde importée pour tous les postes.");
      })().catch(err=>toast("Erreur d'import : "+err.message));
    }catch(err){
      alert("Ce fichier ne semble pas être une sauvegarde valide de cette application.");
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
