<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventaire — Atelier CSB</title>
<style>
  :root{
    --paper: #FAF6EF;
    --paper-dim: #F1EADC;
    --ink: #2A2622;
    --ink-soft: #6B6155;
    --line: #E2D8C6;
    --thread: #B33A3A;
    --thread-dark: #8E2B2B;
    --spool-gold: #C08A2E;
    --vert: #3E7A52;
    --vert-bg: #E4EFE6;
    --rouge: #B23A3A;
    --rouge-bg: #F8E1DE;
    --shadow: 0 1px 2px rgba(42,38,34,0.06), 0 4px 14px rgba(42,38,34,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:14px; line-height:1.45; min-height:100vh;
  }
  .app{max-width:1240px; margin:0 auto; padding:14px 24px 60px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; margin-bottom:14px; padding-bottom:10px;
    border-bottom: 2px solid var(--ink); position:relative;
  }
  header.top::after{ content:""; position:absolute; left:0; bottom:-2px; width:64px; height:2px; background: var(--thread); }
  .brand{display:flex; align-items:center; gap:14px;}
  .spool{
    width:28px;height:28px;border-radius:50%;
    background: conic-gradient(var(--thread) 0deg 260deg, var(--thread-dark) 260deg 360deg);
    position:relative; flex:none;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px rgba(42,38,34,0.15);
  }
  .spool::after{ content:""; position:absolute; inset:9px; border-radius:50%; background:var(--paper); }
  h1{ font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size:18px; margin:0; font-weight:600; }
  .subtitle{color:var(--ink-soft); font-size:12.5px; margin-top:2px; letter-spacing:0.3px;}
  header.top .subtitle{display:none;}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center;}

  button{ font-family:inherit; font-size:13px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 13px; border-radius:7px; transition: all .12s ease; }
  button:hover{border-color:var(--ink-soft); background:var(--paper-dim);}
  button.primary{background:var(--thread); border-color:var(--thread-dark); color:#fff;}
  button.primary:hover{background:var(--thread-dark);}
  button.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  button.ghost:hover{background:var(--paper-dim); color:var(--ink);}
  button.danger{color:var(--rouge); border-color:var(--rouge-bg);}
  button.danger:hover{background:var(--rouge-bg);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.small{padding:4px 9px; font-size:12px;}

  nav.tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  nav.tabs button{ border:none; background:none; border-radius:0; padding:9px 4px; margin-right:22px; font-size:14px; color:var(--ink-soft); position:relative; top:1px; }
  nav.tabs button:hover{background:none; color:var(--ink);}
  nav.tabs button.active{ color:var(--ink); font-weight:600; border-bottom:2px solid var(--thread); }

  .panel{display:none;} .panel.active{display:block;}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); }
  .card .num{font-size:24px; font-weight:700; font-family:Georgia,serif;}
  .card .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  input[type=text], input[type=number], select, textarea{
    font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--spool-gold); outline-offset:1px;}
  .search-box{flex:1; min-width:160px; max-width:280px;}

  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--paper-dim); cursor:pointer; user-select:none; white-space:nowrap; }
  thead th:hover{color:var(--ink);}
  tbody td{padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background: #FCFAF6;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}

  .swatch{ display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; vertical-align:middle; border:1px solid rgba(0,0,0,0.15); }
  .cell-flex{display:flex; align-items:center;}
  .cat-tag{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; background:var(--paper-dim); color:var(--ink-soft); letter-spacing:0.2px; }

  .empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}

  .form-card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:20px; }
  .form-card h3{margin:0 0 14px; font-family:Georgia,serif; font-size:16px; font-weight:600;}
  .form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;}
  .field input, .field select, .field textarea{width:100%;}
  .form-actions{margin-top:14px; display:flex; gap:8px; justify-content:flex-end;}

  .inline-edit{width:80px; padding:4px 6px; text-align:right;}
  .inline-edit.price{width:90px;}

  .section-title{font-family:Georgia,serif; font-size:15px; font-weight:600; margin:26px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .hint{color:var(--ink-soft); font-size:12px; margin:-4px 0 14px;}

  .params-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .param-block{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .chip{ display:flex; align-items:center; gap:6px; background:var(--paper-dim); border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px; font-size:13px; }
  .chip button{padding:2px 6px; font-size:11px; border:none; background:none; color:var(--ink-soft);}
  .chip button:hover{color:var(--rouge); background:none;}
  .add-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .add-row input{flex:1;}

  .perm-table{width:100%; margin-top:10px;}
  .perm-table th, .perm-table td{padding:6px 8px; font-size:12.5px;}
  .perm-table input[type=text]{width:100%; padding:5px 7px;}

  footer.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease; z-index:50; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:repeat(2,1fr);}
    .params-grid{grid-template-columns:1fr;}
  }  .tt-overlay{
    position:fixed; inset:0; background:rgba(42,38,34,0.45); z-index:60;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
  }
  .tt-modal{
    background:#fff; border-radius:12px; max-width:720px; width:100%; padding:24px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); position:relative;
  }
  .tt-modal h3{font-family:Georgia,serif; margin:0 0 4px; font-size:19px;}
  .tt-close{ position:absolute; top:16px; right:16px; }
  .tt-images{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0;}
  .tt-images img{ width:110px; height:110px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:var(--paper-dim); }
  .zoom-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:40px; cursor:zoom-out;
  }
  .zoom-overlay img{ max-width:90vw; max-height:90vh; border-radius:8px; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .zoom-overlay .zoom-close{
    position:fixed; top:20px; right:24px; background:#fff; border:none; border-radius:7px;
    padding:8px 14px; font-size:13px; cursor:pointer;
  }
  .tt-section{margin-top:18px;}
  .tt-section h4{font-size:13px; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-soft); margin:0 0 8px;}
  .tt-kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px;}
  .tt-kv div:nth-child(odd){color:var(--ink-soft);}
  details.tt-raw{margin-top:16px; font-size:12px; color:var(--ink-soft);}
  details.tt-raw pre{ white-space:pre-wrap; word-break:break-word; background:var(--paper-dim); padding:10px; border-radius:6px; max-height:280px; overflow:auto; }
</style>
</head>

/* ---------- PocketBase (remplace Firebase/Firestore) ----------
   Cette couche imite juste assez l'API Firestore utilisée dans le reste du fichier
   (doc/collection/batch/onSnapshot) pour que tout le reste de l'app n'ait pas besoin
   d'être réécrit. Les 3 collections doivent exister dans PocketBase :
   inventaire_items, catalogue_items, app_settings (règles d'accès ouvertes). */
const POCKETBASE_URL = CSBAuth.getPbUrl();
const pb = new PocketBase(POCKETBASE_URL);
// Par défaut, le SDK PocketBase annule une requête en cours si une autre requête vers
// la même collection démarre avant qu'elle finisse (utile pour une recherche en direct,
// mais ça casse nos écritures en parallèle lors des imports). On désactive ce mécanisme.
pb.autoCancellation(false);

// Anciennes créations utilisaient firebase.firestore.FieldValue.serverTimestamp() —
// on garde un shim pour ne pas avoir à toucher chaque endroit qui l'utilise.
window.firebase = { firestore: { FieldValue: { serverTimestamp: () => new Date().toISOString() } } };

function pbClean(data){
  const out = {};
  Object.keys(data||{}).forEach(k=>{
    if(data[k] !== undefined) out[k] = data[k];
  });
  return out;
}

function makeCollectionRef(name){
  const self = {
    _name: name,
    doc(id){
      const docId = id || null;
      const ref = { id: docId, _collection: name, _isNew: !docId };
      ref.set = async (data)=>{
        const clean = pbClean(data);
        if(ref.id && !ref._isNew){
          await pb.collection(name).update(ref.id, clean);
        } else {
          const rec = await pb.collection(name).create(clean);
          ref.id = rec.id; ref._isNew = false;
        }
      };
      ref.update = async (data)=>{ await pb.collection(name).update(ref.id, pbClean(data)); };
      ref.delete = async ()=>{ await pb.collection(name).delete(ref.id); };
      return ref;
    },
    async add(data){
      const rec = await pb.collection(name).create(pbClean(data));
      return { id: rec.id, _collection: name };
    },
    where(field, op, value){
      return {
        async get(){
          const safeVal = String(value).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
          const list = await pb.collection(name).getFullList({ filter: `${field} = "${safeVal}"` });
          return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })) };
        }
      };
    },
    async get(){
      const list = await pb.collection(name).getFullList();
      return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })) };
    },
    onSnapshot(onNext, onError){
      let cancelled = false;
      let unsub = null;
      const push = async ()=>{
        try{
          const list = await pb.collection(name).getFullList();
          if(!cancelled) onNext({ docs: list.map(r=>({ id: r.id, data: ()=>r })) });
        }catch(e){ if(!cancelled && onError) onError(e); }
      };
      push();
      pb.collection(name).subscribe('*', push).then(u=>{ if(cancelled) u(); else unsub = u; }).catch(e=>{ if(onError) onError(e); });
      return ()=>{ cancelled = true; if(unsub) unsub(); };
    },
  };
  return self;
}

function makeBatch(){
  const ops = [];
  return {
    set(ref, data){ ops.push({ type: ref._isNew ? 'create' : 'update', ref, data: pbClean(data) }); },
    update(ref, data){ ops.push({ type: 'update', ref, data: pbClean(data) }); },
    delete(ref){ ops.push({ type: 'delete', ref }); },
    async commit(){
      // Écritures individuelles, parallélisme réduit (SQLite derrière PocketBase supporte
      // mal beaucoup d'écritures simultanées), avec 3 tentatives en cas d'échec passager.
      const CONCURRENCY = 2;
      const MAX_ATTEMPTS = 3;
      let idx = 0;
      const errors = [];
      async function runOp(op){
        const col = pb.collection(op.ref._collection);
        if(op.type === 'create') await col.create(op.data);
        else if(op.type === 'update') await col.update(op.ref.id, op.data);
        else if(op.type === 'delete') await col.delete(op.ref.id);
      }
      async function worker(){
        while(idx < ops.length){
          const op = ops[idx++];
          // Les créations ne sont PAS retentées : une "erreur" peut en réalité être une
          // réponse lente alors que l'écriture a déjà eu lieu côté serveur — retenter créerait
          // un doublon. update/delete n'ont pas ce risque (rejouer un même ID est sans danger).
          const attempts = op.type === 'create' ? 1 : MAX_ATTEMPTS;
          let lastErr = null;
          for(let attempt=1; attempt<=attempts; attempt++){
            try{ await runOp(op); lastErr = null; break; }
            catch(e){
              lastErr = e;
              if(attempt < attempts) await new Promise(r=>setTimeout(r, 150*attempt));
            }
          }
          if(lastErr){
            const detail = (lastErr.response && Object.keys(lastErr.response).length) ? JSON.stringify(lastErr.response)
              : (lastErr.data && Object.keys(lastErr.data).length) ? JSON.stringify(lastErr.data)
              : `${lastErr.status||''} ${lastErr.message||lastErr}`;
            console.error(`Échec définitif sur ${op.type} (${op.ref._collection}${op.ref.id?'/'+op.ref.id:''}) :`, detail, op.data);
            errors.push(lastErr);
          }
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ops.length || 1) }, worker));
      if(errors.length){
        console.error(`${errors.length} / ${ops.length} écriture(s) ont échoué définitivement.`);
        // Ne bloque le reste de l'import que si TOUT a échoué (vrai problème systémique) ;
        // quelques échecs isolés parmi beaucoup ne doivent pas arrêter les paquets suivants.
        if(errors.length === ops.length) throw errors[0];
      }
      return { total: ops.length, failed: errors.length, succeeded: ops.length - errors.length };
    },
  };
}

const db = { batch: makeBatch };

// app_settings : une seule fiche pour toute l'app (catégories, fournisseurs, utilisateurs…).
// Comme PocketBase attribue lui-même les ID, on retrouve la fiche existante au lieu d'en
// imposer un — s'il n'y en a pas encore, .get() renvoie exists:false (comme Firestore),
// pour que le seed initial (ensureSeeded) ne se déclenche qu'une seule fois, au tout début.
let settingsRecordId = null;
const settingsRef = {
  async get(){
    if(!settingsRecordId){
      const list = await pb.collection('app_settings').getList(1, 1);
      if(list.items.length) settingsRecordId = list.items[0].id;
    }
    if(settingsRecordId){
      const rec = await pb.collection('app_settings').getOne(settingsRecordId);
      return { exists: true, data: ()=>rec };
    }
    return { exists: false, data: ()=>({}) };
  },
  async set(data, opts){
    const clean = pbClean(data);
    if(!settingsRecordId){
      const list = await pb.collection('app_settings').getList(1, 1);
      if(list.items.length) settingsRecordId = list.items[0].id;
    }
    if(settingsRecordId){
      await pb.collection('app_settings').update(settingsRecordId, clean);
    } else {
      const rec = await pb.collection('app_settings').create(clean);
      settingsRecordId = rec.id;
    }
  },
  onSnapshot(onNext, onError){
    let cancelled = false;
    let unsub = null;
    const push = async ()=>{
      try{
        if(!settingsRecordId){
          const list = await pb.collection('app_settings').getList(1, 1);
          if(list.items.length) settingsRecordId = list.items[0].id;
        }
        if(settingsRecordId){
          const rec = await pb.collection('app_settings').getOne(settingsRecordId);
          if(!cancelled) onNext({ data: ()=>rec });
        } else if(!cancelled){
          onNext({ data: ()=>({}) });
        }
      }catch(e){ if(!cancelled && onError) onError(e); }
    };
    push();
    pb.collection('app_settings').subscribe('*', push).then(u=>{ if(cancelled) u(); else unsub = u; }).catch(e=>{ if(onError) onError(e); });
    return ()=>{ cancelled = true; if(unsub) unsub(); };
  },
};

// Import manuel, à déclencher une seule fois (bouton dans Paramètres) — plus de
// déclenchement automatique au chargement, pour éviter les doublons si jamais
// l'écriture des réglages échoue silencieusement sur un poste.
function setInitialSeedProgress(key, p){
  catalogueImportProgress[key] = { ...(catalogueImportProgress[key]||{}), ...p };
  renderParametresPanel();
}

async function importInitialSeedItems(){
  const key = 'initial_seed';
  if(state.initialSeedDone){
    toast("Les données de départ ont déjà été importées.");
    return;
  }
  if(catalogueImportProgress[key] && catalogueImportProgress[key].busy){
    toast("Un import est déjà en cours, attends qu'il se termine.");
    return;
  }
  const seed = loadSeedItems();
  if(!seed.length){
    setInitialSeedProgress(key, { busy:false, isError:true, message:"Données de départ introuvables dans le fichier." });
    return;
  }
  setInitialSeedProgress(key, { busy:true, isError:false, message:`Import en cours… 0 / ${fmtNum(seed.length)}`, done:0, total: seed.length });
  let done = 0;
  try{
    for(const chunk of chunkArray(seed, 400)){
      const batch = db.batch();
      chunk.forEach(it => {
        const ref = itemsCol.doc();
        batch.set(ref, { ...it, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await batch.commit();
      done += chunk.length;
      setInitialSeedProgress(key, { message:`Import en cours… ${fmtNum(done)} / ${fmtNum(seed.length)}`, done, total: seed.length });
    }
  }catch(err){
    setInitialSeedProgress(key, { busy:false, isError:true, message: `Erreur pendant l'import (${fmtNum(done)} / ${fmtNum(seed.length)} déjà écrites) : ${err.message}` });
    return;
  }
  state.initialSeedDone = true;
  settingsRef.set({ initialSeedDone: true }, { merge: true }).catch(()=>{});
  setInitialSeedProgress(key, { busy:false, isError:false, message: `Import terminé : ${fmtNum(seed.length)} référence(s) importées avec succès.`, done:1, total:1 });
  toast("Données de départ importées.");
}

function startSync(){
  renderLoading();
  ensureSeeded().catch(err => { connectionError = err.message; renderLoading(); });

  settingsRef.onSnapshot(doc => {
    const d = doc.data() || {};

  }, err => { connectionError = err.message; renderLoading(); });

  attachCatalogueListener();
}

/* ---------- TopTex integration (credentials stored locally per device, not synced) ---------- */
const TOPTEX_BASE = "https://api.toptex.io";
const TOPTEX_CREDS_KEY = "csb_toptex_creds_v1";
let toptexToken = null;

function getToptexCreds(){
  try{ return JSON.parse(localStorage.getItem(TOPTEX_CREDS_KEY)) || null; }catch(e){ return null; }
}
function setToptexCreds(creds){
  localStorage.setItem(TOPTEX_CREDS_KEY, JSON.stringify(creds));
}
function clearToptexCreds(){
  localStorage.removeItem(TOPTEX_CREDS_KEY);
  toptexToken = null;
}

async function toptexAuthenticate(){
  const creds = getToptexCreds();
  if(!creds || !creds.username || !creds.password || !creds.apikey){
    throw new Error("Accès TopTex non configuré sur cet ordinateur (à faire dans Paramètres).");
  }
  const resp = await fetch(`${TOPTEX_BASE}/v3/authenticate`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": creds.apikey },
    body: JSON.stringify({ username: creds.username, password: creds.password })
  });
  if(!resp.ok){
    const text = await resp.text();
    throw new Error(`Authentification TopTex refusée (HTTP ${resp.status}) : ${text.slice(0,200)}`);
  }
  const data = await resp.json();
  if(!data.token) throw new Error("Réponse TopTex sans token.");
  toptexToken = data.token;
  return toptexToken;
}

async function toptexGet(path, params){
  const creds = getToptexCreds();
  if(!toptexToken) await toptexAuthenticate();
  const url = new URL(`${TOPTEX_BASE}${path}`);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  let resp = await fetch(url, { headers: { "x-api-key": creds.apikey, "x-toptex-authorization": toptexToken } });
  if(resp.status === 401 || resp.status === 403){
    // token expired, retry once after re-authenticating
    await toptexAuthenticate();
    resp = await fetch(url, { headers: { "x-api-key": creds.apikey, "x-toptex-authorization": toptexToken } });
  }
  const text = await resp.text();
  let data = null;
  try{ data = JSON.parse(text); }catch(e){}
  return { ok: resp.ok, status: resp.status, data, raw: text };
}

/* ---------- Valento integration (credentials stored locally per device, not synced) ----------
   Valento's API has no per-reference lookup: it only serves a paginated full catalog
   (article_ref = parent product, cref = article_ref + color_ref + size_ref = one variant).
   Valento also blocks direct browser calls (no CORS), so requests go through the same
   Cloudflare Worker relay already used by Import_Fiches_Axonaut.html. */
const VALENTO_CREDS_KEY = "csb_valento_creds_v1";
const AXONAUT_PROXY_URL = "https://axonaut-proxy.atelier-csb.workers.dev";
// Falk & Ross (et potentiellement d'autres) bloquent le "hotlinking" (chargement de leurs images
// depuis un autre site) : on fait passer ces images-là par le relais Cloudflare comme pour TopTex.
const PROXIED_IMAGE_HOSTS = ["download.falk-ross.eu"];
function imgSrc(url){
  if(!url) return url;
  try{
    const host = new URL(url).hostname;
    if(PROXIED_IMAGE_HOSTS.includes(host)) return `${AXONAUT_PROXY_URL}?img=${encodeURIComponent(url)}`;
  }catch(e){}
  return url;
}
let valentoCatalogCache = null; // array of products, built lazily
let valentoCatalogPromise = null;

function getValentoCreds(){
  try{ return JSON.parse(localStorage.getItem(VALENTO_CREDS_KEY)) || null; }catch(e){ return null; }
}
function setValentoCreds(creds){
  localStorage.setItem(VALENTO_CREDS_KEY, JSON.stringify(creds));
}
function clearValentoCreds(){
  localStorage.removeItem(VALENTO_CREDS_KEY);
  valentoCatalogCache = null;
}

async function valentoFetchPage(page, pageSize){
  const creds = getValentoCreds();
  if(!creds || !creds.username || !creds.password){
    throw new Error("Accès Valento non configuré sur cet ordinateur (à faire dans Paramètres).");
  }
  const valentoPath = `/catalog_feed.php?page=${page}&page_size=${pageSize}&idioma=fr`;
  const url = `${AXONAUT_PROXY_URL}?valento=${encodeURIComponent(valentoPath)}`;
  const resp = await fetch(url, {
    headers: { 'Authorization': 'Basic ' + btoa(`${creds.username}:${creds.password}`) }
  });
  const text = await resp.text();
  let data = null;
  try{ data = JSON.parse(text); }catch(e){}
  return { ok: resp.ok, status: resp.status, data, raw: text };
}

// Fetches the whole Valento catalog (paginated) once, caches it in memory for this session.
async function valentoFetchFullCatalog(onProgress){
  if(valentoCatalogCache) return valentoCatalogCache;
  if(valentoCatalogPromise) return valentoCatalogPromise;
  valentoCatalogPromise = (async ()=>{
    const pageSize = 500;
    let page = 1;
    let all = [];
    let total = null;
    while(true){
      const res = await valentoFetchPage(page, pageSize);
      if(!res.ok){
        throw new Error(`Valento a refusé la requête (HTTP ${res.status}) : ${res.raw.slice(0,200)}`);
      }
      const products = (res.data && Array.isArray(res.data.products)) ? res.data.products : [];
      all = all.concat(products);
      total = res.data && typeof res.data.total === 'number' ? res.data.total : null;
      if(onProgress) onProgress(all.length, total);
      if(products.length < pageSize || (total !== null && all.length >= total)) break;
      page++;
      if(page > 200) break; // safety cap
    }
    valentoCatalogCache = all;
    return all;
  })();
  try{
    return await valentoCatalogPromise;
  } finally {
    valentoCatalogPromise = null;
  }
}

function findFirstImageUrl(obj, depth){
  if(depth > 4 || !obj) return null;
  if(typeof obj === 'string' && /^https?:\/\/.*\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(obj)) return obj;
  if(Array.isArray(obj)){
    for(const item of obj){ const found = findFirstImageUrl(item, depth+1); if(found) return found; }
    return null;
  }
  if(typeof obj === 'object'){
    for(const key of Object.keys(obj)){
      if(/image|picture|packshot|photo|visuel/i.test(key)){
        const found = findFirstImageUrl(obj[key], depth+1);
        if(found) return found;
      }
    }
    for(const key of Object.keys(obj)){
      const found = findFirstImageUrl(obj[key], depth+1);
      if(found) return found;
    }
  }
  return null;
}
function collectImageUrls(obj, out, depth){
  out = out || []; depth = depth || 0;
  if(depth > 5 || !obj || out.length >= 6) return out;
  if(typeof obj === 'string' && /^https?:\/\/.*\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(obj)){
    if(!out.includes(obj)) out.push(obj);
    return out;
  }
  if(Array.isArray(obj)){ obj.forEach(item => collectImageUrls(item, out, depth+1)); return out; }
  if(typeof obj === 'object'){ Object.values(obj).forEach(v => collectImageUrls(v, out, depth+1)); }
  return out;
}

const toptexCache = {}; // itemId -> true once loaded

function extractRows(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.items)) return data.items;
  if(data && Array.isArray(data.results)) return data.results;
  if(data && Array.isArray(data.products)) return data.products;
  if(data && Array.isArray(data.data)) return data.data;
  if(data && typeof data === 'object') return [data];
  return [];
}

function normText(s){
  return String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function valentoFindProduct(catalog, reference){
  const target = normText(reference);
  if(!target) return null;
  // Chez Valento, "la référence" peut désigner soit le code interne (article_ref, ex. CAVAATL),
  // soit le nom du modèle (ex. ATLETIC, BIKE, WAVE, EAGLE) — on vérifie les deux.
  return catalog.find(p => normText(p.article_ref) === target)
      || catalog.find(p => normText(p.name) === target)
      || null;
}
function matchesVariant(entry, item){
  const entrySize = normText(entry.size);
  const entryColor = normText(entry.color);
  const itemTaille = normText(item.taille);
  const itemCouleur = normText(item.couleur);
  const sizeOk = !itemTaille || !entrySize || entrySize === itemTaille || entrySize.includes(itemTaille) || itemTaille.includes(entrySize);
  const colorOk = !itemCouleur || !entryColor || entryColor.includes(itemCouleur) || itemCouleur.includes(entryColor);
  return sizeOk && colorOk;
}
function findFieldValue(obj, pattern, depth){
  depth = depth || 0;
  if(depth > 4 || !obj) return null;
  if(Array.isArray(obj)){
    for(const item of obj){ const found = findFieldValue(item, pattern, depth+1); if(found !== null && found !== undefined) return found; }
    return null;
  }
  if(typeof obj === 'object'){
    for(const key of Object.keys(obj)){
      if(!pattern.test(key)) continue;
      const val = obj[key];
      if(typeof val === 'string' || typeof val === 'number') return val;
      if(val && typeof val === 'object' && !Array.isArray(val)){
        // Multi-language field, e.g. { de:"...", en:"...", fr:"..." } — prefer French.
        if(typeof val.fr === 'string') return val.fr;
        if(typeof val.en === 'string') return val.en;
        const firstString = Object.values(val).find(v => typeof v === 'string');
        if(firstString) return firstString;
      }
    }
    for(const key of Object.keys(obj)){
      const found = findFieldValue(obj[key], pattern, depth+1);
      if(found !== null && found !== undefined) return found;
    }
  }
  return null;
}

const VALENTO_MATERIALS = {
  poliester:'Polyester', algodon:'Coton', polipropileno:'Polypropylène', poliuretano:'Polyuréthane',
  elastano:'Élasthanne', pvc:'PVC', acrilico:'Acrylique', poliamida:'Polyamide', microfibra:'Microfibre',
  lana:'Laine', viscosa:'Viscose', nailon:'Nylon', lino:'Lin', poliacrilico:'Polyacrylique', modal:'Modal',
};
function translateValentoComposition(raw){
  if(!raw || typeof raw !== 'string') return null;
  const parts = raw.split('##').map(part=>{
    const idx = part.indexOf('_');
    if(idx < 0) return null;
    const pct = part.slice(0, idx);
    const mat = part.slice(idx+1);
    const fr = VALENTO_MATERIALS[mat.toLowerCase()] || (mat.charAt(0).toUpperCase()+mat.slice(1).replace(/_/g,' '));
    return `${pct}% ${fr}`;
  }).filter(Boolean);
  return parts.length ? parts.join(', ') : null;
}
const VALENTO_IRON = { '0':'repassage doux (110°C max)', '1':'repassage moyen (150°C max)', '2':'repassage chaud (200°C max)' };
function buildValentoEntretien(ch){
  if(!ch) return null;
  const parts = [];
  const temp = ch['temperatura agua'];
  if(temp && temp !== '0') parts.push(`Lavage ${temp}°C`);
  const fer = ch['planchado'];
  if(VALENTO_IRON[fer]) parts.push(VALENTO_IRON[fer]);
  if(ch['secadora'] === '1') parts.push('sèche-linge autorisé');
  if(ch['limpieza en seco'] === '1') parts.push('nettoyage à sec autorisé');
  if(ch['lejia'] === '1') parts.push('javel autorisée');
  return parts.length ? parts.join(' · ') : null;
}

/* ---------- Fichiers fournisseurs — parseurs (lecture Excel/JSON en local, dans le navigateur) ---------- */
function findHeaderRow(raw, anchorColumnName, maxScan){
  maxScan = maxScan || 5;
  for(let i=0; i<Math.min(maxScan, raw.length); i++){
    const row = raw[i];
    if(row && row.some(c => String(c==null?'':c).trim() === anchorColumnName)) return i;
  }
  return 0;
}
function sheetToRows(wb, sheetName, anchorColumnName){
  const ws = wb.Sheets[sheetName];
  if(!ws) return null;
  const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
  const headerIdx = findHeaderRow(raw, anchorColumnName);
  const header = (raw[headerIdx]||[]).map(h=>String(h==null?'':h).trim());
  const data = raw.slice(headerIdx+1);
  return { header, data };
}
function rowObj(header, row){
  const o = {};
  header.forEach((h,i)=>{ o[h] = row[i]; });
  return o;
}
function toNum(v){
  if(v == null || v === '') return null;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isNaN(n) ? null : n;
}

// ----- Valento : fichier JSON téléchargé via le script fourni (catalogue brut Valento) -----
async function parseValentoFile(files, onProgress){
  const items = [];
  let fileIdx = 0;
  for(const file of files){
    fileIdx++;
    onProgress({ message: `Lecture de ${escapeHtml(file.name)} (fichier ${fileIdx}/${files.length})…` });
    const text = await file.text();
    let data;
    try{ data = JSON.parse(text); }catch(e){ throw new Error(`« ${file.name} » n'est pas un JSON valide (${e.message}).`); }
    if(!Array.isArray(data)) throw new Error(`« ${file.name} » n'a pas le format attendu (liste de produits Valento).`);
    data.forEach(product=>{
      const variants = Array.isArray(product.variants) ? product.variants : [];
      const cat = Array.isArray(product.category_path) && product.category_path.length ? product.category_path[product.category_path.length-1] : null;
      const type_ = product.description || null;
      const modele = product.name || null;
      const designation = [type_, modele].filter(Boolean).join(' ') || null;
      const ch = product.characteristics || {};
      const composition = translateValentoComposition(ch.composicion || ch.Composicion);
      const grammage = ch.densidad ? `${ch.densidad} g/m²` : null;
      const entretien = buildValentoEntretien(ch);
      variants.forEach(v=>{
        items.push({
          reference: product.article_ref || null,
          type: type_, modele,
          taille: v.size || null,
          couleur: v.color || null,
          categorie: cat,
          fournisseur: 'Valento',
          qte: 0,
          prix: v.net_price != null ? Number(v.net_price) : null,
          note: v.cref ? `cref ${v.cref}` : null,
          imageUrl: v.image || null,
          stock: v.stock != null ? Number(v.stock) : null,
          designation, composition, grammage, entretien,
        });
      });
    });
  }
  return items;
}

// ----- Falk & Ross : fichier Excel ArticleMasterData (feuilles article/language/category/article pictures) -----
const FALKROSS_MATERIALS_FR = ['coton','polyester','viscose','elasthanne','laine','acrylique','polyamide','nylon','lin','modal','soie','cachemire'];
const FALKROSS_CATEGORY_BLOCK = new Set(['MEILLEURES VENTES','SANS ÉTIQUETTE','NOUVEAUTÉS 2026','ECO RESPONSABLE','Sublimation','Streetwear','Sports et Loisirs']);
function falkKey(v){
  if(v == null || v === '') return null;
  const num = typeof v === 'number' ? v : parseFloat(v);
  if(isNaN(num)) return null;
  return Math.round(num * 100) / 100;
}
function falkExtractComposition(desc){
  if(!desc) return null;
  const parts = String(desc).split('·').map(p=>p.trim()).filter(Boolean);
  for(const p of parts){
    if(p.includes('%') && FALKROSS_MATERIALS_FR.some(m=>p.toLowerCase().includes(m))) return p.replace(/\.$/,'').trim();
  }
  return null;
}
function falkExtractGrammage(desc){
  if(!desc) return null;
  const m = String(desc).match(/(\d+)\s?g\/m²/);
  return m ? `${m[1]} g/m²` : null;
}
function falkIsWashTag(s){ return /^Lavable/i.test(String(s||'')); }

async function parseFalkRossFile(files, onProgress){
  const items = [];
  let fileIdx = 0;
  for(const file of files){
    fileIdx++;
    onProgress({ message: `Lecture de ${escapeHtml(file.name)} (fichier ${fileIdx}/${files.length})…` });
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });

    const art = sheetToRows(wb, 'article', 'article number short');
    if(!art) throw new Error(`« ${file.name} » : feuille "article" introuvable — vérifie que c'est bien le fichier ArticleMasterData.`);

    const lang = sheetToRows(wb, 'language', 'article_description');
    const frLang = {};
    if(lang) lang.data.forEach(row=>{
      const o = rowObj(lang.header, row);
      if(o.language === 'french'){
        const k = falkKey(o['article number short with point']);
        if(k != null && frLang[k] === undefined) frLang[k] = o.article_description;
      }
    });

    const cat = sheetToRows(wb, 'category', 'article group');
    const catByKey = {};
    if(cat) cat.data.forEach(row=>{
      const o = rowObj(cat.header, row);
      if(o.language === 'french' && o['article group'] === 'Produits'){
        const k = falkKey(o['article number short with point']);
        if(k == null) return;
        if(!catByKey[k]) catByKey[k] = [];
        if(o['article subgroup']) catByKey[k].push(o['article subgroup']);
      }
    });
    const typeMap = {}, washMap = {};
    Object.entries(catByKey).forEach(([k, subs])=>{
      const wash = subs.filter(falkIsWashTag);
      if(wash.length) washMap[k] = wash[0];
      const kept = subs.filter(s=>!FALKROSS_CATEGORY_BLOCK.has(s) && !falkIsWashTag(s));
      typeMap[k] = kept.length ? kept[0] : (subs.length ? subs[0] : null);
    });

    const pics = sheetToRows(wb, 'article pictures', 'URL');
    const picByColor = {}, picByAny = {};
    if(pics) pics.data.forEach(row=>{
      const o = rowObj(pics.header, row);
      const k = falkKey(o['article number short with point']);
      if(k == null || !o['URL']) return;
      const color = o['colour number'] != null ? String(o['colour number']) : '-';
      const ck = k+'|'+color;
      if(o['image type'] === 'f' || picByColor[ck] === undefined) picByColor[ck] = o['URL'];
      if(picByAny[k] === undefined) picByAny[k] = o['URL'];
    });

    onProgress({ message: `Traitement de ${fmtNum(art.data.length)} lignes…` });
    art.data.forEach((row, i)=>{
      const o = rowObj(art.header, row);
      if(o['article number long'] == null) return;
      const key = falkKey(o['article number short']);
      const colorCode = o['color_code'] != null ? String(o['color_code']) : '-';
      const descFr = frLang[key];
      const img = picByColor[key+'|'+colorCode] || picByAny[key];
      const price = o['piece_price'] != null ? o['piece_price'] : o['default_price'];
      const ref = o['supplier_article_name'] || o['article number short'];
      items.push({
        reference: String(ref),
        type: typeMap[key] || null,
        modele: o['article_name'] || null,
        taille: o['size_name'] || null,
        couleur: o['color_name'] || null,
        categorie: typeMap[key] || null,
        fournisseur: 'Falk & Ross',
        qte: 0,
        prix: toNum(price),
        note: `art. ${o['article number long']} (style ${o['article number short']})`,
        imageUrl: img || null,
        stock: null,
        designation: [o['article_name'], String(ref)].filter(Boolean).join(' '),
        composition: falkExtractComposition(descFr),
        grammage: falkExtractGrammage(descFr),
        entretien: washMap[key] || null,
      });
    });
  }
  return items;
}

async function loadValentoDetail(item, row, priceCell){
  const creds = getValentoCreds();
  if(!creds){
    row.querySelector('td').innerHTML = `<div class="hint" style="color:var(--rouge); margin:10px 0;">Aucun accès Valento configuré sur cet ordinateur. Va dans Paramètres → « Accès Valento ».</div>`;
    return;
  }
  let catalog;
  try{
    catalog = await valentoFetchFullCatalog((loaded, total)=>{
      row.querySelector('td').innerHTML = `<div class="hint" style="margin:10px 0;">Chargement du catalogue Valento… ${loaded}${total?' / '+total:''}</div>`;
    });
  }catch(err){
    row.querySelector('td').innerHTML = `<div class="hint" style="color:var(--rouge); margin:10px 0;">${escapeHtml(err.message)}</div>`;
    return;
  }

  row = document.querySelector(`tr.tt-detail-row[data-vl-detail-for="${item.id}"]`) || row;
  priceCell = document.querySelector(`[data-valento-price-for="${item.id}"]`) || priceCell;

  const product = valentoFindProduct(catalog, item.reference);
  if(!product){
    if(priceCell) priceCell.innerHTML = `<span class="hint" style="margin:0;">Non trouvé</span>`;
    row.querySelector('td').innerHTML = `<div class="hint" style="margin:10px 0;">Référence « ${escapeHtml(item.reference)} » non trouvée dans le catalogue Valento (${fmtNum(catalog.length)} produits).</div>`;
    return;
  }

  const variants = Array.isArray(product.variants) ? product.variants : [];
  const matched = variants.filter(v => matchesVariant(v, item));
  const bestMatch = matched[0] || variants[0] || null;
  const matchLabel = [item.taille, item.couleur].filter(Boolean).join(' · ');

  if(priceCell){
    priceCell.innerHTML = (bestMatch && bestMatch.net_price != null)
      ? `<div>${fmtPrix(bestMatch.net_price)}</div><button class="ghost small" data-apply-valento-price="${escapeHtml(item.id)}" data-valento-price="${bestMatch.net_price}">Appliquer</button>`
      : `<span class="hint" style="margin:0;">Aucun prix</span>`;
  }

  const ch = product.characteristics || {};
  const composition = translateValentoComposition(ch.composicion || ch.Composicion);
  const grammage = ch.densidad ? `${ch.densidad} g/m²` : null;
  const entretien = buildValentoEntretien(ch);
  const images = collectImageUrls(product.images, [], 0);
  if(bestMatch && bestMatch.image) images.unshift(bestMatch.image);

  function groupByNetPrice(rows){
    const groups = {};
    rows.forEach(r=>{
      if(r.net_price == null) return;
      const key = Number(r.net_price).toFixed(2);
      if(!groups[key]) groups[key] = { price: Number(r.net_price), sizes: [] };
      if(r.size && !groups[key].sizes.includes(r.size)) groups[key].sizes.push(r.size);
    });
    return Object.values(groups).sort((a,b)=>a.price-b.price);
  }
  const sameColorVariants = variants.filter(v => normText(v.color).includes(normText(item.couleur)) || normText(item.couleur).includes(normText(v.color)));
  const scopeVariants = (item.couleur && sameColorVariants.length) ? sameColorVariants : variants;
  const priceGroups = groupByNetPrice(scopeVariants);
  const itemSizeNorm = normText(item.taille);
  const priceHtml = priceGroups.length ? `
    <div class="tt-kv">
      ${priceGroups.map(g=>{
        const isMatch = itemSizeNorm && g.sizes.some(s=>normText(s)===itemSizeNorm);
        return `<div${isMatch?' style="font-weight:700;"':''}>${escapeHtml(g.sizes.join(', ')||'—')}</div><div${isMatch?' style="font-weight:700;"':''}>${fmtPrix(g.price)}</div>`;
      }).join('')}
    </div>
  ` : `<div class="hint">Aucun prix trouvé.</div>`;

  const unavailable = scopeVariants.filter(v => (Number(v.stock)||0) <= 0);
  const stockHtml = unavailable.length === 0

          ${!composition && !grammage && !entretien ? `<div class="hint" style="grid-column:1/-1;">Composition/grammage/entretien non trouvés.</div>` : ''}
        </div>

/* ---------- Fournisseurs — registre générique + comparaison de prix ----------
   Chaque fournisseur "actif" expose une fonction quickPrice(item) qui renvoie
   { ok, found, price, image, composition, error }. Les fournisseurs sans API
   intégrée pour l'instant apparaissent comme "à venir" dans la comparaison. */
function catalogueQuickPrice(fournisseur){
  return async function(item){
    const flat = flattenCatalogueItems();
    const rows = flat.filter(ci => ci.fournisseur === fournisseur && normText(ci.reference) === normText(item.reference));
    if(rows.length === 0){
      const any = flat.some(ci=>ci.fournisseur===fournisseur);
      if(!any) return { ok:false, error: `Catalogue ${fournisseur} non importé (Paramètres)` };
      return { ok:true, found:false };
    }
    const matched = rows.filter(ci => matchesCatalogueItem(ci, item));
    const priced = (matched.length ? matched : rows).filter(ci=>ci.prix != null);
    if(priced.length === 0) return { ok:true, found:true, price: null };
    const best = priced.reduce((a,b)=> Number(b.prix) < Number(a.prix) ? b : a);
    return { ok:true, found:true, price: Number(best.prix) };
  };
}

const SUPPLIER_ADAPTERS = [
  { id: 'toptex', label: 'TopTex', hasCreds: () => !!getToptexCreds(), quickPrice: toptexQuickPrice },
  { id: 'valento', label: 'Valento', hasCreds: () => !!getValentoCreds(), quickPrice: valentoQuickPrice },
  { id: 'falkross', label: 'Falk & Ross', hasCreds: () => state.catalogueItems.some(ci=>ci.fournisseur==='Falk & Ross'), quickPrice: catalogueQuickPrice('Falk & Ross') },
  { id: 'imbretex', label: 'Imbretex', hasCreds: () => state.catalogueItems.some(ci=>ci.fournisseur==='Imbretex'), quickPrice: catalogueQuickPrice('Imbretex') },
  { id: 'safetyjogger', label: 'Safety Jogger', hasCreds: () => state.catalogueItems.some(ci=>ci.fournisseur==='Safety Jogger'), quickPrice: catalogueQuickPrice('Safety Jogger') },
  { id: 'uneek', label: 'Uneek', hasCreds: () => false, comingSoon: true },
];

async function toptexQuickPrice(item){
  try{
    const res = await toptexGet('/v3/products/price', { catalog_reference: item.reference });
    if(!res.ok) return { ok:false, error: `HTTP ${res.status}` };
    const rows = extractRows(res.data);
    if(rows.length === 0) return { ok:true, found:false };
    const matched = rows.filter(r => matchesVariant(r, item));
    const best = matched[0] || rows[0];
    const up = Array.isArray(best.prices) ? (best.prices.find(p=>String(p.quantity)==='1') || best.prices[0]) : null;
    return { ok:true, found:true, price: up ? Number(up.price) : null };
  }catch(err){
    return { ok:false, error: err.message };
  }
}

function matchesCatalogueItem(ci, item){
  const t1 = normText(ci.taille), t2 = normText(item.taille);
  const c1 = normText(ci.couleur), c2 = normText(item.couleur);
  const sizeOk = !t2 || !t1 || t1===t2 || t1.includes(t2) || t2.includes(t1);
  const colorOk = !c2 || !c1 || c1.includes(c2) || c2.includes(c1);
  return sizeOk && colorOk;
}

// Le Catalogue fournisseurs est stocké groupé par produit (un document = toutes les variantes
// couleur/taille), pour limiter le nombre d'écritures Firestore. Cette fonction "aplatit" ça
// en lignes couleur/taille individuelles, pour le code qui a besoin de ce format.
function flattenCatalogueItems(){
  const out = [];
  state.catalogueItems.forEach(prod=>{
    const variants = Array.isArray(prod.variants) ? prod.variants : [];
    variants.forEach((v,i)=>{
      out.push({
        id: `${prod.id}__${i}`,
        reference: prod.reference, fournisseur: prod.fournisseur,
        type: prod.type, modele: prod.modele, categorie: prod.categorie,
        designation: prod.designation, composition: prod.composition,
        grammage: prod.grammage, entretien: prod.entretien,
        taille: v.taille, couleur: v.couleur, prix: v.prix, stock: v.stock, note: v.note,
        imageUrl: v.imageUrl || prod.imageUrl || null,
      });
    });
  });
  return out;
}

async function valentoQuickPrice(item){
  try{
    const catalog = await valentoFetchFullCatalog();
    const product = valentoFindProduct(catalog, item.reference);
    if(!product) return { ok:true, found:false };
    const variants = Array.isArray(product.variants) ? product.variants : [];
    const matched = variants.filter(v => matchesVariant(v, item));
    const best = matched[0] || variants[0] || null;
    return { ok:true, found: !!best, price: best && best.net_price != null ? Number(best.net_price) : null };
  }catch(err){
    return { ok:false, error: err.message };
  }
}

function toggleCompareRow(item){

async function loadCompareRow(item, row){
  const td = row.querySelector('td');
  const rowsHtml = SUPPLIER_ADAPTERS.map(a=>{
    if(a.comingSoon){
      return `<tr><td>${escapeHtml(a.label)}</td><td colspan="2" class="hint">À venir — envoie-moi la documentation de leur API pour l'activer.</td></tr>`;
    }
    if(!a.hasCreds()){
      return `<tr><td>${escapeHtml(a.label)}</td><td colspan="2" class="hint">Non configuré (Paramètres → Accès ${escapeHtml(a.label)}).</td></tr>`;
    }
    return `<tr data-cmp-line="${a.id}"><td>${escapeHtml(a.label)}</td><td class="num">Recherche…</td><td></td></tr>`;
  }).join('');
  td.innerHTML = `
    <table style="box-shadow:none; margin:10px 0;">
      <thead><tr><th>Fournisseur</th><th class="num">Prix</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;

  const activeAdapters = SUPPLIER_ADAPTERS.filter(a => !a.comingSoon && a.hasCreds());
  const results = await Promise.all(activeAdapters.map(a => a.quickPrice(item).catch(err=>({ok:false, error:err.message}))));

  let cheapest = null;
  activeAdapters.forEach((a, i)=>{
    const res = results[i];
    const line = td.querySelector(`[data-cmp-line="${a.id}"]`);
    if(!line) return;
    if(!res.ok){
      line.innerHTML = `<td>${escapeHtml(a.label)}</td><td colspan="2" class="hint" style="color:var(--rouge);">Erreur : ${escapeHtml(res.error||'inconnue')}</td>`;
      return;
    }
    if(!res.found || res.price == null){
      line.innerHTML = `<td>${escapeHtml(a.label)}</td><td colspan="2" class="hint">Référence non trouvée</td>`;
      return;
    }
    if(!cheapest || res.price < cheapest.price) cheapest = { id:a.id, label:a.label, price:res.price };
    line.innerHTML = `<td>${escapeHtml(a.label)}</td><td class="num">${fmtPrix(res.price)}</td><td></td>`;
  });

  if(cheapest){
    activeAdapters.forEach((a,i)=>{
      const line = td.querySelector(`[data-cmp-line="${a.id}"]`);
      if(!line) return;
      if(a.id === cheapest.id){
        line.style.fontWeight = '700';
        const lastCell = line.children[2];
        if(lastCell) lastCell.innerHTML = `<span style="color:var(--vert); font-weight:600; font-size:12px;">le moins cher</span> <button class="ghost small" data-apply-cmp-price="${escapeHtml(item.id)}" data-cmp-price="${cheapest.price}">Appliquer</button>`;
      }
    });
  }

  td.querySelectorAll('[data-apply-cmp-price]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      itemsCol.doc(item.id).update({ prix: Number(btn.dataset.cmpPrice) }).then(()=>toast("Prix appliqué.")).catch(err=>toast("Erreur : "+err.message));
    });
  });
}

async function loadToptexDetail(item, row, priceCell){
  const reference = item.reference;
  const creds = getToptexCreds();
  if(!creds){
    row.querySelector('td').innerHTML = `<div class="hint" style="color:var(--rouge); margin:10px 0;">Aucun accès TopTex configuré sur cet ordinateur. Va dans Paramètres → « Accès TopTex ».</div>`;
    return;
  }

  const empty = { ok:false, status:0, data:null, raw:'' };
  const settled = await Promise.allSettled([
    toptexGet('/v3/products', { catalog_reference: reference, usage_right: 'b2b_uniquement' }),
    toptexGet('/v3/products/price', { catalog_reference: reference }),
    toptexGet('/v3/products/inventory', { catalog_reference: reference }),
  ]);
  const [catalogR, priceR, inventoryR] = settled;
  const catalog = catalogR.status === 'fulfilled' ? catalogR.value : { ...empty, error: catalogR.reason?.message };
  const price = priceR.status === 'fulfilled' ? priceR.value : { ...empty, error: priceR.reason?.message };
  const inventory = inventoryR.status === 'fulfilled' ? inventoryR.value : { ...empty, error: inventoryR.reason?.message };

  // Re-fetch live DOM elements in case the app re-rendered while we were waiting on the network.
  row = document.querySelector(`tr.tt-detail-row[data-detail-for="${item.id}"]`) || row;
  priceCell = document.querySelector(`[data-toptex-price-for="${item.id}"]`) || priceCell;

  try{
    const catalogRows = extractRows(catalog.data);
    const catalogData = catalogRows[0] || null;
    const images = collectImageUrls(catalog.data, [], 0);
    const designation = findFieldValue(catalogData, /^designation$/i) || findFieldValue(catalogData, /^name$/i) || '';
    const brand = findFieldValue(catalogData, /^brand$/i) || '';
    const composition = findFieldValue(catalog.data, /composition|material|matiere/i);
    const grammage = findFieldValue(catalog.data, /grammage|weight|poids|gsm/i);

    const priceRows = extractRows(price.data);
    const priceMatched = priceRows.filter(p => matchesVariant(p, item));
    const matchLabel = [item.taille, item.couleur].filter(Boolean).join(' · ');

    const bestMatch = priceMatched[0] || priceRows[0] || null;
    const unitPrice = bestMatch && Array.isArray(bestMatch.prices)
      ? (bestMatch.prices.find(p=>String(p.quantity)==='1') || bestMatch.prices[0])
      : null;
    if(priceCell){
      priceCell.innerHTML = unitPrice
        ? `<div>${fmtPrix(unitPrice.price)}</div><button class="ghost small" data-apply-toptex-price="${escapeHtml(item.id)}" data-toptex-price="${unitPrice.price}">Appliquer</button>`
        : `<span class="hint" style="margin:0;">Aucun prix</span>`;
    }

    function priceOf(p){
      const up = Array.isArray(p.prices) ? (p.prices.find(pr=>String(pr.quantity)==='1') || p.prices[0]) : null;
      return up ? Number(up.price) : null;
    }
    function groupByPrice(rows){
      const groups = {};
      rows.forEach(r=>{
        const price = priceOf(r);
        if(price === null || isNaN(price)) return;
        const key = price.toFixed(2);
        if(!groups[key]) groups[key] = { price, sizes: [] };
        if(r.size && !groups[key].sizes.includes(r.size)) groups[key].sizes.push(r.size);
      });
      return Object.values(groups).sort((a,b)=>a.price-b.price);
    }

    // Prefer grouping within the item's own color when we can find it, otherwise across all colors.
    const sameColorRows = priceRows.filter(p => normText(p.color).includes(normText(item.couleur)) || normText(item.couleur).includes(normText(p.color)));
    const rowsForGrouping = (item.couleur && sameColorRows.length) ? sameColorRows : priceRows;
    const priceGroups = groupByPrice(rowsForGrouping);
    const itemSizeNorm = normText(item.taille);

    let priceHtml;
    if(priceRows.length === 0){
      priceHtml = `<div class="hint">${price.ok ? 'Aucune donnée de prix trouvée pour cette référence.' : 'Erreur lors de la récupération des prix.'}</div>`;
    } else if(priceGroups.length === 0){
      priceHtml = `<div class="hint">Prix trouvé mais tailles non précisées dans la réponse.</div>`;
    } else {
      priceHtml = `
        <div class="tt-kv">
          ${priceGroups.map(g=>{
            const isMatch = itemSizeNorm && g.sizes.some(s=>normText(s)===itemSizeNorm);
            return `<div${isMatch?' style="font-weight:700;"':''}>${escapeHtml(g.sizes.join(', ') || '—')}</div><div${isMatch?' style="font-weight:700;"':''}>${fmtPrix(g.price)}</div>`;
          }).join('')}
        </div>
        ${(item.couleur && sameColorRows.length && sameColorRows.length < priceRows.length) ? `<div class="hint" style="margin-top:6px;">Pour la couleur « ${escapeHtml(item.couleur)} » (${sameColorRows.length} référence(s) sur ${priceRows.length} au total pour ce modèle).</div>` : ''}
      `;
    }

    const inventoryRows = extractRows(inventory.data);
    function resolveQty(inv){
      const candidates = [inv.quantity, inv.stock, inv.availableQuantity, inv.qty, inv.available_quantity];
      for(const c of candidates){ if(typeof c === 'number') return c; }
      return null;
    }
    function isUnavailable(inv){
      const q = resolveQty(inv);
      if(q !== null) return q <= 0;
      if(typeof inv.available === 'boolean') return !inv.available;
      if(typeof inv.inStock === 'boolean') return !inv.inStock;
      return false; // unknown shape: don't falsely flag as unavailable
    }
    const sameColorInv = inventoryRows.filter(inv => normText(inv.color).includes(normText(item.couleur)) || normText(item.couleur).includes(normText(inv.color)));
    const invScope = (item.couleur && sameColorInv.length) ? sameColorInv : inventoryRows;
    const unavailable = invScope.filter(isUnavailable);

    let inventoryHtml;
    if(inventoryRows.length === 0){
      inventoryHtml = `<div class="hint">${inventory.ok ? 'Aucune donnée de stock trouvée.' : 'Erreur lors de la récupération du stock.'}</div>`;
    } else if(unavailable.length === 0){
      inventoryHtml = `<div class="hint" style="color:var(--vert);">Tout est disponible chez TopTex${item.couleur && sameColorInv.length ? ' pour cette couleur' : ''}.</div>`;
    } else {
      inventoryHtml = `
        <div class="hint" style="color:var(--rouge); margin-bottom:6px;">Non disponible :</div>
        <div class="tt-kv">
          ${unavailable.slice(0,20).map(inv=>`<div>${escapeHtml(inv.size||'—')}</div><div>${escapeHtml(inv.color||'')}</div>`).join('')}
        </div>
      `;
    }

    row.querySelector('td').innerHTML = `
      <div style="display:flex; gap:20px; flex-wrap:wrap; padding:12px 4px;">
        ${images.length ? `<div class="tt-images" style="margin:0;">${images.slice(0,4).map(u=>`<img src="${escapeHtml(imgSrc(u))}" loading="lazy" style="width:80px; height:80px; cursor:zoom-in;" data-zoom-img="${escapeHtml(imgSrc(u))}">`).join('')}</div>` : ''}
        <div style="flex:1; min-width:200px;">
          <div style="font-family:Georgia,serif; font-size:14px; margin-bottom:6px;">${escapeHtml(designation || reference)}${brand ? ' — '+escapeHtml(brand) : ''}</div>
          <div class="tt-kv">
            ${grammage ? `<div>Grammage</div><div>${escapeHtml(grammage)}</div>` : ''}
            ${composition ? `<div>Composition</div><div>${escapeHtml(composition)}</div>` : ''}
            ${!grammage && !composition ? `<div class="hint" style="grid-column:1/-1;">Grammage/composition non trouvés dans la réponse TopTex (voir données brutes ci-dessous).</div>` : ''}
          </div>
          ${(brand || composition || designation) ? `<button class="ghost small" style="margin-top:8px;" data-copy-toptex-info="${escapeHtml(item.id)}">Copier vers la fiche article</button>` : ''}
        </div>
        <div style="flex:1; min-width:220px;">
          <div class="hint" style="margin:0 0 6px;">Prix (ta variante : ${escapeHtml(matchLabel || '—')})</div>
          ${priceHtml}
        </div>
        <div style="flex:1; min-width:200px;">
          <div class="hint" style="margin:0 0 6px;">Stock chez TopTex</div>
          ${inventoryHtml}
        </div>
      </div>
      <details class="tt-raw">
        <summary>Voir toutes les données brutes renvoyées par TopTex</summary>
        <div class="tt-section"><strong>Catalogue</strong><pre>${escapeHtml(JSON.stringify(catalog.data, null, 2))}</pre></div>
        <div class="tt-section"><strong>Prix</strong><pre>${escapeHtml(JSON.stringify(price.data, null, 2))}</pre></div>
        <div class="tt-section"><strong>Stock</strong><pre>${escapeHtml(JSON.stringify(inventory.data, null, 2))}</pre></div>
      </details>
    `;
    row.querySelectorAll('[data-apply-toptex-price]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const val = Number(btn.dataset.toptexPrice);
        itemsCol.doc(item.id).update({ prix: val }).then(()=>{
          toast("Prix mis à jour depuis TopTex.");
        }).catch(err=>toast("Erreur : "+err.message));
      });
    });
    row.querySelectorAll('[data-copy-toptex-info]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const updates = {};
        if(brand) updates.marque = brand;
        if(composition) updates.composition = composition;
        if(designation) updates.description = designation;
        itemsCol.doc(item.id).update(updates).then(()=>{
          toast("Fiche article mise à jour depuis TopTex.");
        }).catch(err=>toast("Erreur : "+err.message));
      });
    });

    toptexCache[item.id] = true;
  }catch(err){
    row.querySelector('td').innerHTML = `<div class="hint" style="color:var(--rouge); margin:10px 0;">${escapeHtml(err.message)}</div>`;
  }
}

/* ---------- Focus preservation ---------- */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) return null;
  const info = { id: el.id };
  if(typeof el.selectionStart === 'number'){ info.start = el.selectionStart; info.end = el.selectionEnd; }
  return info;
}
function restoreFocus(info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  el.focus();
  if(typeof info.start === 'number' && typeof el.setSelectionRange === 'function'){
    try{ el.setSelectionRange(info.start, info.end); }catch(e){}
  }
}
function rerenderPreservingFocus(fn){
  const info = captureFocus();
  fn();
  restoreFocus(info);
}

  const tabsHtml = TABS.filter(t=>myTabs.includes(t.id)).map(t=>
    `<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">${t.label}</button>`
  ).join('');

  app.innerHTML = `
    <nav class="tabs" style="margin-top:4px;">${tabsHtml}</nav>

    <section class="cards">
      <div class="card"><div class="num">${fmtNum(totalRefs)}</div><div class="label">Lignes d'inventaire</div></div>
      <div class="card"><div class="num">${fmtNum(totalQte)}</div><div class="label">Pièces en stock</div></div>
      <div class="card"><div class="num">${fmtPrix(totalValeur)}</div><div class="label">Valeur totale</div></div>
      <div class="card"><div class="num">${fmtNum(nbCategories)}</div><div class="label">Catégories</div></div>
    </section>

    <div class="panel ${activeTab==='inventaire'?'active':''}" id="panel-inventaire"></div>
    <div class="panel ${activeTab==='catalogue'?'active':''}" id="panel-catalogue"></div>
    <div class="panel ${activeTab==='recherche'?'active':''}" id="panel-recherche"></div>
    <div class="panel ${activeTab==='parametres'?'active':''}" id="panel-parametres"></div>

    <footer class="foot">
      <span>Données synchronisées en direct entre tous les postes connectés à internet.</span>
      <span>Pense à exporter une sauvegarde régulièrement.</span>
    </footer>
  `;

  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; render(); });
  });
  const logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=> CSBAuth.logout());

  if(activeTab === 'inventaire') renderInventairePanel();
  if(activeTab === 'catalogue') renderCataloguePanel();
  if(activeTab === 'recherche') renderReberchePanel();
  if(activeTab === 'parametres') renderParametresPanel();
}

/* ---------- Shared table renderer ---------- */
function filterItems(items, q, cat){
  let rows = items;
  const ql = (q||'').trim().toLowerCase();
  if(ql){
    rows = rows.filter(it =>
      String(it.reference||'').toLowerCase().includes(ql) ||
      String(it.couleur||'').toLowerCase().includes(ql) ||
      String(it.taille||'').toLowerCase().includes(ql) ||
      String(it.categorie||'').toLowerCase().includes(ql)
    );
  }
  if(cat) rows = rows.filter(it => it.categorie === cat);
  return rows;
}

function itemsTableHTML(rows, idPrefix){
  const sorted = [...rows].sort((a,b)=>{
    let av, bv;
    const col = itemSort.col;
    if(col === 'qte' || col === 'prix'){ av = Number(a[col])||0; bv = Number(b[col])||0; }
    else if(col === 'valeur'){ av = (Number(a.qte)||0)*(Number(a.prix)||0); bv = (Number(b.qte)||0)*(Number(b.prix)||0); }
    else { av = String(a[col]||'').toLowerCase(); bv = String(b[col]||'').toLowerCase(); }
    if(av<bv) return -1*itemSort.dir; if(av>bv) return 1*itemSort.dir; return 0;
  });
  if(sorted.length === 0) return `<div class="empty">Aucun article trouvé.</div>`;

  const rowsHtml = sorted.map(it=>{
    const valeur = (Number(it.qte)||0) * (Number(it.prix)||0);
    return `<tr data-id="${escapeHtml(it.id)}">
      <td>${it.imageUrl ? `<img src="${escapeHtml(imgSrc(it.imageUrl))}" loading="lazy" style="width:40px; height:40px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:var(--paper-dim); cursor:zoom-in;" data-zoom-img="${escapeHtml(imgSrc(it.imageUrl))}">` : ''}</td>
      <td>${escapeHtml(it.reference)}</td>
      <td>${escapeHtml(it.taille||'—')}</td>
      <td><span class="cell-flex"><span class="swatch" style="background:${colorFor(it.couleur)}"></span>${escapeHtml(it.couleur||'—')}</span></td>
      <td><span class="cat-tag">${escapeHtml(it.categorie||'—')}</span></td>
      <td>${escapeHtml(it.fournisseur||'—')}</td>
      <td class="num"><input type="number" class="inline-edit qte-edit" min="0" step="1" value="${it.qte ?? 0}" data-id="${escapeHtml(it.id)}"></td>
      <td class="num"><input type="number" class="inline-edit price prix-edit" min="0" step="0.01" value="${it.prix ?? ''}" placeholder="—" data-id="${escapeHtml(it.id)}"></td>
      <td class="num">${fmtPrix(valeur)}</td>
      <td class="num toptex-price-cell" data-toptex-price-for="${escapeHtml(it.id)}">
        <button class="ghost small" data-toptex-item="${escapeHtml(it.id)}">Voir chez TopTex</button>
      </td>
      <td class="num valento-price-cell" data-valento-price-for="${escapeHtml(it.id)}">
        <button class="ghost small" data-valento-item="${escapeHtml(it.id)}">Voir chez Valento</button>
      </td>
      <td class="num">
        <button class="ghost small" data-compare-item="${escapeHtml(it.id)}">Comparer les fournisseurs</button>
      </td>
      <td>${escapeHtml(it.note||'—')}</td>
      <td>
        ${it.lienSite ? `<a href="${escapeHtml(it.lienSite)}" target="_blank" rel="noopener"><button class="ghost small" type="button">🔗 Site</button></a>` : ''}
        <button class="ghost small" data-edit-item="${escapeHtml(it.id)}">Modifier</button>
        <button class="ghost small" data-del-item="${escapeHtml(it.id)}">Suppr.</button>
      </td>
    </tr>
    <tr class="tt-detail-row" data-detail-for="${escapeHtml(it.id)}" style="display:none;">
      <td colspan="14"></td>
    </tr>
    <tr class="tt-detail-row" data-vl-detail-for="${escapeHtml(it.id)}" style="display:none;">
      <td colspan="14"></td>
    </tr>
    <tr class="tt-detail-row" data-cmp-detail-for="${escapeHtml(it.id)}" style="display:none;">
      <td colspan="14"></td>
    </tr>`;
  }).join('');

  return `
    <table id="${idPrefix}-table">
      <thead><tr>
        <th></th>
        <th data-sort="reference">Référence</th>
        <th data-sort="taille">Taille</th>
        <th data-sort="couleur">Couleur</th>
        <th data-sort="categorie">Catégorie</th>
        <th data-sort="fournisseur">Fournisseur</th>
        <th class="num" data-sort="qte">Quantité</th>
        <th class="num" data-sort="prix">Prix unitaire</th>
        <th class="num" data-sort="valeur">Valeur</th>
        <th class="num">Prix TopTex</th>
        <th class="num">Prix Valento</th>
        <th class="num">Comparer</th>
        <th>Note</th>
        <th></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
}

function attachTableHandlers(container, onSort){
  container.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.sort;
      if(itemSort.col === col) itemSort.dir *= -1; else { itemSort.col = col; itemSort.dir = 1; }
      onSort();
    });
  });
  container.querySelectorAll('.qte-edit').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const val = Math.max(0, Number(e.target.value)||0);
      itemsCol.doc(e.target.dataset.id).update({ qte: val }).catch(err=>toast("Erreur : "+err.message));
    });
  });
  container.querySelectorAll('.prix-edit').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const raw = e.target.value.trim();
      const val = raw === '' ? null : Math.max(0, Number(raw)||0);
      itemsCol.doc(e.target.dataset.id).update({ prix: val }).catch(err=>toast("Erreur : "+err.message));
    });
  });
  container.querySelectorAll('[data-del-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm("Supprimer cet article de l'inventaire, pour tous les postes ?")) return;
      itemsCol.doc(btn.dataset.delItem).delete().catch(err=>toast("Erreur : "+err.message));
    });
  });
  container.querySelectorAll('[data-edit-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = state.items.find(i=>i.id === btn.dataset.editItem);
      if(item) openEditItemModal(item);
    });
  });
  container.querySelectorAll('[data-toptex-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = state.items.find(i=>i.id === btn.dataset.toptexItem);
      if(item) toggleToptexRow(item);
    });
  });
  container.querySelectorAll('[data-valento-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = state.items.find(i=>i.id === btn.dataset.valentoItem);
      if(item) toggleValentoRow(item);
    });
  });
  container.querySelectorAll('[data-compare-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = state.items.find(i=>i.id === btn.dataset.compareItem);
      if(item) toggleCompareRow(item);
    });
  });
}

      </div>
      <div class="form-actions"><button class="primary" id="add-submit">Ajouter l'article</button></div>
    </div>
    <datalist id="categorie-list">${catOptions}</datalist>
    <datalist id="couleur-list">${[...new Set(state.items.map(it=>it.couleur).filter(Boolean))].sort().map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>

    <div class="toolbar">
      <input type="text" class="search-box" id="inv-search" placeholder="Filtrer par référence, couleur, taille…" value="${escapeHtml(searchQuery)}">
      <select id="inv-cat-filter"><option value="">Toutes catégories</option>${[...state.categories].sort().map(c=>`<option value="${escapeHtml(c)}" ${categoryFilter===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
    </div>
    <div id="inv-results"></div>
  `;

  document.getElementById('add-ref').addEventListener('input', e=>addDraft.reference=e.target.value);
  document.getElementById('add-taille').addEventListener('input', e=>addDraft.taille=e.target.value);
  document.getElementById('add-couleur').addEventListener('input', e=>addDraft.couleur=e.target.value);
  document.getElementById('add-categorie').addEventListener('input', e=>addDraft.categorie=e.target.value);
  document.getElementById('add-qte').addEventListener('input', e=>addDraft.qte=e.target.value);
  document.getElementById('add-prix').addEventListener('input', e=>addDraft.prix=e.target.value);
  document.getElementById('add-note').addEventListener('input', e=>addDraft.note=e.target.value);

  document.getElementById('add-submit').addEventListener('click', ()=>{
    const reference = document.getElementById('add-ref').value.trim();
    if(!reference){ toast("Indique une référence."); return; }
    const categorie = document.getElementById('add-categorie').value.trim();
    const payload = {
      reference,
      taille: document.getElementById('add-taille').value.trim() || null,
      couleur: document.getElementById('add-couleur').value.trim() || null,
      categorie: categorie || null,
      qte: Math.max(0, Number(document.getElementById('add-qte').value)||0),
      prix: document.getElementById('add-prix').value.trim()==='' ? null : Math.max(0, Number(document.getElementById('add-prix').value)||0),
      note: document.getElementById('add-note').value.trim() || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(categorie && !state.categories.includes(categorie)){
      state.categories.push(categorie);
      saveSettings();
    }
    itemsCol.add(payload).then(()=>{
      toast("Article ajouté.");
    }).catch(err=>toast("Erreur : "+err.message));
    addDraft = { reference:"", taille:"", couleur:"", categorie:"", qte:"", prix:"", note:"" };
    ['add-ref','add-taille','add-couleur','add-categorie','add-qte','add-prix','add-note'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.value='';
    });
  });

  document.getElementById('inv-search').addEventListener('input', e=>{ searchQuery = e.target.value; renderInvResults(); });
  document.getElementById('inv-cat-filter').addEventListener('change', e=>{ categoryFilter = e.target.value; renderInvResults(); });

  renderInvResults();
}

function renderInvResults(){
  const container = document.getElementById('inv-results');
  const filtered = filterItems(state.items, searchQuery, categoryFilter);
  container.innerHTML = itemsTableHTML(filtered, 'inv');
  attachTableHandlers(container, renderInvResults);
}
