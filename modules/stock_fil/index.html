<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock de Fil — Atelier CSB</title>
<style>
  :root{
    --paper: #FAF6EF;
    --paper-dim: #F1EADC;
    --ink: #2A2622;
    --ink-soft: #6B6155;
    --line: #E2D8C6;
    --thread: #B33A3A;
    --thread-dark: #8E2B2B;
    --spool-gold: #C08A2E;
    --vert: #3E7A52;
    --vert-bg: #E4EFE6;
    --orange: #C4791F;
    --orange-bg: #FBEAD3;
    --rouge: #B23A3A;
    --rouge-bg: #F8E1DE;
    --shadow: 0 1px 2px rgba(42,38,34,0.06), 0 4px 14px rgba(42,38,34,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  .app{max-width:1180px;margin:0 auto;padding:14px 24px 60px;}

  /* Header */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px; margin-bottom:14px; padding-bottom:10px;
    border-bottom: 2px solid var(--ink);
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute; left:0; bottom:-2px; width:64px; height:2px;
    background: var(--thread);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .spool{
    width:28px;height:28px;border-radius:50%;
    background: conic-gradient(var(--thread) 0deg 260deg, var(--thread-dark) 260deg 360deg);
    position:relative; flex:none;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px rgba(42,38,34,0.15);
  }
  .spool::after{
    content:""; position:absolute; inset:9px; border-radius:50%;
    background:var(--paper);
  }
  h1{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size:18px; margin:0; letter-spacing:0.2px; font-weight:600;
  }
  .subtitle{color:var(--ink-soft); font-size:12.5px; margin-top:2px; letter-spacing:0.3px;}
  header.top .subtitle{display:none;}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}

  button{
    font-family:inherit; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:7px 13px; border-radius:7px; transition: all .12s ease;
  }
  button:hover{border-color:var(--ink-soft); background:var(--paper-dim);}
  button.primary{background:var(--thread); border-color:var(--thread-dark); color:#fff;}
  button.primary:hover{background:var(--thread-dark);}
  button.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  button.ghost:hover{background:var(--paper-dim); color:var(--ink);}
  button.danger{color:var(--rouge); border-color:var(--rouge-bg);}
  button.danger:hover{background:var(--rouge-bg);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.small{padding:4px 9px; font-size:12px;}

  /* Nav tabs */
  nav.tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  nav.tabs button{
    border:none; background:none; border-radius:0; padding:9px 4px; margin-right:22px;
    font-size:14px; color:var(--ink-soft); position:relative; top:1px;
  }
  nav.tabs button:hover{background:none; color:var(--ink);}
  nav.tabs button.active{
    color:var(--ink); font-weight:600;
    border-bottom:2px solid var(--thread);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  /* Summary cards */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .card .num{font-size:24px; font-weight:700; font-family:Georgia,serif;}
  .card .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
  .card.rouge .num{color:var(--rouge);}
  .card.orange .num{color:var(--orange);}

  /* Toolbar */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-family:inherit; font-size:13px; padding:7px 10px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--spool-gold); outline-offset:1px;}
  .search-box{flex:1; min-width:180px; max-width:320px;}

  /* Tables */
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line);
    background:var(--paper-dim); cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:hover{color:var(--ink);}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background: #FCFAF6;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}

  .swatch{
    display:inline-block; width:12px; height:12px; border-radius:50%;
    margin-right:7px; vertical-align:middle; border:1px solid rgba(0,0,0,0.15);
  }
  .teinte-cell{display:flex; align-items:center;}

  .badge{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;
    letter-spacing:0.3px;
  }
  .badge.VERT{background:var(--vert-bg); color:var(--vert);}
  .badge.ORANGE{background:var(--orange-bg); color:var(--orange);}
  .badge.ROUGE{background:var(--rouge-bg); color:var(--rouge);}
  .badge.entree{background:var(--vert-bg); color:var(--vert);}
  .badge.sortie{background:var(--rouge-bg); color:var(--rouge);}
  .badge.fil-poly{background:#E7E2D6; color:#5C5445;}
  .badge.fil-lurex{background:#F0E3C0; color:#8A6A1E;}

  .empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}

  /* Form card */
  .form-card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .form-card h3{margin:0 0 14px; font-family:Georgia,serif; font-size:16px; font-weight:600;}
  .form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;}
  .field input, .field select, .field textarea{width:100%;}
  .type-toggle{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .type-toggle button{flex:1; border:none; border-radius:0; background:#fff;}
  .type-toggle button.on.entree{background:var(--vert-bg); color:var(--vert); font-weight:600;}
  .type-toggle button.on.sortie{background:var(--rouge-bg); color:var(--rouge); font-weight:600;}
  .form-actions{margin-top:14px; display:flex; gap:8px; justify-content:flex-end;}

  .section-title{font-family:Georgia,serif; font-size:15px; font-weight:600; margin:26px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .hint{color:var(--ink-soft); font-size:12px; margin:-4px 0 14px;}

  .params-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .param-block{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .param-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .param-row input{width:90px; text-align:right;}
  .zone-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .zone-chip{
    display:flex; align-items:center; gap:6px; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px; font-size:13px;
  }
  .zone-chip button{padding:2px 6px; font-size:11px; border:none; background:none; color:var(--ink-soft);}
  .zone-chip button:hover{color:var(--rouge); background:none;}
  .add-zone-row{display:flex; gap:8px; margin-top:12px;}
  .add-zone-row input{flex:1;}

  .override-table{width:100%; margin-top:10px;}
  .override-table th, .override-table td{padding:6px 8px; font-size:12.5px;}
  .override-table input{width:100%; padding:5px 7px;}

  footer.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.2); opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:repeat(2,1fr);}
    .params-grid{grid-template-columns:1fr;}
  }
</style>
</head>

  return out;
}

        const clean = pbClean(data);
        if(ref.id && !ref._isNew){
          await pb.collection(name).update(ref.id, clean);
        } else {
          const rec = await pb.collection(name).create(clean);
          ref.id = rec.id; ref._isNew = false;
        }
      };
      ref.update = async (data)=>{ await pb.collection(name).update(ref.id, pbClean(data)); };
      ref.delete = async ()=>{ await pb.collection(name).delete(ref.id); };
      return ref;
    },
    async add(data){
      const rec = await pb.collection(name).create(pbClean(data));
      return { id: rec.id, _collection: name };
    },
    where(field, op, value){
      return {
        async get(){
          const filter = (value === null || value === '')
            ? `${field} = ""`
            : `${field} = "${String(value).replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`;
          const list = await pb.collection(name).getFullList({ filter });
          return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })), empty: list.length === 0, size: list.length };
        }
      };
    },
    async get(){
      const list = await pb.collection(name).getFullList();
      return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })), empty: list.length === 0, size: list.length };
    },
    onSnapshot(onNext, onError){
      let cancelled = false;
      let unsub = null;
      const push = async ()=>{
        try{
          const list = await pb.collection(name).getFullList();
          if(!cancelled) onNext({ docs: list.map(r=>({ id: r.id, data: ()=>r })) });
        }catch(e){ if(!cancelled && onError) onError(e); }
      };
      push();
      pb.collection(name).subscribe('*', push).then(u=>{ if(cancelled) u(); else unsub = u; }).catch(e=>{ if(onError) onError(e); });
      return ()=>{ cancelled = true; if(unsub) unsub(); };
    },
  };
  return self;
}

function makeBatch(){
  const ops = [];
  return {
    set(ref, data){ ops.push({ type: ref._isNew ? 'create' : 'update', ref, data: pbClean(data) }); },
    update(ref, data){ ops.push({ type: 'update', ref, data: pbClean(data) }); },
    delete(ref){ ops.push({ type: 'delete', ref }); },
    async commit(){
      // Écritures individuelles, parallélisme réduit (SQLite derrière PocketBase supporte
      // mal beaucoup d'écritures simultanées), avec 3 tentatives en cas d'échec passager.
      const CONCURRENCY = 2;
      const MAX_ATTEMPTS = 3;
      let idx = 0;
      const errors = [];
      async function runOp(op){
        const col = pb.collection(op.ref._collection);
        if(op.type === 'create') await col.create(op.data);
        else if(op.type === 'update') await col.update(op.ref.id, op.data);
        else if(op.type === 'delete') await col.delete(op.ref.id);
      }
      async function worker(){
        while(idx < ops.length){
          const op = ops[idx++];
          const attempts = op.type === 'create' ? 1 : MAX_ATTEMPTS;
          let lastErr = null;
          for(let attempt=1; attempt<=attempts; attempt++){
            try{ await runOp(op); lastErr = null; break; }
            catch(e){
              lastErr = e;
              if(attempt < attempts) await new Promise(r=>setTimeout(r, 150*attempt));
            }
          }
          if(lastErr){
            console.error(`Échec définitif sur ${op.type} (${op.ref._collection}${op.ref.id?'/'+op.ref.id:''}) :`, lastErr);
            errors.push(lastErr);
          }
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ops.length || 1) }, worker));
      if(errors.length === ops.length && ops.length > 0) throw errors[0];
      return { total: ops.length, failed: errors.length, succeeded: ops.length - errors.length };
    },
  };
}

const db = { batch: makeBatch };

  async get(){
    if(!settingsRecordId){

      if(list.items.length) settingsRecordId = list.items[0].id;
    }
    if(settingsRecordId){

      return { exists: true, data: ()=>rec };

  async set(data){

    } else {
      const rec = await pb.collection('stock_fil_settings').create(clean);
      settingsRecordId = rec.id;
    }
  },
  onSnapshot(onNext, onError){
    let cancelled = false;
    let unsub = null;

async function ensureSeeded(){
  const snap = await settingsRef.get();
  if(snap.exists) return;
  await settingsRef.set({
    zones: [...DEFAULT_ZONES],
    thresholds: {...DEFAULT_THRESHOLDS},
    overrides: {},
    users: [],
    usersEnabled: false
  });
  const seed = loadSeedMovements();
  for(const chunk of chunkArray(seed, 400)){
    const batch = db.batch();
    chunk.forEach(m => {
      const ref = movementsCol.doc();
      batch.set(ref, { ...m, date: m.date || null });
    });
    await batch.commit();
  }
}

async function ensureLurexImported(){
  const snap = await settingsRef.get();
  const d = snap.data() || {};
  if(d.lurexImported) return;
  const seed = loadLurexSeedMovements();
  for(const chunk of chunkArray(seed, 400)){
    const batch = db.batch();
    chunk.forEach(m => {
      const ref = movementsCol.doc();
      batch.set(ref, {
        reference: m.reference, teinte: m.teinte, filType: "Lurex", type: "entree",
        quantite: m.quantite, zone: "", operateur: "", commentaire: m.commentaire || "Import initial Lurex",
        date: null, createdAt: firebase.firestore.FieldValue.serverTimestamp()

    });
    await batch.commit();

/* ---------- Derived data ---------- */

function filTypeOf(m){ return m.filType || DEFAULT_FIL_TYPE; }
function stockKey(filType, reference){ return filType + "||" + reference; }

function computeStock(){
  // (filType, reference) -> { filType, reference, teinte, zones:{zoneName:qty}, nonDefinie: qty, total }
  const map = {};
  const zoneSet = new Set(state.zones);
  for(const m of state.movements){
    const filType = filTypeOf(m);
    const key = stockKey(filType, m.reference);
    if(!map[key]) map[key] = { filType, reference: m.reference, teinte: m.teinte, zones:{}, nonDefinie:0, total:0 };
    if(m.teinte) map[key].teinte = m.teinte; // keep latest known teinte
    const delta = (m.type === "entree" ? 1 : -1) * (Number(m.quantite) || 0);
    const z = (m.zone || "").trim();
    if(z && zoneSet.has(z)){
      map[key].zones[z] = (map[key].zones[z] || 0) + delta;
    } else {
      map[key].nonDefinie += delta;
    }
    map[key].total += delta;
  }
  return Object.values(map);
}

function thresholdsFor(ref){
  const o = state.overrides[String(ref)];
  if(o) return { rouge: o.rouge ?? state.thresholds.rouge, orange: o.orange ?? state.thresholds.orange };
  return {...state.thresholds};
}

function etatFor(ref, total){
  const t = thresholdsFor(ref);
  if(total <= t.rouge) return "ROUGE";
  if(total <= t.orange) return "ORANGE";
  return "VERT";
}

/* ---------- Focus preservation across re-renders ---------- */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')){
    return null;
  }
  const info = { id: el.id };
  if(typeof el.selectionStart === 'number'){
    info.start = el.selectionStart;
    info.end = el.selectionEnd;
  }
  return info;
}
function restoreFocus(info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  el.focus();
  if(typeof info.start === 'number' && typeof el.setSelectionRange === 'function'){
    try{ el.setSelectionRange(info.start, info.end); }catch(e){ /* ignore inputs that don't support it */ }
  }
}
function rerenderPreservingFocus(fn){
  const info = captureFocus();
  fn();
  restoreFocus(info);
}

function stockTableHTML(rows, idPrefix, selectable){
  const zones = state.zones;
  const sorted = [...rows].sort((a,b)=>{
    let av, bv;
    if(stockSort.col === 'reference'){ av=a.reference; bv=b.reference; }
    else if(stockSort.col === 'teinte'){ av=a.teinte||''; bv=b.teinte||''; }
    else if(stockSort.col === 'filType'){ av=a.filType||''; bv=b.filType||''; }
    else if(stockSort.col === 'total'){ av=a.total; bv=b.total; }
    else if(stockSort.col === 'etat'){ av=etatFor(a.reference,a.total); bv=etatFor(b.reference,b.total); }
    else if(zones.includes(stockSort.col)){ av=a.zones[stockSort.col]||0; bv=b.zones[stockSort.col]||0; }
    else { av=a.total; bv=b.total; }
    if(av<bv) return -1*stockSort.dir; if(av>bv) return 1*stockSort.dir; return 0;
  });

  if(sorted.length === 0){
    return `<div class="empty">Aucune référence trouvée.</div>`;

  const zoneHeaders = zones.map(z=>`<th class="num" data-sort="${escapeHtml(z)}">${escapeHtml(z)}</th>`).join('');

    </tr>`;
  }).join('');

  return `
    <table id="${idPrefix}-table">

    </table>
  `;
}

    const input = document.getElementById('stock-search');
    input.value = '';
    input.focus();
    document.getElementById('clear-search').style.visibility = 'hidden';
    renderStockResults();
  });
  renderStockResults();
}

function renderStockResults(){
  const container = document.getElementById('stock-results');
  const stock = applyFilTypeFilter(computeStock(), stockFilTypeFilter);
  const filtered = searchQuery ? filterStock(stock, searchQuery) : stock;
  const refsOnScreen = filtered.map(r => stockKey(r.filType, r.reference));

  const transferBarHtml = selectedRefs.size > 0 ? `
    <div class="form-card" id="transfer-bar" style="margin-bottom:14px; display:flex; align-items:end; gap:12px; flex-wrap:wrap;">
      <div class="field">
        <label>${selectedRefs.size} référence(s) sélectionnée(s) — Zone source</label>
        <select id="transfer-from">
          <option value="">Zone non définie</option>
          ${state.zones.map(z=>`<option value="${escapeHtml(z)}">${escapeHtml(z)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Zone destination</label>
        <select id="transfer-to">
          ${state.zones.map(z=>`<option value="${escapeHtml(z)}">${escapeHtml(z)}</option>`).join('')}
        </select>
      </div>
      <button class="primary small" id="transfer-go">Basculer la zone</button>
      <button class="ghost small" id="transfer-cancel">Annuler la sélection</button>
    </div>
  ` : '';

  container.innerHTML = transferBarHtml + stockTableHTML(filtered, 'stock', true);
  attachSortHandlers(container, renderStockResults);

  container.querySelectorAll('.row-select').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const ref = e.target.dataset.ref;
      if(e.target.checked) selectedRefs.add(ref); else selectedRefs.delete(ref);
      renderStockResults();
    });
  });
  const selectAll = document.getElementById('stock-select-all');
  if(selectAll){
    selectAll.addEventListener('change', e=>{
      if(e.target.checked){ refsOnScreen.forEach(r=>selectedRefs.add(r)); }
      else { refsOnScreen.forEach(r=>selectedRefs.delete(r)); }
      renderStockResults();
    });
  }
  const cancelBtn = document.getElementById('transfer-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ selectedRefs.clear(); renderStockResults(); });

  const goBtn = document.getElementById('transfer-go');
  if(goBtn) goBtn.addEventListener('click', async ()=>{
    const from = document.getElementById('transfer-from').value;
    const to = document.getElementById('transfer-to').value;
    if(!to){ toast("Choisis une zone de destination."); return; }
    if(from === to){ toast("Les zones source et destination doivent être différentes."); return; }

    const byRef = {};
    stock.forEach(r => byRef[stockKey(r.filType, r.reference)] = r);
    const moves = [];
    selectedRefs.forEach(refKey=>{
      const r = byRef[refKey];
      if(!r) return;
      const qty = from === "" ? r.nonDefinie : (r.zones[from] || 0);
      if(qty > 0){ moves.push({ reference: r.reference, teinte: r.teinte, filType: r.filType, qty }); }
    });
    if(moves.length === 0){ toast("Aucune quantité à basculer dans la zone source choisie."); return; }

    goBtn.disabled = true;
    try{
      const today = todayStr();
      const comment = `Transfert de zone : ${from || 'Zone non définie'} → ${to}`;
      for(const chunk of chunkArray(moves, 150)){
        const batch = db.batch();
        chunk.forEach(m=>{
          batch.set(movementsCol.doc(), {
            reference: m.reference, teinte: m.teinte || null, filType: m.filType, type: 'sortie',
            quantite: m.qty, zone: from || "", operateur: "", commentaire: comment,
            date: today, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          batch.set(movementsCol.doc(), {
            reference: m.reference, teinte: m.teinte || null, filType: m.filType, type: 'entree',
            quantite: m.qty, zone: to, operateur: "", commentaire: comment,
            date: today, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit();
      }
      toast(`${moves.length} référence(s) basculée(s) vers ${to}.`);
      selectedRefs.clear();
      renderStockResults();
    }catch(err){
      toast("Erreur lors du transfert : " + err.message);
      goBtn.disabled = false;
    }
  });
}

function filterStock(stock, q){
  const ql = q.trim().toLowerCase();
  if(!ql) return stock;
  return stock.filter(r => String(r.reference).toLowerCase().includes(ql) || (r.teinte||'').toLowerCase().includes(ql));
}
function applyFilTypeFilter(stock, filterVal){
  if(!filterVal || filterVal === "Tous") return stock;
  return stock.filter(r => (r.filType||DEFAULT_FIL_TYPE) === filterVal);
}
function filTypeSelectHTML(id, value){
  return `<select id="${id}"><option value="Tous" ${value==='Tous'?'selected':''}>Tous les types de fil</option>${FIL_TYPES.map(t=>`<option value="${escapeHtml(t)}" ${value===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>`;
}

function movementCreatedMillis(m){
  if(m.createdAt && typeof m.createdAt.toMillis === 'function') return m.createdAt.toMillis();
  return 0;
}

function renderMouvementsHistory(){
  const container = document.getElementById('mv-history');
  if(!container) return;
  let rows = [...state.movements].sort((a,b)=>{
    const da = a.date || '';
    const db = b.date || '';
    if(da !== db) return da < db ? 1 : -1; // most recent date first
    return movementCreatedMillis(b) - movementCreatedMillis(a);
  });
  const ql = mvSearch.trim().toLowerCase();
  if(ql){
    rows = rows.filter(m => String(m.reference).toLowerCase().includes(ql) || (m.teinte||'').toLowerCase().includes(ql));
  }
  if(mvFilTypeFilter && mvFilTypeFilter !== "Tous"){
    rows = rows.filter(m => filTypeOf(m) === mvFilTypeFilter);
  }
  if(rows.length === 0){
    container.innerHTML = `<div class="empty">Aucun mouvement.</div>`;
    return;
  }
  const rowsHtml = rows.map(m=>{
    const ft = filTypeOf(m);
    return `
    <tr>
      <td>${m.date ? escapeHtml(m.date) : '—'}</td>
      <td><span class="badge ${ft==='Lurex'?'fil-lurex':'fil-poly'}">${escapeHtml(ft)}</span></td>
      <td>${escapeHtml(m.reference)}</td>
      <td><span class="teinte-cell"><span class="swatch" style="background:${colorFor(m.teinte)}"></span>${escapeHtml(m.teinte||'—')}</span></td>
      <td><span class="badge ${m.type}">${m.type==='entree'?'Entrée':'Sortie'}</span></td>
      <td class="num">${fmtNum(m.quantite)}</td>
      <td>${escapeHtml(m.zone||'—')}</td>
      <td>${escapeHtml(m.operateur||'—')}</td>
      <td>${escapeHtml(m.commentaire||'—')}</td>
      <td><button class="ghost small" data-del="${m.id}">Supprimer</button></td>
    </tr>
  `;}).join('');
  container.innerHTML = `
    <table>
      <thead><tr>
        <th>Date</th><th>Type de fil</th><th>Référence</th><th>Teinte</th><th>Type</th>
        <th class="num">Quantité</th><th>Zone</th><th>Opérateur</th><th>Commentaire</th><th></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm("Supprimer ce mouvement ? Cette action met à jour le stock immédiatement pour tous les postes.")) return;
      movementsCol.doc(btn.dataset.del).delete().catch(err=>toast("Erreur : " + err.message));
    });
  });
}

      toast("Données réinitialisées.");
    }catch(err){
      toast("Erreur : " + err.message);
    }
  });
}

/* ---------- Backup / restore ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.toISOString().slice(0,10);
  a.href = url; a.download = `stock-fil-csb-sauvegarde-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Sauvegarde exportée.");
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.movements || !Array.isArray(data.movements)) throw new Error("format invalide");
      if(!confirm("Importer ce fichier va remplacer toutes les données actuelles pour TOUS LES POSTES connectés. Continuer ?")) return;
      toast("Import en cours…");
      (async ()=>{
        const snap = await movementsCol.get();
        for(const arr of chunkArray(snap.docs, 400)){
          const batch = db.batch();
          arr.forEach(d=>batch.delete(d.ref));
          await batch.commit();
        }
        for(const arr of chunkArray(data.movements, 400)){
          const batch = db.batch();
          arr.forEach(m=>{
            const { id, ...rest } = m;
            batch.set(movementsCol.doc(), rest);
          });
          await batch.commit();
        }
        await settingsRef.set({
          zones: data.zones || [...DEFAULT_ZONES],
          thresholds: data.thresholds || {...DEFAULT_THRESHOLDS},
          overrides: data.overrides || {},
          users: data.users || [],
          usersEnabled: typeof data.usersEnabled === 'boolean' ? data.usersEnabled : false
        });
        clearSession();
        toast("Sauvegarde importée pour tous les postes.");
      })().catch(err => toast("Erreur d'import : " + err.message));
    }catch(err){
      alert("Ce fichier ne semble pas être une sauvegarde valide de cette application.");
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- Init ---------- */
startSync();
CSBAuth.onChange(() => { if(firstSettingsLoaded && firstMovementsLoaded) render(); });

</script>
