<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock de Fil — Atelier CSB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{
    --paper: #FAF6EF;
    --paper-dim: #F1EADC;
    --ink: #2A2622;
    --ink-soft: #6B6155;
    --line: #E2D8C6;
    --thread: #B33A3A;
    --thread-dark: #8E2B2B;
    --spool-gold: #C08A2E;
    --vert: #3E7A52;
    --vert-bg: #E4EFE6;
    --orange: #C4791F;
    --orange-bg: #FBEAD3;
    --rouge: #B23A3A;
    --rouge-bg: #F8E1DE;
    --shadow: 0 1px 2px rgba(42,38,34,0.06), 0 4px 14px rgba(42,38,34,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  .app{max-width:1180px;margin:0 auto;padding:14px 24px 60px;}

  /* Header */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px; margin-bottom:14px; padding-bottom:10px;
    border-bottom: 2px solid var(--ink);
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute; left:0; bottom:-2px; width:64px; height:2px;
    background: var(--thread);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .spool{
    width:28px;height:28px;border-radius:50%;
    background: conic-gradient(var(--thread) 0deg 260deg, var(--thread-dark) 260deg 360deg);
    position:relative; flex:none;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px rgba(42,38,34,0.15);
  }
  .spool::after{
    content:""; position:absolute; inset:9px; border-radius:50%;
    background:var(--paper);
  }
  h1{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size:18px; margin:0; letter-spacing:0.2px; font-weight:600;
  }
  .subtitle{color:var(--ink-soft); font-size:12.5px; margin-top:2px; letter-spacing:0.3px;}
  header.top .subtitle{display:none;}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}

  button{
    font-family:inherit; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:7px 13px; border-radius:7px; transition: all .12s ease;
  }
  button:hover{border-color:var(--ink-soft); background:var(--paper-dim);}
  button.primary{background:var(--thread); border-color:var(--thread-dark); color:#fff;}
  button.primary:hover{background:var(--thread-dark);}
  button.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  button.ghost:hover{background:var(--paper-dim); color:var(--ink);}
  button.danger{color:var(--rouge); border-color:var(--rouge-bg);}
  button.danger:hover{background:var(--rouge-bg);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.small{padding:4px 9px; font-size:12px;}

  /* Nav tabs */
  nav.tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  nav.tabs button{
    border:none; background:none; border-radius:0; padding:9px 4px; margin-right:22px;
    font-size:14px; color:var(--ink-soft); position:relative; top:1px;
  }
  nav.tabs button:hover{background:none; color:var(--ink);}
  nav.tabs button.active{
    color:var(--ink); font-weight:600;
    border-bottom:2px solid var(--thread);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  /* Summary cards */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .card .num{font-size:24px; font-weight:700; font-family:Georgia,serif;}
  .card .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;}
  .card.rouge .num{color:var(--rouge);}
  .card.orange .num{color:var(--orange);}

  /* Toolbar */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-family:inherit; font-size:13px; padding:7px 10px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--spool-gold); outline-offset:1px;}
  .search-box{flex:1; min-width:180px; max-width:320px;}

  /* Tables */
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line);
    background:var(--paper-dim); cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:hover{color:var(--ink);}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background: #FCFAF6;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}

  .swatch{
    display:inline-block; width:12px; height:12px; border-radius:50%;
    margin-right:7px; vertical-align:middle; border:1px solid rgba(0,0,0,0.15);
  }
  .teinte-cell{display:flex; align-items:center;}

  .badge{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;
    letter-spacing:0.3px;
  }
  .badge.VERT{background:var(--vert-bg); color:var(--vert);}
  .badge.ORANGE{background:var(--orange-bg); color:var(--orange);}
  .badge.ROUGE{background:var(--rouge-bg); color:var(--rouge);}
  .badge.entree{background:var(--vert-bg); color:var(--vert);}
  .badge.sortie{background:var(--rouge-bg); color:var(--rouge);}
  .badge.fil-poly{background:#E7E2D6; color:#5C5445;}
  .badge.fil-lurex{background:#F0E3C0; color:#8A6A1E;}

  .empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}

  /* Form card */
  .form-card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .form-card h3{margin:0 0 14px; font-family:Georgia,serif; font-size:16px; font-weight:600;}
  .form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;}
  .field input, .field select, .field textarea{width:100%;}
  .type-toggle{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .type-toggle button{flex:1; border:none; border-radius:0; background:#fff;}
  .type-toggle button.on.entree{background:var(--vert-bg); color:var(--vert); font-weight:600;}
  .type-toggle button.on.sortie{background:var(--rouge-bg); color:var(--rouge); font-weight:600;}
  .form-actions{margin-top:14px; display:flex; gap:8px; justify-content:flex-end;}

  .section-title{font-family:Georgia,serif; font-size:15px; font-weight:600; margin:26px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .hint{color:var(--ink-soft); font-size:12px; margin:-4px 0 14px;}

  .params-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .param-block{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .param-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .param-row input{width:90px; text-align:right;}
  .zone-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .zone-chip{
    display:flex; align-items:center; gap:6px; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px; font-size:13px;
  }
  .zone-chip button{padding:2px 6px; font-size:11px; border:none; background:none; color:var(--ink-soft);}
  .zone-chip button:hover{color:var(--rouge); background:none;}
  .add-zone-row{display:flex; gap:8px; margin-top:12px;}
  .add-zone-row input{flex:1;}

  .override-table{width:100%; margin-top:10px;}
  .override-table th, .override-table td{padding:6px 8px; font-size:12.5px;}
  .override-table input{width:100%; padding:5px 7px;}

  footer.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.2); opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:repeat(2,1fr);}
    .params-grid{grid-template-columns:1fr;}
  }
</style>
</head>

/* ---------- PocketBase (remplace Firebase/Firestore) ----------
   Cette couche imite juste assez l'API Firestore utilisée dans le reste du fichier
   (doc/collection/where/batch/onSnapshot) pour que tout le reste de l'app n'ait pas besoin
   d'être réécrit. Les 2 collections doivent exister dans PocketBase :
   stock_fil_settings (une seule fiche : zones, seuils, overrides, lurexImported),
   stock_fil_movements (un enregistrement par mouvement de stock). */
const POCKETBASE_URL = CSBAuth.getPbUrl();
const pb = new PocketBase(POCKETBASE_URL);
pb.autoCancellation(false);

// Anciennes créations utilisaient firebase.firestore.FieldValue.serverTimestamp() —
// on garde un shim pour ne pas avoir à toucher chaque endroit qui l'utilise.
window.firebase = { firestore: { FieldValue: { serverTimestamp: () => new Date().toISOString() } } };

function pbClean(data){
  const out = {};
  Object.keys(data||{}).forEach(k=>{
    if(data[k] !== undefined) out[k] = data[k] === null ? '' : data[k];
  });
  return out;
}

function makeCollectionRef(name){
  const self = {
    _name: name,
    doc(id){
      const docId = id || null;
      const ref = { id: docId, _collection: name, _isNew: !docId };
      ref.set = async (data)=>{
        const clean = pbClean(data);
        if(ref.id && !ref._isNew){
          await pb.collection(name).update(ref.id, clean);
        } else {
          const rec = await pb.collection(name).create(clean);
          ref.id = rec.id; ref._isNew = false;
        }
      };
      ref.update = async (data)=>{ await pb.collection(name).update(ref.id, pbClean(data)); };
      ref.delete = async ()=>{ await pb.collection(name).delete(ref.id); };
      return ref;
    },
    async add(data){
      const rec = await pb.collection(name).create(pbClean(data));
      return { id: rec.id, _collection: name };
    },
    where(field, op, value){
      return {
        async get(){
          const filter = (value === null || value === '')
            ? `${field} = ""`
            : `${field} = "${String(value).replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`;
          const list = await pb.collection(name).getFullList({ filter });
          return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })), empty: list.length === 0, size: list.length };
        }
      };
    },
    async get(){
      const list = await pb.collection(name).getFullList();
      return { docs: list.map(r=>({ id: r.id, ref: self.doc(r.id), data: ()=>r })), empty: list.length === 0, size: list.length };
    },
    onSnapshot(onNext, onError){
      let cancelled = false;
      let unsub = null;
      const push = async ()=>{
        try{
          const list = await pb.collection(name).getFullList();
          if(!cancelled) onNext({ docs: list.map(r=>({ id: r.id, data: ()=>r })) });
        }catch(e){ if(!cancelled && onError) onError(e); }
      };
      push();
      pb.collection(name).subscribe('*', push).then(u=>{ if(cancelled) u(); else unsub = u; }).catch(e=>{ if(onError) onError(e); });
      return ()=>{ cancelled = true; if(unsub) unsub(); };
    },
  };
  return self;
}

function makeBatch(){
  const ops = [];
  return {
    set(ref, data){ ops.push({ type: ref._isNew ? 'create' : 'update', ref, data: pbClean(data) }); },
    update(ref, data){ ops.push({ type: 'update', ref, data: pbClean(data) }); },
    delete(ref){ ops.push({ type: 'delete', ref }); },
    async commit(){
      // Écritures individuelles, parallélisme réduit (SQLite derrière PocketBase supporte
      // mal beaucoup d'écritures simultanées), avec 3 tentatives en cas d'échec passager.
      const CONCURRENCY = 2;
      const MAX_ATTEMPTS = 3;
      let idx = 0;
      const errors = [];
      async function runOp(op){
        const col = pb.collection(op.ref._collection);
        if(op.type === 'create') await col.create(op.data);
        else if(op.type === 'update') await col.update(op.ref.id, op.data);
        else if(op.type === 'delete') await col.delete(op.ref.id);
      }
      async function worker(){
        while(idx < ops.length){
          const op = ops[idx++];
          const attempts = op.type === 'create' ? 1 : MAX_ATTEMPTS;
          let lastErr = null;
          for(let attempt=1; attempt<=attempts; attempt++){
            try{ await runOp(op); lastErr = null; break; }
            catch(e){
              lastErr = e;
              if(attempt < attempts) await new Promise(r=>setTimeout(r, 150*attempt));
            }
          }
          if(lastErr){
            console.error(`Échec définitif sur ${op.type} (${op.ref._collection}${op.ref.id?'/'+op.ref.id:''}) :`, lastErr);
            errors.push(lastErr);
          }
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, ops.length || 1) }, worker));
      if(errors.length === ops.length && ops.length > 0) throw errors[0];
      return { total: ops.length, failed: errors.length, succeeded: ops.length - errors.length };
    },
  };
}

const db = { batch: makeBatch };

// stock_fil_settings : une seule fiche pour toute l'app (zones, seuils, overrides…).
// Comme PocketBase attribue lui-même les ID, on retrouve la fiche existante au lieu d'en
// imposer un — s'il n'y en a pas encore, .get() renvoie exists:false (comme Firestore),
// pour que le seed initial (ensureSeeded) ne se déclenche qu'une seule fois, au tout début.
let settingsRecordId = null;
const settingsRef = {
  async get(){
    if(!settingsRecordId){
      const list = await pb.collection('stock_fil_settings').getList(1, 1);
      if(list.items.length) settingsRecordId = list.items[0].id;
    }
    if(settingsRecordId){
      const rec = await pb.collection('stock_fil_settings').getOne(settingsRecordId);
      return { exists: true, data: ()=>rec };
    }
    return { exists: false, data: ()=>({}) };
  },
  async set(data){
    const clean = pbClean(data);
    if(!settingsRecordId){
      const list = await pb.collection('stock_fil_settings').getList(1, 1);
      if(list.items.length) settingsRecordId = list.items[0].id;
    }
    if(settingsRecordId){
      await pb.collection('stock_fil_settings').update(settingsRecordId, clean);
    } else {
      const rec = await pb.collection('stock_fil_settings').create(clean);
      settingsRecordId = rec.id;
    }
  },
  onSnapshot(onNext, onError){
    let cancelled = false;
    let unsub = null;
    const push = async ()=>{
      try{
        if(!settingsRecordId){
          const list = await pb.collection('stock_fil_settings').getList(1, 1);
          if(list.items.length) settingsRecordId = list.items[0].id;
        }
        if(settingsRecordId){
          const rec = await pb.collection('stock_fil_settings').getOne(settingsRecordId);
          if(!cancelled) onNext({ data: ()=>rec });
        } else if(!cancelled){
          onNext({ data: ()=>({}) });
        }
      }catch(e){ if(!cancelled && onError) onError(e); }
    };
    push();
    pb.collection('stock_fil_settings').subscribe('*', push).then(u=>{ if(cancelled) u(); else unsub = u; }).catch(e=>{ if(onError) onError(e); });
    return ()=>{ cancelled = true; if(unsub) unsub(); };
  },
};

async function ensureSeeded(){
  const snap = await settingsRef.get();
  if(snap.exists) return;
  await settingsRef.set({
    zones: [...DEFAULT_ZONES],
    thresholds: {...DEFAULT_THRESHOLDS},
    overrides: {},
    users: [],
    usersEnabled: false
  });
  const seed = loadSeedMovements();
  for(const chunk of chunkArray(seed, 400)){
    const batch = db.batch();
    chunk.forEach(m => {
      const ref = movementsCol.doc();
      batch.set(ref, { ...m, date: m.date || null });
    });
    await batch.commit();
  }
}

async function ensureLurexImported(){
  const snap = await settingsRef.get();
  const d = snap.data() || {};
  if(d.lurexImported) return;
  const seed = loadLurexSeedMovements();
  for(const chunk of chunkArray(seed, 400)){
    const batch = db.batch();
    chunk.forEach(m => {
      const ref = movementsCol.doc();
      batch.set(ref, {
        reference: m.reference, teinte: m.teinte, filType: "Lurex", type: "entree",
        quantite: m.quantite, zone: "", operateur: "", commentaire: m.commentaire || "Import initial Lurex",
        date: null, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
  }
  await settingsRef.set({ lurexImported: true }, { merge: true });
}

  if(firstSettingsLoaded && firstMovementsLoaded){ render(); }

}

  renderLoading();

  settingsRef.onSnapshot(doc => {

/* ---------- Derived data ---------- */

function filTypeOf(m){ return m.filType || DEFAULT_FIL_TYPE; }
function stockKey(filType, reference){ return filType + "||" + reference; }

function computeStock(){
  // (filType, reference) -> { filType, reference, teinte, zones:{zoneName:qty}, nonDefinie: qty, total }
  const map = {};
  const zoneSet = new Set(state.zones);
  for(const m of state.movements){
    const filType = filTypeOf(m);
    const key = stockKey(filType, m.reference);
    if(!map[key]) map[key] = { filType, reference: m.reference, teinte: m.teinte, zones:{}, nonDefinie:0, total:0 };
    if(m.teinte) map[key].teinte = m.teinte; // keep latest known teinte
    const delta = (m.type === "entree" ? 1 : -1) * (Number(m.quantite) || 0);
    const z = (m.zone || "").trim();
    if(z && zoneSet.has(z)){
      map[key].zones[z] = (map[key].zones[z] || 0) + delta;
    } else {
      map[key].nonDefinie += delta;
    }
    map[key].total += delta;
  }
  return Object.values(map);
}

function thresholdsFor(ref){
  const o = state.overrides[String(ref)];
  if(o) return { rouge: o.rouge ?? state.thresholds.rouge, orange: o.orange ?? state.thresholds.orange };
  return {...state.thresholds};
}

function etatFor(ref, total){
  const t = thresholdsFor(ref);
  if(total <= t.rouge) return "ROUGE";
  if(total <= t.orange) return "ORANGE";
  return "VERT";
}

/* ---------- Focus preservation across re-renders ---------- */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')){
    return null;
  }
  const info = { id: el.id };
  if(typeof el.selectionStart === 'number'){
    info.start = el.selectionStart;
    info.end = el.selectionEnd;
  }
  return info;
}
function restoreFocus(info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  el.focus();
  if(typeof info.start === 'number' && typeof el.setSelectionRange === 'function'){
    try{ el.setSelectionRange(info.start, info.end); }catch(e){ /* ignore inputs that don't support it */ }
  }
}
function rerenderPreservingFocus(fn){
  const info = captureFocus();
  fn();
  restoreFocus(info);
}

function stockTableHTML(rows, idPrefix, selectable){
  const zones = state.zones;
  const sorted = [...rows].sort((a,b)=>{
    let av, bv;
    if(stockSort.col === 'reference'){ av=a.reference; bv=b.reference; }
    else if(stockSort.col === 'teinte'){ av=a.teinte||''; bv=b.teinte||''; }
    else if(stockSort.col === 'filType'){ av=a.filType||''; bv=b.filType||''; }
    else if(stockSort.col === 'total'){ av=a.total; bv=b.total; }
    else if(stockSort.col === 'etat'){ av=etatFor(a.reference,a.total); bv=etatFor(b.reference,b.total); }
    else if(zones.includes(stockSort.col)){ av=a.zones[stockSort.col]||0; bv=b.zones[stockSort.col]||0; }
    else { av=a.total; bv=b.total; }
    if(av<bv) return -1*stockSort.dir; if(av>bv) return 1*stockSort.dir; return 0;
  });

  if(sorted.length === 0){
    return `<div class="empty">Aucune référence trouvée.</div>`;
  }

  const zoneHeaders = zones.map(z=>`<th class="num" data-sort="${escapeHtml(z)}">${escapeHtml(z)}</th>`).join('');
  const selectAllChecked = selectable && sorted.length > 0 && sorted.every(r => selectedRefs.has(stockKey(r.filType, r.reference)));
  const rowsHtml = sorted.map(r=>{
    const etat = etatFor(r.reference, r.total);
    const zoneCells = zones.map(z=>`<td class="num">${fmtNum(r.zones[z]||0)}</td>`).join('');
    const refKey = stockKey(r.filType, r.reference);
    const checkCell = selectable ? `<td><input type="checkbox" class="row-select" data-ref="${escapeHtml(refKey)}" ${selectedRefs.has(refKey)?'checked':''}></td>` : '';
    return `<tr>
      ${checkCell}
      <td><span class="badge fil-${r.filType==='Lurex'?'lurex':'poly'}">${escapeHtml(r.filType)}</span></td>
      <td>${escapeHtml(r.reference)}</td>
      <td><span class="teinte-cell"><span class="swatch" style="background:${colorFor(r.teinte)}"></span>${escapeHtml(r.teinte||'—')}</span></td>
      ${zoneCells}
      <td class="num">${fmtNum(r.nonDefinie)}</td>
      <td class="num"><strong>${fmtNum(r.total)}</strong></td>
      <td><span class="badge ${etat}">${etat}</span></td>
    </tr>`;
  }).join('');

  return `
    <table id="${idPrefix}-table">
      <thead><tr>
        ${selectable ? `<th style="width:28px;"><input type="checkbox" id="${idPrefix}-select-all" ${selectAllChecked?'checked':''}></th>` : ''}
        <th data-sort="filType">Type de fil</th>
        <th data-sort="reference">Référence</th>
        <th data-sort="teinte">Teinte</th>
        ${zoneHeaders}
        <th class="num">Zone non définie</th>
        <th class="num" data-sort="total">Total</th>
        <th data-sort="etat">État</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
}

function attachSortHandlers(panel, onSort){
  panel.querySelectorAll('thead th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.sort;
      if(stockSort.col === col) stockSort.dir *= -1; else { stockSort.col = col; stockSort.dir = 1; }
      onSort();
    });
  });
}

// Génère un PDF listant tout le stock, trié par numéro dans chaque zone — les caisses
// d'abord, puis les étagères (détecté par le nom de la zone), puis les éventuelles autres
// zones et enfin les bobines sans zone définie.
async function generateStockPdfReport(){
  const stock = applyFilTypeFilter(computeStock(), stockFilTypeFilter);
  const zoneRank = z => {
    const s = z.toLowerCase();
    if(s.includes('caisse')) return 0;
    if(s.includes('etag') || s.includes('étag')) return 1;
    return 2;
  };
  const orderedZones = [...state.zones].sort((a,b) => zoneRank(a) - zoneRank(b));

  const sections = [];
  orderedZones.forEach(zone => {
    const rows = stock
      .filter(r => (r.zones[zone] || 0) > 0)
      .map(r => ({ reference: r.reference, teinte: r.teinte || '', qty: r.zones[zone] }))
      .sort((a, b) => Number(a.reference) - Number(b.reference));
    if(rows.length) sections.push({ label: zone, rows });
  });
  const nonDefRows = stock
    .filter(r => (r.nonDefinie || 0) > 0)
    .map(r => ({ reference: r.reference, teinte: r.teinte || '', qty: r.nonDefinie }))
    .sort((a, b) => Number(a.reference) - Number(b.reference));
  if(nonDefRows.length) sections.push({ label: 'Zone non définie', rows: nonDefRows });

  if(!sections.length){ toast("Rien à exporter : le stock est vide."); return; }

  const pdfDoc = await PDFLib.PDFDocument.create();
  const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const pageW = 595.28, pageH = 841.89;
  const left = 40, right = pageW - 40, top = pageH - 50, bottom = 50, rowH = 16;
  const colX = [left, left + 90, left + 320];

  let page, y;
  function newPage(){
    page = pdfDoc.addPage([pageW, pageH]);
    y = top;
    page.drawText('État du stock de fil', { x: left, y, size: 16, font: fontBold });
    y -= 20;
    page.drawText(new Date().toLocaleDateString('fr-FR'), { x: left, y, size: 9, font, color: PDFLib.rgb(0.4, 0.4, 0.4) });
    y -= 26;
  }
  function drawTableHeader(){
    page.drawRectangle({ x: left, y: y - 4, width: right - left, height: rowH, color: PDFLib.rgb(0.9, 0.9, 0.9) });
    page.drawText('N°', { x: colX[0] + 4, y, size: 9, font: fontBold });
    page.drawText('Couleur', { x: colX[1] + 4, y, size: 9, font: fontBold });
    page.drawText('Quantité', { x: colX[2] + 4, y, size: 9, font: fontBold });
    y -= rowH;
  }

  newPage();
  sections.forEach(section => {
    if(y < bottom + rowH * 4) newPage();
    y -= 6;
    page.drawText(section.label, { x: left, y, size: 12, font: fontBold });
    y -= 18;
    drawTableHeader();
    section.rows.forEach(r => {
      if(y < bottom + rowH){
        newPage();
        page.drawText(section.label + ' (suite)', { x: left, y, size: 12, font: fontBold });
        y -= 18;
        drawTableHeader();
      }
      page.drawText(String(r.reference), { x: colX[0] + 4, y, size: 9, font });
      page.drawText(String(r.teinte), { x: colX[1] + 4, y, size: 9, font });
      page.drawText(String(r.qty), { x: colX[2] + 4, y, size: 9, font });
      y -= rowH;
    });
    y -= 10;
  });

  const bytes = await pdfDoc.save();
  const blob = new Blob([bytes], { type: 'application/pdf' });
  window.open(URL.createObjectURL(blob), '_blank');
}

  const selectAll = document.getElementById('stock-select-all');

      if(e.target.checked){ refsOnScreen.forEach(r=>selectedRefs.add(r)); }

  const goBtn = document.getElementById('transfer-go');
  if(goBtn) goBtn.addEventListener('click', async ()=>{
    const from = document.getElementById('transfer-from').value;
    const to = document.getElementById('transfer-to').value;
    if(!to){ toast("Choisis une zone de destination."); return; }
    if(from === to){ toast("Les zones source et destination doivent être différentes."); return; }

    const byRef = {};
    stock.forEach(r => byRef[stockKey(r.filType, r.reference)] = r);
    const moves = [];
    selectedRefs.forEach(refKey=>{
      const r = byRef[refKey];
      if(!r) return;
      const qty = from === "" ? r.nonDefinie : (r.zones[from] || 0);
      if(qty > 0){ moves.push({ reference: r.reference, teinte: r.teinte, filType: r.filType, qty }); }
    });
    if(moves.length === 0){ toast("Aucune quantité à basculer dans la zone source choisie."); return; }

    goBtn.disabled = true;
    try{
      const today = todayStr();
      const comment = `Transfert de zone : ${from || 'Zone non définie'} → ${to}`;
      for(const chunk of chunkArray(moves, 150)){
        const batch = db.batch();
        chunk.forEach(m=>{
          batch.set(movementsCol.doc(), {
            reference: m.reference, teinte: m.teinte || null, filType: m.filType, type: 'sortie',
            quantite: m.qty, zone: from || "", operateur: "", commentaire: comment,
            date: today, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          batch.set(movementsCol.doc(), {
            reference: m.reference, teinte: m.teinte || null, filType: m.filType, type: 'entree',
            quantite: m.qty, zone: to, operateur: "", commentaire: comment,
            date: today, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit();
      }
      toast(`${moves.length} référence(s) basculée(s) vers ${to}.`);
      selectedRefs.clear();
      renderStockResults();
    }catch(err){
      toast("Erreur lors du transfert : " + err.message);
      goBtn.disabled = false;
    }
  });
}

function filterStock(stock, q){
  const ql = q.trim().toLowerCase();
  if(!ql) return stock;
  return stock.filter(r => String(r.reference).toLowerCase().includes(ql) || (r.teinte||'').toLowerCase().includes(ql));
}
function applyFilTypeFilter(stock, filterVal){
  if(!filterVal || filterVal === "Tous") return stock;
  return stock.filter(r => (r.filType||DEFAULT_FIL_TYPE) === filterVal);
}
function filTypeSelectHTML(id, value){
  return `<select id="${id}"><option value="Tous" ${value==='Tous'?'selected':''}>Tous les types de fil</option>${FIL_TYPES.map(t=>`<option value="${escapeHtml(t)}" ${value===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>`;
}

// ---------- Onglet Trouver couleur : dépose une image, chaque couleur dominante est numérotée
// et associée au numéro Madeira le plus proche (regroupement par distance colorimétrique,
// entièrement local, aucune donnée envoyée nulle part). ----------
function tcHexToRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function tcRgbDist2(a,b){ const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return dr*dr+dg*dg+db*db; }
function tcToHex(rgb){ return '#'+rgb.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function tcNearestMadeira(rgb){
  let best=null, bestD=Infinity;
  for(const [num,hex] of MADEIRA_COLORS){
    const d = tcRgbDist2(rgb, tcHexToRgb(hex));
    if(d<bestD){ bestD=d; best=[num,hex]; }
  }
  return best;
}
function tcNearestName(rgb){
  let best=null, bestD=Infinity;
  for(const [name,hex] of NAMED_COLORS){
    const d = tcRgbDist2(rgb, tcHexToRgb(hex));
    if(d<bestD){ bestD=d; best=name; }
  }
  return best;
}
function tcKmeans(pixels, positions, k, iters){
  let centers = [];
  const used = new Set();
  while(centers.length < k && centers.length < pixels.length){
    const idx = Math.floor(Math.random()*pixels.length);
    if(used.has(idx)) continue;
    used.add(idx);
    centers.push(pixels[idx].slice());
  }
  let assign = new Array(pixels.length).fill(0);
  for(let it=0; it<iters; it++){
    for(let i=0;i<pixels.length;i++){
      let best=0, bestD=Infinity;
      for(let c=0;c<centers.length;c++){
        const d = tcRgbDist2(pixels[i], centers[c]);
        if(d<bestD){ bestD=d; best=c; }
      }
      assign[i]=best;
    }
    const sums = centers.map(()=>[0,0,0,0]);
    for(let i=0;i<pixels.length;i++){
      const c=assign[i];
      sums[c][0]+=pixels[i][0]; sums[c][1]+=pixels[i][1]; sums[c][2]+=pixels[i][2]; sums[c][3]++;
    }
    for(let c=0;c<centers.length;c++){
      if(sums[c][3]>0) centers[c]=[sums[c][0]/sums[c][3], sums[c][1]/sums[c][3], sums[c][2]/sums[c][3]];
    }
  }
  const counts = new Array(centers.length).fill(0);
  for(const a of assign) counts[a]++;
  // Position du pixel réel le plus proche du centre de chaque groupe — jamais une moyenne, qui
  // peut retomber dans une zone vide ou d'une AUTRE couleur quand celle-ci apparaît en
  // plusieurs endroits disjoints de l'image.
  const bestDist = new Array(centers.length).fill(Infinity);
  const bestPos = centers.map(()=>[0.5,0.5]);
  for(let i=0;i<pixels.length;i++){
    const c = assign[i];
    const d = tcRgbDist2(pixels[i], centers[c]);
    if(d < bestDist[c]){ bestDist[c] = d; bestPos[c] = positions[i]; }
  }
  return centers.map((c,i)=>({ rgb:c, count:counts[i], pos: bestPos[i] }))
    .filter(c=>c.count>0).sort((a,b)=>b.count-a.count);
}
function tcExtractPixels(img){
  const canvas = document.createElement('canvas');
  const size = 150;
  const ratio = Math.min(size/img.naturalWidth, size/img.naturalHeight, 1);
  canvas.width = Math.max(1, Math.round(img.naturalWidth*ratio));
  canvas.height = Math.max(1, Math.round(img.naturalHeight*ratio));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const pixels = [];
  const positions = [];
  for(let i=0;i<data.length;i+=4){
    if(data[i+3] < 200) continue;
    pixels.push([data[i], data[i+1], data[i+2]]);
    const p = i/4;
    positions.push([(p % canvas.width) / canvas.width, Math.floor(p / canvas.width) / canvas.height]);
  }
  return { pixels, positions };
}
// Écarte les numéros trop proches les uns des autres (fréquent quand plusieurs couleurs se
// superposent au même endroit de l'image, ex. formes translucides) : petite simulation de
// répulsion, en tenant compte du ratio hauteur/largeur réel de l'image.
function tcSeparateBadges(clusters, aspect, minDist, iterations){
  // On part de la vraie position de chaque couleur (l'ancre) et on ne fait que la
  // repousser localement en cas de conflit, avec un léger rappel vers l'ancre à chaque
  // itération : sans ce rappel, la répulsion pure peut faire dériver un numéro loin de
  // sa couleur réelle (voire l'entasser avec un autre au hasard, ou le sortir de la
  // zone visible s'il ne trouve pas d'autre place).
  const anchors = clusters.map(c => [c.pos[0], c.pos[1]*aspect]);
  const pts = anchors.map(p => p.slice());
  const pullBack = 0.08;
  for(let iter=0; iter<iterations; iter++){
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx = pts[j][0]-pts[i][0], dy = pts[j][1]-pts[i][1];
        let dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < minDist){
          if(dist < 1e-6){ dist = 1e-6; const a = Math.random()*Math.PI*2; pts[j][0]+=Math.cos(a)*1e-4; pts[j][1]+=Math.sin(a)*1e-4; }
          const push = (minDist - dist) / 2;
          const ux = dx/dist, uy = dy/dist;
          pts[i][0] -= ux*push; pts[i][1] -= uy*push;
          pts[j][0] += ux*push; pts[j][1] += uy*push;
        }
      }
    }
    for(let i=0;i<pts.length;i++){
      pts[i][0] += (anchors[i][0]-pts[i][0]) * pullBack;
      pts[i][1] += (anchors[i][1]-pts[i][1]) * pullBack;
    }
  }
  return pts.map(p => [Math.min(0.97,Math.max(0.03,p[0])), Math.min(0.97,Math.max(0.03,p[1]/aspect))]);
}

  pipetteHint.style.display = tcPipetteActive ? 'inline' : 'none';
  pipetteBtn.addEventListener('click', () => {
    tcPipetteActive = !tcPipetteActive;
    pipetteBtn.classList.toggle('primary', tcPipetteActive);
    pipetteHint.style.display = tcPipetteActive ? 'inline' : 'none';
    document.getElementById('tc-preview').style.cursor = tcPipetteActive ? 'crosshair' : '';
  });
  document.getElementById('tc-preview').addEventListener('click', e => {
    if(!tcPipetteActive || !tcImg) return;
    e.stopPropagation();
    const rect = e.target.getBoundingClientRect();
    const fx = (e.clientX - rect.left) / rect.width;
    const fy = (e.clientY - rect.top) / rect.height;
    const px = Math.min(tcImg.naturalWidth - 1, Math.max(0, Math.floor(fx * tcImg.naturalWidth)));
    const py = Math.min(tcImg.naturalHeight - 1, Math.max(0, Math.floor(fy * tcImg.naturalHeight)));
    const data = tcFullResCanvas().getContext('2d').getImageData(px, py, 1, 1).data;
    const rgb = [data[0], data[1], data[2]];
    const hex = tcToHex(rgb);
    const [madNum, madHex] = tcNearestMadeira(rgb);
    const name = tcNearestName(rgb);
    const resultEl = document.getElementById('tc-pipette-result');
    resultEl.style.display = 'flex';
    resultEl.innerHTML = `
      <div style="width:36px; height:36px; border-radius:6px; border:1px solid var(--line,#ddd); flex-shrink:0; background:${hex};"></div>
      <div style="flex:1; font-size:.83rem; font-weight:600;">${escapeHtml(name)}<div style="font-size:.7rem; color:var(--muted,#888); font-weight:400;">${hex.toUpperCase()}</div></div>
      <div style="width:36px; height:36px; border-radius:6px; border:1px solid var(--line,#ddd); flex-shrink:0; background:${madHex};"></div>
      <div style="font-size:.8rem; font-weight:700; padding:4px 10px; border-radius:20px; background:var(--bg,#f5f5f5); border:1px solid var(--line,#ddd); white-space:nowrap;">Madeira ${madNum}</div>
    `;
    tcPipetteActive = false;
    pipetteBtn.classList.remove('primary');
    pipetteHint.style.display = 'none';
    e.target.style.cursor = '';
  });

  tcScrollEl = document.getElementById('tc-preview-scroll');
  tcScrollEl.addEventListener('wheel', e => {
    if(!tcImg) return;
    e.preventDefault();
    tcSetZoom(tcZoom + (e.deltaY < 0 ? 20 : -20));
  }, { passive:false });
  tcScrollEl.addEventListener('mousedown', e => {
    if(!tcImg) return;
    tcPanning = true;
    tcPanStartX = e.clientX; tcPanStartY = e.clientY;
    tcPanScrollX = tcScrollEl.scrollLeft; tcPanScrollY = tcScrollEl.scrollTop;
    tcScrollEl.style.cursor = 'grabbing';
  });
  // Écouteurs posés sur window (pas sur tc-preview-scroll) pour continuer le glisser même si la
  // souris sort du cadre — attachés une seule fois (le panneau est reconstruit à chaque visite
  // de l'onglet : ils lisent tcScrollEl, mis à jour à chaque rendu, plutôt que de capturer une
  // référence figée à l'ancien élément).
  if(!tcWindowListenersWired){
    tcWindowListenersWired = true;
    window.addEventListener('mousemove', e => {
      if(!tcPanning || !tcScrollEl) return;
      tcScrollEl.scrollLeft = tcPanScrollX - (e.clientX - tcPanStartX);
      tcScrollEl.scrollTop = tcPanScrollY - (e.clientY - tcPanStartY);
    });
    window.addEventListener('mouseup', () => { tcPanning = false; if(tcScrollEl) tcScrollEl.style.cursor = 'grab'; });
  }

  if(tcImg) runAnalysis();
}

function renderMouvementsPanel(){
  const panel = document.getElementById('panel-mouvements');
  const zoneOptions = state.zones.map(z=>`<option value="${escapeHtml(z)}">${escapeHtml(z)}</option>`).join('');
  const currentFilType = mvDraft.filType || DEFAULT_FIL_TYPE;
  const stock = computeStock().filter(r => (r.filType||DEFAULT_FIL_TYPE) === currentFilType);
  const refToTeinte = {};
  const teinteSet = new Set();
  stock.forEach(r=>{
    if(r.teinte) { refToTeinte[String(r.reference)] = r.teinte; teinteSet.add(r.teinte); }
  });
  const refOptions = stock.map(r=>`<option value="${escapeHtml(r.reference)}">${escapeHtml(r.teinte||'')}</option>`).join('');
  const teinteOptions = [...teinteSet].sort().map(t=>`<option value="${escapeHtml(t)}"></option>`).join('');
  const filTypeOptions = FIL_TYPES.map(t=>`<option value="${escapeHtml(t)}" ${currentFilType===t?'selected':''}>${escapeHtml(t)}</option>`).join('');

  panel.innerHTML = `
    <div class="form-card">
      <h3>Ajouter un mouvement</h3>
      <div class="hint">Une ligne = une entrée OU une sortie.</div>
      <div class="form-grid">
        <div class="field">
          <label>Type</label>
          <div class="type-toggle">
            <button type="button" id="tt-entree" class="${addMode==='entree'?'on entree':''}">Entrée</button>
            <button type="button" id="tt-sortie" class="${addMode==='sortie'?'on sortie':''}">Sortie</button>
          </div>
        </div>
        <div class="field"><label>Type de fil</label><select id="mv-filtype">${filTypeOptions}</select></div>
        <div class="field"><label>Date</label><input type="date" id="mv-date" value="${escapeHtml(mvDraft.date)}"></div>
        <div class="field"><label>Référence</label><input type="text" id="mv-ref" placeholder="ex. 1924" value="${escapeHtml(mvDraft.ref)}" list="mv-ref-list" autocomplete="off"></div>
        <div class="field"><label>Teinte</label><input type="text" id="mv-teinte" placeholder="ex. JAUNE" value="${escapeHtml(mvDraft.teinte)}" list="mv-teinte-list" autocomplete="off"></div>
        <div class="field"><label>Quantité (bobines)</label><input type="number" id="mv-qty" min="0" step="1" value="${escapeHtml(mvDraft.qty)}"></div>
        <div class="field"><label>Zone (facultatif)</label><select id="mv-zone"><option value="">—</option>${zoneOptions}</select></div>
        <div class="field"><label>Opérateur</label><input type="text" id="mv-op" placeholder="Optionnel" value="${escapeHtml(mvDraft.op)}"></div>
        <div class="field full"><label>Commentaire</label><input type="text" id="mv-comment" placeholder="Optionnel" value="${escapeHtml(mvDraft.comment)}"></div>
      </div>
      <div class="form-actions">
        <button class="primary" id="mv-submit">Ajouter le mouvement</button>
      </div>
    </div>
    <datalist id="mv-ref-list">${refOptions}</datalist>
    <datalist id="mv-teinte-list">${teinteOptions}</datalist>

    <div class="toolbar">
      <input type="text" class="search-box" id="mv-search" placeholder="Filtrer l'historique par référence ou teinte…" value="${escapeHtml(mvSearch)}">
      ${filTypeSelectHTML('mv-filtype-filter', mvFilTypeFilter)}
    </div>
    <div id="mv-history"></div>
  `;

  document.getElementById('tt-entree').addEventListener('click', ()=>{ addMode='entree'; renderMouvementsPanel(); });
  document.getElementById('tt-sortie').addEventListener('click', ()=>{ addMode='sortie'; renderMouvementsPanel(); });
  document.getElementById('mv-filtype').addEventListener('change', e=>{ mvDraft.filType = e.target.value; renderMouvementsPanel(); });
  document.getElementById('mv-filtype-filter').addEventListener('change', e=>{ mvFilTypeFilter = e.target.value; renderMouvementsHistory(); });

  document.getElementById('mv-date').addEventListener('input', e=>{ mvDraft.date = e.target.value; });
  document.getElementById('mv-ref').addEventListener('input', e=>{
    mvDraft.ref = e.target.value;
    const known = refToTeinte[e.target.value.trim()];
    const teinteField = document.getElementById('mv-teinte');
    if(known && !teinteField.value.trim()){
      teinteField.value = known;
      mvDraft.teinte = known;
    }
  });
  document.getElementById('mv-teinte').addEventListener('input', e=>{ mvDraft.teinte = e.target.value; });
  document.getElementById('mv-qty').addEventListener('input', e=>{ mvDraft.qty = e.target.value; });
  document.getElementById('mv-zone').value = mvDraft.zone;
  document.getElementById('mv-zone').addEventListener('input', e=>{ mvDraft.zone = e.target.value; });
  document.getElementById('mv-op').addEventListener('input', e=>{ mvDraft.op = e.target.value; });
  document.getElementById('mv-comment').addEventListener('input', e=>{ mvDraft.comment = e.target.value; });

  document.getElementById('mv-submit').addEventListener('click', ()=>{
    const ref = document.getElementById('mv-ref').value.trim();
    const teinte = document.getElementById('mv-teinte').value.trim();
    const qty = Number(document.getElementById('mv-qty').value);
    const zone = document.getElementById('mv-zone').value;
    const date = document.getElementById('mv-date').value;
    const op = document.getElementById('mv-op').value.trim();
    const comment = document.getElementById('mv-comment').value.trim();
    const filType = document.getElementById('mv-filtype').value;

    if(!ref){ toast("Indique une référence."); return; }
    if(!qty || qty <= 0){ toast("Indique une quantité valide."); return; }

    movementsCol.add({
      reference: isFinite(ref) && ref.trim()!=='' ? Number(ref) : ref,
      teinte: teinte || null, filType, type: addMode, quantite: qty, zone: zone || "",
      operateur: op, commentaire: comment, date: date || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
      toast(addMode === 'entree' ? "Entrée enregistrée." : "Sortie enregistrée.");
    }).catch(err=>{
      toast("Erreur d'enregistrement : " + err.message);
    });
    mvDraft = { ref:"", teinte:"", qty:"", zone: zone, date: todayStr(), op:"", comment:"", filType };
    document.getElementById('mv-ref').value='';
    document.getElementById('mv-teinte').value='';
    document.getElementById('mv-qty').value='';
    document.getElementById('mv-op').value='';
    document.getElementById('mv-comment').value='';
  });

  document.getElementById('mv-search').addEventListener('input', e=>{
    mvSearch = e.target.value; renderMouvementsHistory();
  });

  renderMouvementsHistory();
}

function movementCreatedMillis(m){
  if(m.createdAt && typeof m.createdAt.toMillis === 'function') return m.createdAt.toMillis();
  return 0;
}

function renderMouvementsHistory(){
  const container = document.getElementById('mv-history');
  if(!container) return;
  let rows = [...state.movements].sort((a,b)=>{
    const da = a.date || '';
    const db = b.date || '';
    if(da !== db) return da < db ? 1 : -1; // most recent date first
    return movementCreatedMillis(b) - movementCreatedMillis(a);
  });
  const ql = mvSearch.trim().toLowerCase();
  if(ql){
    rows = rows.filter(m => String(m.reference).toLowerCase().includes(ql) || (m.teinte||'').toLowerCase().includes(ql));
  }
  if(mvFilTypeFilter && mvFilTypeFilter !== "Tous"){
    rows = rows.filter(m => filTypeOf(m) === mvFilTypeFilter);
  }
  if(rows.length === 0){
    container.innerHTML = `<div class="empty">Aucun mouvement.</div>`;
    return;
  }
  const rowsHtml = rows.map(m=>{
    const ft = filTypeOf(m);
    return `
    <tr>
      <td>${m.date ? escapeHtml(m.date) : '—'}</td>
      <td><span class="badge ${ft==='Lurex'?'fil-lurex':'fil-poly'}">${escapeHtml(ft)}</span></td>
      <td>${escapeHtml(m.reference)}</td>
      <td><span class="teinte-cell"><span class="swatch" style="background:${colorFor(m.teinte)}"></span>${escapeHtml(m.teinte||'—')}</span></td>
      <td><span class="badge ${m.type}">${m.type==='entree'?'Entrée':'Sortie'}</span></td>
      <td class="num">${fmtNum(m.quantite)}</td>
      <td>${escapeHtml(m.zone||'—')}</td>
      <td>${escapeHtml(m.operateur||'—')}</td>
      <td>${escapeHtml(m.commentaire||'—')}</td>
      <td><button class="ghost small" data-del="${m.id}">Supprimer</button></td>
    </tr>
  `;}).join('');
  container.innerHTML = `
    <table>
      <thead><tr>
        <th>Date</th><th>Type de fil</th><th>Référence</th><th>Teinte</th><th>Type</th>
        <th class="num">Quantité</th><th>Zone</th><th>Opérateur</th><th>Commentaire</th><th></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm("Supprimer ce mouvement ? Cette action met à jour le stock immédiatement pour tous les postes.")) return;
      movementsCol.doc(btn.dataset.del).delete().catch(err=>toast("Erreur : " + err.message));
    });
  });
}

function renderParametresPanel(){
  const panel = document.getElementById('panel-parametres');
  const overrideRows = Object.entries(state.overrides);
  panel.innerHTML = `
    <div class="params-grid">
      <div class="param-block">
        <h3 style="margin:0 0 12px; font-family:Georgia,serif; font-size:15px;">Seuils d'alerte par défaut</h3>
        <div class="param-row"><label>Seuil ROUGE (stock ≤ à cette valeur)</label><input type="number" id="th-rouge" value="${state.thresholds.rouge}"></div>
        <div class="param-row"><label>Seuil ORANGE (stock ≤ à cette valeur)</label><input type="number" id="th-orange" value="${state.thresholds.orange}"></div>
        <button class="small" id="save-thresholds">Enregistrer les seuils</button>

        <div class="section-title" style="font-size:13px; margin-top:22px;">Seuils spécifiques (facultatif)</div>
        <div class="hint" style="margin-top:-4px;">Pour une référence très consommée. Laisse vide pour utiliser les seuils par défaut.</div>
        <table class="override-table">
          <thead><tr><th>Référence</th><th>Seuil rouge</th><th>Seuil orange</th><th></th></tr></thead>
          <tbody id="override-rows">
            ${overrideRows.map(([ref,o])=>`
              <tr data-ref="${escapeHtml(ref)}">
                <td>${escapeHtml(ref)}</td>
                <td><input type="number" class="ov-rouge" value="${o.rouge ?? ''}"></td>
                <td><input type="number" class="ov-orange" value="${o.orange ?? ''}"></td>
                <td><button class="ghost small" data-del-ov="${escapeHtml(ref)}">Suppr.</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="add-zone-row">
          <input type="text" id="new-ov-ref" placeholder="Référence">
          <input type="number" id="new-ov-rouge" placeholder="Seuil rouge" style="max-width:110px;">
          <input type="number" id="new-ov-orange" placeholder="Seuil orange" style="max-width:110px;">
          <button class="small" id="add-override">Ajouter</button>
        </div>
      </div>

      <div class="param-block">
        <h3 style="margin:0 0 12px; font-family:Georgia,serif; font-size:15px;">Zones de stockage</h3>
        <div class="hint" style="margin-top:-6px;">Renomme ou ajoute des zones. L'orthographe doit correspondre à ce qui est saisi dans les mouvements ; sinon la quantité tombe dans « Zone non définie ».</div>
        <div class="zone-list" id="zone-list">
          ${state.zones.map(z=>`<span class="zone-chip">${escapeHtml(z)}<button data-del-zone="${escapeHtml(z)}">✕</button></span>`).join('')}
        </div>
        <div class="add-zone-row">
          <input type="text" id="new-zone" placeholder="Nouvelle zone…">
          <button class="small" id="add-zone">Ajouter</button>
        </div>

        <div class="section-title" style="font-size:13px;">Maintenance</div>
        <div class="hint" style="margin-top:-4px;">Attribue la date d'hier à tous les mouvements enregistrés sans date (action ponctuelle, à faire une seule fois).</div>
        <button class="small" id="backfill-dates">Attribuer la date d'hier aux mouvements sans date</button>

        <div class="section-title" style="font-size:13px;">Sauvegarde</div>
        <div class="hint" style="margin-top:-4px;">Exporter/importer un fichier de sauvegarde de tout le stock.</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${userCan(null,'export') ? `<button class="small" id="btn-export">Exporter une sauvegarde</button>` : ''}
          ${userCan(null,'import') ? `<button class="small" id="btn-import">Importer une sauvegarde</button><input type="file" id="file-import" accept="application/json" style="display:none">` : ''}
        </div>

        <div class="section-title" style="font-size:13px;">Réinitialiser</div>
        <div class="hint" style="margin-top:-4px;">Efface toutes les données de cet appareil et repart d'un stock vide.</div>
        <button class="danger small" id="reset-all">Réinitialiser toutes les données</button>
      </div>
    </div>

    <div class="param-block" style="margin-top:20px;">
      <h3 style="margin:0 0 4px; font-family:Georgia,serif; font-size:15px;">Utilisateurs</h3>
      <div class="hint" style="margin-top:0;">La gestion des comptes (créer un utilisateur, changer ses droits) se fait maintenant depuis l'écran principal de l'application (barre latérale de gauche), pour tous les modules à la fois.</div>
    </div>
  `;

  document.getElementById('save-thresholds').addEventListener('click', ()=>{
    state.thresholds.rouge = Number(document.getElementById('th-rouge').value) || 0;
    state.thresholds.orange = Number(document.getElementById('th-orange').value) || 0;
    saveState(); toast("Seuils enregistrés.");
  });

  document.getElementById('add-zone').addEventListener('click', ()=>{
    const val = document.getElementById('new-zone').value.trim();
    if(!val) return;
    if(state.zones.includes(val)){ toast("Cette zone existe déjà."); return; }
    state.zones.push(val); saveState(); renderParametresPanel();
  });
  panel.querySelectorAll('[data-del-zone]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.zones = state.zones.filter(z=>z!==btn.dataset.delZone);
      saveState(); renderParametresPanel();
    });
  });

  document.getElementById('add-override').addEventListener('click', ()=>{
    const ref = document.getElementById('new-ov-ref').value.trim();
    if(!ref) return;
    const rouge = document.getElementById('new-ov-rouge').value;
    const orange = document.getElementById('new-ov-orange').value;
    state.overrides[ref] = { rouge: rouge!==''?Number(rouge):null, orange: orange!==''?Number(orange):null };
    saveState(); renderParametresPanel();
  });
  panel.querySelectorAll('[data-del-ov]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      delete state.overrides[btn.dataset.delOv];
      saveState(); renderParametresPanel();
    });
  });
  panel.querySelectorAll('#override-rows tr').forEach(tr=>{
    const ref = tr.dataset.ref;
    tr.querySelector('.ov-rouge').addEventListener('change', e=>{
      state.overrides[ref].rouge = e.target.value!==''?Number(e.target.value):null; saveState();
    });
    tr.querySelector('.ov-orange').addEventListener('change', e=>{
      state.overrides[ref].orange = e.target.value!==''?Number(e.target.value):null; saveState();
    });
  });

  document.getElementById('backfill-dates').addEventListener('click', async ()=>{
    if(!confirm("Attribuer la date d'hier à tous les mouvements sans date, pour tous les postes ? Cette action est irréversible.")) return;
    toast("Mise à jour en cours…");
    try{
      const snap = await movementsCol.where('date', '==', null).get();
      if(snap.empty){
        toast("Aucun mouvement sans date trouvé.");
        return;
      }
      const y = yesterdayStr();
      for(const arr of chunkArray(snap.docs, 400)){
        const batch = db.batch();
        arr.forEach(d=>batch.update(d.ref, { date: y }));
        await batch.commit();
      }
      toast(`${snap.size} mouvement(s) mis à jour avec la date d'hier.`);
    }catch(err){
      toast("Erreur : " + err.message);
    }
  });

  document.getElementById('btn-export')?.addEventListener('click', exportBackup);
  document.getElementById('btn-import')?.addEventListener('click', ()=>document.getElementById('file-import').click());
  document.getElementById('file-import')?.addEventListener('change', importBackup);

  document.getElementById('reset-all').addEventListener('click', async ()=>{
    if(!confirm("Cette action efface tous les mouvements, réglages et zones pour TOUS LES POSTES connectés. Continuer ?")) return;
    if(!confirm("Confirme une dernière fois : repartir d'un stock totalement vide, pour tout le monde ?")) return;
    clearSession();
    toast("Réinitialisation en cours…");
    try{
      const snap = await movementsCol.get();
      for(const arr of chunkArray(snap.docs, 400)){
        const batch = db.batch();
        arr.forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
      await settingsRef.set({ zones: [...DEFAULT_ZONES], thresholds: {...DEFAULT_THRESHOLDS}, overrides: {}, users: [], usersEnabled: false });
      toast("Données réinitialisées.");
    }catch(err){
      toast("Erreur : " + err.message);
    }
  });
}

/* ---------- Backup / restore ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.toISOString().slice(0,10);
  a.href = url; a.download = `stock-fil-csb-sauvegarde-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Sauvegarde exportée.");
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.movements || !Array.isArray(data.movements)) throw new Error("format invalide");
      if(!confirm("Importer ce fichier va remplacer toutes les données actuelles pour TOUS LES POSTES connectés. Continuer ?")) return;
      toast("Import en cours…");
      (async ()=>{
        const snap = await movementsCol.get();
        for(const arr of chunkArray(snap.docs, 400)){
          const batch = db.batch();
          arr.forEach(d=>batch.delete(d.ref));
          await batch.commit();
        }
        for(const arr of chunkArray(data.movements, 400)){
          const batch = db.batch();
          arr.forEach(m=>{
            const { id, ...rest } = m;
            batch.set(movementsCol.doc(), rest);
          });
          await batch.commit();
        }
        await settingsRef.set({
          zones: data.zones || [...DEFAULT_ZONES],
          thresholds: data.thresholds || {...DEFAULT_THRESHOLDS},
          overrides: data.overrides || {},
          users: data.users || [],
          usersEnabled: typeof data.usersEnabled === 'boolean' ? data.usersEnabled : false
        });
        clearSession();
        toast("Sauvegarde importée pour tous les postes.");
      })().catch(err => toast("Erreur d'import : " + err.message));
    }catch(err){
      alert("Ce fichier ne semble pas être une sauvegarde valide de cette application.");
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- Init ---------- */
startSync();
CSBAuth.onChange(() => { if(firstSettingsLoaded && firstMovementsLoaded) render(); });
