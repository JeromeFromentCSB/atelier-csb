name: Build installers

# Se déclenche soit manuellement (bouton "Run workflow" sur GitHub), soit en poussant un tag
# de version (ex. v0.2.0) — pratique pour préparer une nouvelle version sans y penser à chaque
# push habituel sur le code.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-csb-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-csb-mac
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
