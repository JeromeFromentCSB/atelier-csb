<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Photos commandes · Atelier CSB</title>
<style>
  :root{
    --ink:#232320; --paper:#faf9f6; --paper-2:#f2f0ea; --line:#e5e1d6;
    --poste-yellow:#f5c518; --poste-yellow-dark:#c99a00;
    --silk-green:#3d7a57; --silk-red:#b3453a; --muted:#8a8478;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); }
  header{ position:sticky; top:0; background:var(--ink); color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top)); padding-top:calc(14px + env(safe-area-inset-top)); z-index:10; }
  header h1{ margin:0; font-size:1.05rem; }
  #search{ width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; margin:12px 0 0; }
  #filters{ display:flex; gap:8px; margin-top:10px; }
  #filters button{ flex:1; padding:9px 6px; border-radius:20px; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; font-size:.82rem; }
  #filters button.active{ background:var(--poste-yellow); color:var(--ink); border-color:var(--poste-yellow); font-weight:700; }
  main{ padding:12px 14px 40px; }
  .row{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .row .info{ flex:1; min-width:0; }
  .row .numero{ font-weight:700; font-size:.95rem; }
  .row .client{ color:var(--muted); font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .date{ color:var(--muted); font-size:.78rem; }
  .row .photobtn{ flex-shrink:0; width:52px; height:52px; border-radius:50%; border:none; background:var(--poste-yellow); font-size:1.4rem; display:flex; align-items:center; justify-content:center; }
  .row .photobtn.busy{ background:var(--muted); }
  .row .count{ flex-shrink:0; font-size:.72rem; color:var(--silk-green); font-weight:700; min-width:16px; text-align:center; }
  .empty, .hint{ color:var(--muted); text-align:center; padding:30px 10px; font-size:.9rem; }
  .group-header{ display:flex; align-items:center; gap:8px; margin:16px 0 6px; padding:8px 2px; cursor:pointer; user-select:none; }
  .group-header:first-child{ margin-top:0; }
  .group-header .chevron{ font-size:.7rem; color:var(--muted); transition:transform .15s; flex-shrink:0; }
  .group-header.collapsed .chevron{ transform:rotate(-90deg); }
  .group-header .name{ font-weight:700; font-size:.92rem; text-transform:uppercase; letter-spacing:.02em; }
  .group-header .n{ color:var(--muted); font-size:.78rem; }
  .group-rows.collapsed{ display:none; }
  .row .wabtn{ flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; background:var(--silk-green); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center; }
  .row .wabtn.busy{ background:var(--muted); }
  .row .eyebtn{ flex-shrink:0; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:1.1rem; display:flex; align-items:center; justify-content:center; }
  #detailOverlay{ display:none; position:fixed; inset:0; background:rgba(35,35,32,.6); z-index:50; align-items:flex-end; justify-content:center; }
  #detailOverlay.show{ display:flex; }
  #detailSheet{ background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #detailSheet h2{ margin:0 0 2px; font-size:1.02rem; }
  #detailSheet .sub{ color:var(--muted); font-size:.82rem; margin-bottom:14px; }
  .detail-line{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--paper-2); }
  .detail-line:last-child{ border-bottom:none; }
  .detail-line .titre{ font-weight:600; font-size:.9rem; }
  .detail-line .ref{ color:var(--muted); font-size:.76rem; margin-top:2px; }
  .detail-line .qte{ flex-shrink:0; font-size:.88rem; color:var(--muted); white-space:nowrap; }
  #detailCloseBtn{ width:100%; padding:13px; border-radius:10px; border:none; background:var(--paper-2); color:var(--ink); font-size:.95rem; font-weight:600; margin-top:8px; }
  #detailDeleteBtn{ width:100%; padding:13px; border-radius:10px; border:1px solid var(--silk-red); background:#fff; color:var(--silk-red); font-size:.88rem; font-weight:600; margin-top:14px; }
  #reassignOverlay{ display:none; position:fixed; inset:0; background:rgba(35,35,32,.6); z-index:60; align-items:flex-end; justify-content:center; }
  #reassignOverlay.show{ display:flex; }
  #reassignSheet{ background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; max-height:85vh; overflow-y:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #reassignSheet h2{ margin:0 0 2px; font-size:1.02rem; }
  #reassignSheet .sub{ color:var(--muted); font-size:.82rem; margin-bottom:12px; }
  #reassignSearch{ width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  #reassignList{ max-height:45vh; overflow-y:auto; margin-bottom:12px; }
  .reassign-row{ padding:11px 8px; border-bottom:1px solid var(--paper-2); cursor:pointer; }
  .reassign-row .numero{ font-weight:700; font-size:.9rem; }
  .reassign-row .client{ color:var(--muted); font-size:.8rem; }
  #reassignCancelBtn{ width:100%; padding:13px; border-radius:10px; border:none; background:var(--paper-2); color:var(--ink); font-size:.95rem; font-weight:600; }
  #waOverlay{ display:none; position:fixed; inset:0; background:rgba(35,35,32,.6); z-index:50; align-items:flex-end; justify-content:center; }
  #waOverlay.show{ display:flex; }
  #waSheet{ background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #waSheet h2{ margin:0 0 4px; font-size:1.02rem; }
  #waSheet .sub{ color:var(--muted); font-size:.82rem; margin-bottom:12px; }
  #waSheet input[type=tel], #waSheet input[type=email]{ width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; margin-bottom:12px; }
  #waChannel{ display:flex; gap:8px; margin-bottom:12px; }
  #waChannel button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:.92rem; font-weight:600; color:var(--muted); }
  #waChannel button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  #waEmailRow{ display:flex; gap:8px; align-items:flex-start; }
  #waEmailRow input{ flex:1; }
  #waEmailDefaultBtn{ flex-shrink:0; padding:12px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper-2); font-size:.85rem; }
  #waPhotos{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  #waPhotos img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:2px solid transparent; }
  #waPhotos img.selected{ border-color:var(--silk-green); }
  #waSheet .actions{ display:flex; gap:10px; }
  #waSheet button.big{ flex:1; padding:13px; border-radius:10px; border:none; font-size:.95rem; font-weight:700; }
  #waSendBtn{ background:var(--silk-green); color:#fff; }
  #waCancelBtn{ background:var(--paper-2); color:var(--ink); }
  #waSendBtn:disabled{ opacity:.5; }
  #toast{ position:fixed; left:14px; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); padding:12px 16px; border-radius:10px; font-size:.9rem; text-align:center; color:#fff; opacity:0; transform:translateY(20px); transition:all .25s; pointer-events:none; }
  #toast.show{ opacity:1; transform:translateY(0); }
  #toast.ok{ background:var(--silk-green); }
  #toast.err{ background:var(--silk-red); }
</style>
</head>
<body>
<header>
  <h1>📷 Photos par commande</h1>
  <input type="text" id="search" placeholder="Rechercher un client ou un n° de commande…">
  <div id="filters">
    <button data-filter="all">Tous</button>
    <button data-filter="non_facturees" class="active">Non facturées</button>
    <button data-filter="facturees">Facturées</button>
  </div>
</header>
<main>
  <div id="list"><div class="hint">Chargement…</div></div>
</main>
<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">

<div id="detailOverlay">
  <div id="detailSheet">
    <h2 id="detailTitle">Détail de la commande</h2>
    <div class="sub" id="detailSub"></div>
    <div id="detailLines"><div class="hint">Chargement…</div></div>
    <button type="button" id="detailDeleteBtn">🗑 Supprimer cette ligne (doublon/vide)</button>
    <button type="button" id="detailCloseBtn">Fermer</button>
  </div>
</div>

<div id="reassignOverlay">
  <div id="reassignSheet">
    <h2>Réassocier les photos</h2>
    <div class="sub" id="reassignSub"></div>
    <input type="text" id="reassignSearch" placeholder="Rechercher un client ou un n° de commande…">
    <div id="reassignList"></div>
    <button type="button" id="reassignCancelBtn">Annuler</button>
  </div>
</div>

<div id="waOverlay">
  <div id="waSheet">
    <h2>📤 Envoyer la photo</h2>
    <div class="sub" id="waSub"></div>
    <div id="waChannel">
      <button type="button" data-channel="email" class="active">✉️ Email</button>
      <button type="button" data-channel="whatsapp">WhatsApp</button>
    </div>
    <div id="waPhotos"><div class="hint">Chargement des photos…</div></div>
    <div id="waEmailRow">
      <input type="email" id="waEmail" placeholder="Adresse email du destinataire" autocapitalize="off" autocorrect="off">
      <button type="button" id="waEmailDefaultBtn" title="Utiliser cette adresse par défaut à chaque envoi">☆ Par défaut</button>
    </div>
    <input type="tel" id="waPhone" placeholder="Numéro de téléphone (ex. 06 12 34 56 78)" style="display:none;">
    <div class="actions">
      <button class="big" id="waCancelBtn">Annuler</button>
      <button class="big" id="waSendBtn" disabled>Envoyer</button>
    </div>
  </div>
</div>

<script>
// Page servie par PocketBase lui-même (dossier pb_public) : les appels /api/... sont donc
// toujours sur la même origine que cette page, pas besoin de configurer d'URL.
let items = [];
let pendingContract = null;
let currentFilter = 'non_facturees';
const fileInput = document.getElementById('fileInput');

// Clients dont le groupe est déplié — repliés par défaut, mémorisé sur ce téléphone d'une
// ouverture à l'autre (seuls ceux explicitement dépliés sont retenus).
const EXPANDED_CLIENTS_KEY = 'csb_photo_expanded_clients';
let expandedClients = new Set();
try{ expandedClients = new Set(JSON.parse(localStorage.getItem(EXPANDED_CLIENTS_KEY)) || []); }catch(e){}
function saveExpandedClients(){
  try{ localStorage.setItem(EXPANDED_CLIENTS_KEY, JSON.stringify(Array.from(expandedClients))); }catch(e){}
}

// Le petit serveur d'envoi (whatsapp-server/, qui gère WhatsApp ET l'email) tourne sur le PC de
// l'atelier (adresse fixe sur le réseau local), pas forcément sur la même machine que PocketBase
// (qui sert cette page) — donc pas de raccourci via location.hostname ici, il faut la vraie
// adresse de ce PC.
const WHATSAPP_BASE = 'http://192.168.1.32:8092';
const POCKETBASE_LAN = 'http://192.168.1.142:8090';
let waContractId = null;
let waSelectedUrl = null;
const waOverlay = document.getElementById('waOverlay');
const waPhotos = document.getElementById('waPhotos');
const waPhone = document.getElementById('waPhone');
const waEmail = document.getElementById('waEmail');
const waSendBtn = document.getElementById('waSendBtn');

// Canal d'envoi (email par défaut : l'envoi de photo par WhatsApp est cassé pour le moment côté
// bibliothèque) et adresse email par défaut, mémorisés sur ce téléphone.
const CHANNEL_KEY = 'csb_send_channel';
const DEFAULT_EMAIL_KEY = 'csb_default_email';
let waChannel = 'email';
try{ waChannel = localStorage.getItem(CHANNEL_KEY) === 'whatsapp' ? 'whatsapp' : 'email'; }catch(e){}
function applyChannel(channel){
  waChannel = channel;
  try{ localStorage.setItem(CHANNEL_KEY, channel); }catch(e){}
  document.querySelectorAll('#waChannel button').forEach(b => b.classList.toggle('active', b.dataset.channel === channel));
  document.getElementById('waEmailRow').style.display = channel === 'email' ? 'flex' : 'none';
  waPhone.style.display = channel === 'whatsapp' ? 'block' : 'none';
}
document.querySelectorAll('#waChannel button').forEach(b => {
  b.addEventListener('click', () => applyChannel(b.dataset.channel));
});
document.getElementById('waEmailDefaultBtn').addEventListener('click', () => {
  const v = waEmail.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ showToast('✘ Saisis d\'abord une adresse email valide', false); return; }
  try{ localStorage.setItem(DEFAULT_EMAIL_KEY, v); showToast('✔ Adresse mémorisée par défaut', true); }
  catch(e){ showToast('✘ Impossible de mémoriser sur ce téléphone', false); }
});
applyChannel(waChannel);

function showToast(msg, ok){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'ok show' : 'err show';
  setTimeout(() => { t.className = t.className.replace('show', ''); }, 2500);
}

async function loadList(){
  try{
    const res = await fetch('/api/collections/commandes_index/records?perPage=500&sort=-updated');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    items = json.items || [];
    render();
  }catch(e){
    document.getElementById('list').innerHTML = `<div class="hint">Erreur de chargement : ${e.message}<br>Vérifie que la collection "commandes_index" existe dans PocketBase.</div>`;
  }
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let filtered = items;
  if(currentFilter === 'facturees') filtered = filtered.filter(it => !!it.facturee);
  else if(currentFilter === 'non_facturees') filtered = filtered.filter(it => !it.facturee);
  if(q){
    filtered = filtered.filter(it =>
      (it.numero_commande || '').toLowerCase().includes(q) ||
      (it.client || '').toLowerCase().includes(q)
    );
  }
  const box = document.getElementById('list');
  if(!filtered.length){
    box.innerHTML = '<div class="empty">Aucune commande. Ouvre l\'onglet Commande sur le PC et clique sur « Actualiser » pour synchroniser la liste.</div>';
    return;
  }
  // Regroupement par client : un en-tête par client (ordre alphabétique), les commandes de
  // chacun gardant leur ordre d'origine (plus récentes en premier) à l'intérieur du groupe.
  const groups = new Map();
  filtered.forEach(it => {
    const key = (it.client || '').trim() || '(Sans client)';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  });
  const sortedClients = Array.from(groups.keys()).sort((a, b) =>
    a === '(Sans client)' ? 1 : b === '(Sans client)' ? -1 : a.localeCompare(b, 'fr', { sensitivity:'base' })
  );
  box.innerHTML = sortedClients.map(client => {
    const collapsed = !expandedClients.has(client);
    return `
    <div class="group-header${collapsed ? ' collapsed' : ''}" data-group="${escapeHtml(client)}">
      <span class="chevron">▾</span><span class="name">${escapeHtml(client)}</span><span class="n">${groups.get(client).length}</span>
    </div>
    <div class="group-rows${collapsed ? ' collapsed' : ''}">
      ${groups.get(client).map(it => `
        <div class="row" data-contract="${it.contract_id}">
          <div class="info">
            <div class="numero">${escapeHtml(it.numero_commande || '(sans numéro)')}</div>
            ${it.date ? `<div class="date">${escapeHtml(formatDateFR(it.date))}</div>` : ''}
          </div>
          <span class="count" data-count="${it.contract_id}"></span>
          <button class="eyebtn" data-detail="${it.contract_id}" title="Détail de la commande">👁</button>
          <button class="wabtn" data-wa="${it.contract_id}" title="Envoyer la photo (email / WhatsApp)">📤</button>
          <button class="photobtn" data-take="${it.contract_id}">📷</button>
        </div>
      `).join('')}
    </div>
  `;
  }).join('');
  box.querySelectorAll('.group-header').forEach(header => {
    header.addEventListener('click', () => {
      const client = header.dataset.group;
      if(expandedClients.has(client)) expandedClients.delete(client);
      else expandedClients.add(client);
      saveExpandedClients();
      header.classList.toggle('collapsed');
      header.nextElementSibling.classList.toggle('collapsed');
    });
  });
  box.querySelectorAll('[data-take]').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingContract = btn.dataset.take;
      fileInput.value = '';
      fileInput.click();
    });
  });
  box.querySelectorAll('[data-wa]').forEach(btn => {
    btn.addEventListener('click', () => openWhatsAppSheet(btn.dataset.wa));
  });
  box.querySelectorAll('[data-detail]').forEach(btn => {
    btn.addEventListener('click', () => openDetailSheet(btn.dataset.detail));
  });
  loadCounts(filtered.map(it => it.contract_id));
}

async function loadCounts(contractIds){
  for(const id of contractIds){
    fetch(`/api/collections/commande_photos/records?filter=${encodeURIComponent(`(contract_id='${id}')`)}&perPage=1&skipTotal=0`)
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if(!json) return;
        const el = document.querySelector(`[data-count="${id}"]`);
        if(el && json.totalItems) el.textContent = json.totalItems;
      }).catch(() => {});
  }
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  if(!file || !pendingContract) return;
  const contractId = pendingContract;
  const btn = document.querySelector(`[data-take="${contractId}"]`);
  if(btn){ btn.disabled = true; btn.classList.add('busy'); btn.textContent = '…'; }
  try{
    const form = new FormData();
    form.append('contract_id', contractId);
    form.append('photo', file, file.name || 'photo.jpg');
    const res = await fetch('/api/collections/commande_photos/records', { method:'POST', body:form });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    showToast('✔ Photo enregistrée', true);
    loadCounts([contractId]);
    if(confirm('Photo enregistrée. L\'envoyer maintenant (email ou WhatsApp) ?')){
      openWhatsAppSheet(contractId, { autoSelectLatest:true });
    }
  }catch(e){
    showToast('✘ Échec : ' + e.message, false);
  }
  if(btn){ btn.disabled = false; btn.classList.remove('busy'); btn.textContent = '📷'; }
  pendingContract = null;
});

// ---------- Détail de la commande (lignes) ----------
let detailPbId = null;
let detailContractId = null;
function openDetailSheet(contractId){
  const it = items.find(x => String(x.contract_id) === String(contractId));
  detailPbId = it ? it.id : null;
  detailContractId = contractId;
  document.getElementById('detailTitle').textContent = (it && it.numero_commande) || 'Détail de la commande';
  document.getElementById('detailSub').textContent = (it && it.client) || '';
  const box = document.getElementById('detailLines');
  let lignes = [];
  try{ lignes = it && it.lignes_json ? JSON.parse(it.lignes_json) : []; }catch(e){ lignes = []; }
  box.innerHTML = lignes.length
    ? lignes.map(l => `
        <div class="detail-line">
          <div>
            <div class="titre">${escapeHtml(l.titre || '(sans titre)')}</div>
            ${l.ref ? `<div class="ref">Réf : ${escapeHtml(l.ref)}</div>` : ''}
          </div>
          <div class="qte">${l.qte || 0}${l.unite ? ' ' + escapeHtml(l.unite) : ''}</div>
        </div>
      `).join('')
    : '<div class="hint">Aucune ligne trouvée pour cette commande — actualise l\'onglet Commande sur le PC.</div>';
  document.getElementById('detailOverlay').classList.add('show');
}
document.getElementById('detailCloseBtn').addEventListener('click', () => {
  document.getElementById('detailOverlay').classList.remove('show');
});
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'detailOverlay') e.target.classList.remove('show');
});
document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
  if(!detailPbId) return;
  try{
    const filter = encodeURIComponent(`contract_id='${detailContractId}'`);
    const res = await fetch(`/api/collections/commande_photos/records?filter=(${filter})&perPage=200`);
    const photos = res.ok ? ((await res.json()).items || []) : [];
    if(photos.length){
      openReassignSheet(photos);
    }else{
      if(!confirm('Supprimer cette ligne de commande de la liste ?')) return;
      await deleteCommandeIndexLine();
    }
  }catch(e){
    showToast('✘ Erreur : ' + e.message, false);
  }
});
async function deleteCommandeIndexLine(){
  try{
    const res = await fetch(`/api/collections/commandes_index/records/${detailPbId}`, { method:'DELETE' });
    if(!res.ok){
      const body = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}${body ? ' — ' + body.slice(0,150) : ''}`);
    }
    items = items.filter(x => x.id !== detailPbId);
    document.getElementById('detailOverlay').classList.remove('show');
    showToast('✔ Ligne supprimée', true);
    render();
  }catch(e){
    showToast('✘ Échec de la suppression : ' + e.message, false);
  }
}

// ---------- Réassociation des photos avant suppression d'une ligne en double ----------
const reassignOverlay = document.getElementById('reassignOverlay');
const reassignList = document.getElementById('reassignList');
let reassignPhotos = [];
function openReassignSheet(photos){
  reassignPhotos = photos;
  const deletedIt = items.find(x => String(x.contract_id) === String(detailContractId));
  reassignClient = (deletedIt && deletedIt.client || '').trim();
  document.getElementById('reassignSub').textContent = reassignClient
    ? `${photos.length} photo${photos.length > 1 ? 's' : ''} sur cette ligne — choisis parmi les commandes de « ${reassignClient} » celle à laquelle les rattacher.`
    : `${photos.length} photo${photos.length > 1 ? 's' : ''} sur cette ligne — cette ligne n'a pas de client renseigné, choisis la commande à laquelle les rattacher parmi toutes.`;
  document.getElementById('reassignSearch').value = '';
  renderReassignList('');
  reassignOverlay.classList.add('show');
}
let reassignClient = '';
function renderReassignList(q){
  const query = q.trim().toLowerCase();
  const candidates = items.filter(it => String(it.contract_id) !== String(detailContractId) &&
    (!reassignClient || (it.client || '').trim().toLowerCase() === reassignClient.toLowerCase()) &&
    (!query || (it.numero_commande || '').toLowerCase().includes(query) || (it.client || '').toLowerCase().includes(query)));
  reassignList.innerHTML = candidates.length
    ? candidates.map(it => `
        <div class="reassign-row" data-target="${it.contract_id}">
          <div class="numero">${escapeHtml(it.numero_commande || '(sans numéro)')}</div>
          <div class="client">${escapeHtml(it.client || '')}</div>
        </div>
      `).join('')
    : '<div class="hint">Aucune commande trouvée.</div>';
  reassignList.querySelectorAll('[data-target]').forEach(row => {
    row.addEventListener('click', () => confirmReassign(row.dataset.target));
  });
}
document.getElementById('reassignSearch').addEventListener('input', (e) => renderReassignList(e.target.value));
document.getElementById('reassignCancelBtn').addEventListener('click', () => reassignOverlay.classList.remove('show'));
reassignOverlay.addEventListener('click', (e) => { if(e.target === reassignOverlay) reassignOverlay.classList.remove('show'); });
async function confirmReassign(targetContractId){
  const target = items.find(it => String(it.contract_id) === String(targetContractId));
  if(!confirm(`Rattacher ${reassignPhotos.length} photo(s) à « ${target ? (target.numero_commande || target.client) : targetContractId} » puis supprimer cette ligne ?`)) return;
  try{
    for(const p of reassignPhotos){
      const res = await fetch(`/api/collections/commande_photos/records/${p.id}`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contract_id: targetContractId })
      });
      if(!res.ok){
        const body = await res.text().catch(() => '');
        throw new Error(`réattribution photo — HTTP ${res.status}${body ? ' — ' + body.slice(0,150) : ''}`);
      }
    }
    reassignOverlay.classList.remove('show');
    await deleteCommandeIndexLine();
  }catch(e){
    showToast('✘ Échec de la réattribution : ' + e.message, false);
  }
}

// ---------- Envoi WhatsApp ----------
async function openWhatsAppSheet(contractId, opts){
  waContractId = contractId;
  waSelectedUrl = null;
  waSendBtn.disabled = true;
  const it = items.find(x => String(x.contract_id) === String(contractId));
  document.getElementById('waSub').textContent = (it && (it.numero_commande || it.client)) ? `${it.numero_commande || ''} ${it.client ? '— ' + it.client : ''}`.trim() : '';
  waPhone.value = (it && it.tel) || '';
  try{ waEmail.value = localStorage.getItem(DEFAULT_EMAIL_KEY) || ''; }catch(e){ waEmail.value = ''; }
  waPhotos.innerHTML = '<div class="hint">Chargement des photos…</div>';
  waOverlay.classList.add('show');
  try{
    const filter = encodeURIComponent(`contract_id='${contractId}'`);
    const res = await fetch(`/api/collections/commande_photos/records?filter=(${filter})&sort=-created&perPage=30`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const photoItems = (await res.json()).items || [];
    if(!photoItems.length){
      waPhotos.innerHTML = '<div class="hint">Aucune photo pour cette commande.</div>';
      return;
    }
    waPhotos.innerHTML = photoItems.map(p => {
      const url = `/api/files/${p.collectionId}/${p.id}/${p.photo}`;
      return `<img src="${url}?thumb=200x200" data-full="${url}">`;
    }).join('');
    waPhotos.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => selectWaPhoto(img));
    });
    if(opts && opts.autoSelectLatest){
      const first = waPhotos.querySelector('img');
      if(first) selectWaPhoto(first);
    }
  }catch(e){
    waPhotos.innerHTML = `<div class="hint">Erreur de chargement : ${escapeHtml(e.message)}</div>`;
  }
}
function selectWaPhoto(img){
  waPhotos.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
  img.classList.add('selected');
  waSelectedUrl = img.dataset.full;
  waSendBtn.disabled = false;
}
function closeWhatsAppSheet(){
  waOverlay.classList.remove('show');
  waContractId = null;
  waSelectedUrl = null;
}
document.getElementById('waCancelBtn').addEventListener('click', closeWhatsAppSheet);
waOverlay.addEventListener('click', (e) => { if(e.target === waOverlay) closeWhatsAppSheet(); });
waSendBtn.addEventListener('click', async () => {
  const byEmail = waChannel === 'email';
  if(!waSelectedUrl){ showToast('✘ Touche d\'abord une photo pour la sélectionner', false); return; }
  if(byEmail && !waEmail.value.trim()){ showToast('✘ Indique une adresse email', false); return; }
  if(!byEmail && !waPhone.value.trim()){ showToast('✘ Indique un numéro de téléphone', false); return; }
  waSendBtn.disabled = true;
  waSendBtn.textContent = 'Envoi…';
  try{
    // Le serveur d'envoi (sur le PC de l'atelier) va chercher la photo lui-même : on lui donne
    // toujours l'adresse locale de PocketBase, jamais celle utilisée par le téléphone (qui peut
    // être l'adresse Tailscale hors de l'atelier, que ce PC ne sait pas joindre).
    const photoUrl = POCKETBASE_LAN + waSelectedUrl;
    const it = items.find(x => String(x.contract_id) === String(waContractId));
    const orderLabel = it ? `${it.numero_commande || ''} ${it.client ? '— ' + it.client : ''}`.trim() : '';
    const res = await fetch(WHATSAPP_BASE + (byEmail ? '/send-email' : '/send'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(byEmail
        ? { to: waEmail.value.trim(), photoUrl, subject: 'Photo commande' + (orderLabel ? ' ' + orderLabel : '') + ' — Atelier CSB' }
        : { phone: waPhone.value.trim(), photoUrl })
    });
    const json = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
    showToast(byEmail ? '✔ Envoyé par email' : '✔ Envoyé sur WhatsApp', true);
    closeWhatsAppSheet();
  }catch(e){
    showToast('✘ Échec de l\'envoi : ' + e.message, false);
    waSendBtn.disabled = false;
  }
  waSendBtn.textContent = 'Envoyer';
});

function formatDateFR(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function escapeHtml(str){
  return (str == null ? '' : String(str)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('#filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});
loadList();
</script>
